# Каталог на специалностите и учебните им планове.
#
# Това са ДАННИ – променят се тук и се качват с `pnpm catalog:push`.
# Източници и уговорки: docs/research/vsu.md, docs/research/uasg.md,
# docs/research/vsu-razpisania.md.
#
# Ключовете в `plan` са „<курс><семестър>“: 1w = I курс зимен, 1s = I курс летен.

# Модули със съдържание в платформата (един модул се ползва от много специалности).
modules:
  - slug: saprotivlenie-na-materialite
    title: Съпротивление на материалите
    description: Разрезни усилия, геометрични характеристики, напрежения, огъване, усукване, изкълчване.
    sort: 1
  - slug: teoretichna-mehanika-1
    title: Теоретична механика – I част
    description: Редукция на системи сили, равновесие, герберови греди, триставни системи, ферми.
    sort: 2
  - slug: inzhenerna-geologiya
    title: Инженерна геология и хидрогеология
    description: Скали и строителни почви, геоложки процеси, подземни води, инженерно-геоложки проучвания.
    sort: 3
  - slug: stroitelni-mashini
    title: Строителни машини
    description: Машинни елементи, кранове, машини за бетон и разтвори, машини за пилоти.
    sort: 4

