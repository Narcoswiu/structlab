title: "Маркетинг"
slug: "marketing"
summary: "Маркетинг концепция, маркетингови инструменти и проучвания на строителния пазар и на пазара на недвижими имоти."
why: "Строителната фирма и инвеститорът решават какво да строят, за кого и на каква цена според проучване на търсенето и на конкурентите."
related: ["Бизнес планиране", "Предприемачество", "Ценообразуване в строителството"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "Информационен пакет с анотации на специалност „Управление в строителството“ в УАСГ (III семестър, 4 кредита, катедра „Организация и икономика на строителството“). Анотацията посочва три групи въпроси: съдържание на маркетинг концепцията; маркетингов инструментариум за фирмената политика; маркетингови проучвания и анализ на инвестиционните пазари и пазарите на ползване на недвижими имоти. Пълна програма по теми не е намерена – разбивката на трите групи по глави е наша, по стандартното съдържание на дисциплината."
chapters:
  - title: "Същност на маркетинга и маркетинг концепция"
    summary: "Клиентът и неговите потребности като център на фирмената политика."
  - title: "Маркетингова среда"
    summary: "Фактори на микро- и макросредата и конкурентна среда на фирмата."
  - title: "Поведение на клиентите"
    summary: "Как потребители и организации вземат решение за покупка."
  - title: "Маркетингови проучвания"
    summary: "Етапи на проучването, събиране и анализ на първични и вторични данни."
  - title: "Сегментиране, целеви пазар и позициониране"
    summary: "Разделяне на пазара на сегменти, избор на целеви клиенти и позициониране."
  - title: "Продуктова политика"
    summary: "Продукт, качество и жизнен цикъл; строителният продукт и услугата."
  - title: "Ценова политика"
    summary: "Цели, фактори и методи на ценообразуването от маркетингова гледна точка."
  - title: "Пласментна политика"
    summary: "Канали за реализация на продукта и работа с посредници."
  - title: "Комуникационна политика"
    summary: "Реклама, връзки с обществеността, лични продажби и насърчаване на продажбите."
  - title: "Анализ на инвестиционните пазари"
    summary: "Проучване на търсенето, предлагането и доходността на пазара на имоти като инвестиция."
  - title: "Анализ на пазарите на ползване на недвижими имоти"
    summary: "Проучване на търсенето и предлагането на площи по видове имоти."
  - title: "Маркетингова стратегия и план на фирмата"
    summary: "Обединяване на анализите и инструментите в маркетингов план."
