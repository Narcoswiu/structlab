title: "Автоматизация на инженерния труд – II част"
slug: "avtomatizatsiya-na-inzhenerniya-trud-2-chast"
summary: "Компютърна графика, чертане със система за компютърно проектиране и работа с релационни бази данни."
why: "Строителният мениджър чете и коригира чертежи и поддържа данните на проекта в бази данни."
related: ["Автоматизация на инженерния труд – I част", "Автоматизация на инженерния труд", "Информатика"]
source:
  status: "unverified"
  url: ""
  note: "В учебния план на УАСГ за „Управление в строителството“ дисциплината е във II семестър с 30 ч. лекции и 30 ч. упражнения и 4 кредита, но във файла с анотации няма анотация за нея и друга официална програма не е намерена. Главите са предположение по анотациите на сродните дисциплини в ССС („Програмиране и използване на изчислителните системи“ и „Автоматизация на инженерния труд“); разпределението между I и II част не е потвърдено."
chapters:
  - title: "Основи на компютърната графика"
    summary: "Растерна и векторна графика, координатни системи и трансформации."
  - title: "Работна среда на CAD системата"
    summary: "Интерфейс, координати, единици и точно въвеждане на точки."
  - title: "Изчертаване и редактиране"
    summary: "Основни обекти и команди за промяна на чертежа."
  - title: "Пластове и блокове"
    summary: "Организация на чертежа по пластове и многократно използване на блокове."
  - title: "Оразмеряване, надписи и печат"
    summary: "Размери, текст, щриховки и отпечатване в мащаб."
  - title: "Бази данни и СУБД"
    summary: "Принципи на изграждане, видове системи и използването им."
  - title: "Релационен модел"
    summary: "Таблици, ключове и връзки между таблиците."
  - title: "Заявки, форми и справки"
    summary: "Извличане и представяне на данни от базата."
