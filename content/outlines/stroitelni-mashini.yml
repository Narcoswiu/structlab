title: "Строителни машини"
slug: "stroitelni-mashini"
summary: "Устройство, действие и избор на машините на строежа: кранове, подемници, машини за бетон и за пилоти."
why: "Изборът на кран, помпа или смесител определя срока, цената и безопасността на строежа."
related: ["Строителни машини и механизация", "Технология на строителството – I част"]
source:
  status: "unverified"
  url: ""
  note: "Не е намерена публикувана програма с всички теми; главите следват лекционните теми на курса, три от които още не са уточнени."
chapters:
  - title: "Машинни елементи и възли"
    summary: "От какви части е сглобена всяка машина, как се предава въртенето и защо частите от различни заводи си пасват."
  - title: "Въжета, полиспасти и лебедки"
    summary: "С какво всеки кран вдига товара: стоманено въже, макари, барабан – и защо тънко въже удържа тонове."
  - title: "Кулови кранове"
    summary: "Как е устроен кулов кран, защо не се преобръща и какво казва товарната му характеристика."
  - title: "Самоходни стрелови кранове"
    summary: "Автомобилни, пневмоколесни и верижни кранове – кога са по-добри от кулов и какво ги ограничава."
  - title: "Мостови, портални и кабелни кранове"
    summary: "Кранове, които се движат по релси или по въже – в цех, на склад и над язовирна стена."
  - title: "Подемници и транспортьори"
    summary: "Машините, които качват материали и хора по фасадата и пренасят насипни товари по площадката."
  - title: "Машини за приготвяне на бетон и разтвори"
    summary: "Как съставките се дозират и разбъркват – гравитачни и принудителни смесители, бетонов възел."
  - title: "Машини за транспортиране и полагане на бетон и разтвори"
    summary: "От бетоновия възел до кофража: автобетоносмесител, бетон-помпа, вибратор."
  - title: "Машини за набиване на пилоти"
    summary: "Как пилотът влиза в земята – с удар, с вибрации или с натиск – и коя машина за коя почва."
