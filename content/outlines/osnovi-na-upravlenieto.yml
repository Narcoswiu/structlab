title: "Основи на управлението"
slug: "osnovi-na-upravlenieto"
summary: "Основните функции на управлението – планиране, организиране, мотивиране и контрол – и работата на ръководителя в организацията."
why: "Всеки технически ръководител, ръководител на обект или собственик на фирма управлява хора, срокове и пари, а не само конструкции."
related: ["Основи на управление в строителството", "Управление на строителна фирма"]
source:
  status: "unverified"
  url: ""
  note: "Актуална учебна програма или анотация на ВСУ за дисциплината (специалност „Строителен мениджмънт“) не е намерена – на vsu.bg няма публикувани програми. Архивната страница с анотации на ВСУ (план 2014) покрива само специалност ССС; там има сродна дисциплина „Строителен мениджмънт“ (системен подход, стратегическо, оперативно и ситуационно управление, трудови ресурси, власт и влияние), но тя не е същата. Главите са по стандартното съдържание на дисциплината и не са сверени с учебна програма – да се проверят с катедрата."
chapters:
  - title: "Същност на управлението и роля на ръководителя"
    summary: "Управлението като дейност, равнища на управление, роли и умения на ръководителя."
  - title: "Основни подходи в управлението"
    summary: "Процесен, системен и ситуационен подход към управлението на организацията."
  - title: "Организацията и нейната среда"
    summary: "Вътрешна и външна среда, заинтересовани страни, фактори с пряко и косвено въздействие."
  - title: "Планиране и поставяне на цели"
    summary: "Мисия, цели, стратегическо и оперативно планиране."
  - title: "Организиране и организационни структури"
    summary: "Разделение на труда, делегиране на права, линейни, функционални и матрични структури."
  - title: "Мотивация"
    summary: "Потребности и стимули, основни теории за мотивацията и приложението им на работното място."
  - title: "Власт, влияние и лидерство"
    summary: "Източници на власт, стилове на ръководство, поведение на ръководителя."
  - title: "Комуникации в организацията"
    summary: "Комуникационен процес, канали, пречки пред общуването и начини за преодоляването им."
  - title: "Вземане на управленски решения"
    summary: "Видове решения, етапи на вземане на решение, прости методи за избор между варианти."
  - title: "Контрол"
    summary: "Предварителен, текущ и последващ контрол, показатели и обратна връзка."
  - title: "Особености на управлението в строителството"
    summary: "Строителната фирма като производствена система, работа по обекти и по проекти."
