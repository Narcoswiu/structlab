title: "Геодезия"
slug: "geodeziya"
summary: "Измерване на ъгли, дължини и превишения, изработване на топографски план и трасиране на сгради и съоръжения."
why: "Строителният инженер чете геодезически планове, пренася проекта върху терена и следи деформациите на строежа."
related: ["Инженерна геодезия"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивна анотация на ВСУ, дисциплина ССС-9 „Геодезия“ по учебен план от 2014 г. (45 ч. лекции, 30 ч. упражнения, учебна практика 40 ч.). Анотацията изброява темите накратко; разделянето на глави е наше. Не е потвърдено, че важи за текущия план."
chapters:
  - title: "Мерни единици и координатни системи"
    summary: "Форма на Земята, мерни единици за ъгли и дължини, координатни и височинни системи, мащаб."
  - title: "Елементи от теорията на грешките"
    summary: "Видове грешки при измерване, средна квадратна грешка и обработка на резултатите от измерванията."
  - title: "Измерване на ъгли"
    summary: "Теодолит и тотална станция, хоризонтални посоки и зенитни ъгли, проверки на инструмента."
  - title: "Измерване на дължини"
    summary: "Измерване с ролетка и с електронен далекомер, редукции на измерените дължини."
  - title: "Нивелация и превишения"
    summary: "Геометрична и тригонометрична нивелация, нивелир, нивелачен карнет и изчисляване на коти."
  - title: "Работна геодезическа основа"
    summary: "Полигонови ходове и засечки, изчисляване на координати на точките от основата."
  - title: "Топографска снимка, планове и карти"
    summary: "Полярна снимка, изобразяване на релефа с хоризонтали и изработване на топографски план."
  - title: "Проектиране и трасиране на сгради и съоръжения"
    summary: "Трасировъчен план, пренасяне на оси, ъгли, дължини и коти от проекта върху терена."
  - title: "Изследване на деформации"
    summary: "Геодезическо следене на слягания и хоризонтални премествания на сгради и съоръжения."
