title: "Мостове"
slug: "mostove"
summary: "Видове и елементи на мостовете, въздействия по Еврокод и проектиране на стоманобетонни пътни мостове с гредова връхна конструкция."
why: "Нужна е при проектиране, строителство и поддръжка на пътни надлези и мостове."
related: ["Стоманобетонни мостове", "Стоманени и комбинирани мостове"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивно копие на официалния сайт на ВСУ (анотации на специалност ССС, учебен план от 2014 г.); може да не е актуално. Дисциплина ССС-40 „Мостове“ с изброени теми и курсов проект на стоманобетонен пътен мост; главите следват тези теми."
chapters:
  - title: "Мостово строителство и класификации"
    summary: "Предназначение и особености на мостовете, класификации, основни и допълнителни елементи."
  - title: "Изходни данни и композиционно решение"
    summary: "Данни за проектиране, избор на конструктивна форма, статическа схема, отвори и материал."
  - title: "Монолитни и сглобяеми мостови конструкции"
    summary: "Конструктивно оформяне на връхната конструкция при монолитно и сглобяемо изпълнение."
  - title: "Пътно платно и обзавеждане на моста"
    summary: "Настилка, хидроизолация, отводняване, тротоари, парапети, преходни конструкции, лагери и фуги."
  - title: "Въздействия върху мостовете"
    summary: "Постоянни и променливи въздействия при пътни мостове по БДС EN 1991-2."
  - title: "Пространствена работа на гредовата конструкция"
    summary: "Конструктивен анализ на мостовата плоча и на главните греди като гредоскара."
  - title: "Проверки по гранични състояния"
    summary: "Носимоспособност по нормални и наклонени сечения; ограничаване на напрежения, пукнатини и премествания."
  - title: "Предварително напрегнати мостови елементи"
    summary: "Същност и видове напрягане, определяне на напрегнатата армировка, загуби от съсъхване и пълзене."
  - title: "Мостови опори и фундаменти"
    summary: "Товарни състояния и основни оразмерителни проверки на устои, стълбове и фундаменти."
  - title: "Технологии, експлоатация и усилване"
    summary: "Съвременни технологии за изграждане; експлоатация, ремонт и усилване на мостови конструкции."
