title: "Пътно и железопътно строителство"
slug: "patno-i-zhelezopatno-stroitelstvo"
summary: "Проектиране на път в план, надлъжен и напречен профил, пътни настилки и устройство на железопътната линия."
why: "Всеки строеж има транспортен достъп, а пътищата и железниците са голям дял от строителството – инженерът трябва да чете и изпълнява такива проекти."
related: ["Пътно строителство", "Железопътно строителство", "Транспортно строителство"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивирана официална страница с анотации на ВСУ за специалност ССС, учебен план от 2014 г. (дисциплина ССС-18, III и IV семестър, курсов проект по пътно строителство). Анотацията изброява темите на курса; главите ги следват. По-нова учебна програма не е намерена."
chapters:
  - title: "Класификация и елементи на пътищата"
    summary: "Общи технически изисквания, класификация, трасировъчни и конструктивни елементи на пътя."
  - title: "Трасе на пътя в план"
    summary: "Избор на радиуси на хоризонталните криви, изчисляване и прилагане на преходни криви."
  - title: "Надлъжен профил на пътя"
    summary: "Нивелета, радиуси и трасиране на вертикалните криви, осигуряване на видимост."
  - title: "Уширение и преоформяне на настилката в крива"
    summary: "Уширение на настилката и преход на напречния наклон при хоризонтални криви."
  - title: "Пътно платно и взаимодействие с превозните средства"
    summary: "Типове пътни платна и взаимодействие между пътя и превозните средства."
  - title: "Напречни профили и земни работи"
    summary: "Напречни профили на пътя и оптимизиране на земните работи чрез разпределение на земните маси."
  - title: "Конструкция на пътната настилка"
    summary: "Земно легло, основа на настилката и видове пътни покрития."
  - title: "Асфалтови смеси и асфалтобетонни настилки"
    summary: "Състав на асфалтовите смеси и технология за изпълнение на асфалтобетонни настилки."
  - title: "Бетонни настилки"
    summary: "Устройство и особености на бетонните пътни настилки."
  - title: "Оразмеряване на асфалтобетонни настилки"
    summary: "Конструиране и оразмеряване на пластовете на асфалтобетонната настилка."
  - title: "Устройство на железопътната линия"
    summary: "Общи сведения за железопътното строителство и елементи на железопътната линия."
  - title: "Долно и горно строене на железния път"
    summary: "Предназначение, изисквания, елементи и конструктивни особености на долното и горното строене."
