title: "Строителна физика"
slug: "stroitelna-fizika"
summary: "Как сградата взаимодейства с околната среда – вятър, топлина, влага, звук и светлина – и какви са нормативните изисквания."
why: "С нея се проектират топлоизолацията, шумозащитата, осветлението и енергийната ефективност на сградите."
related: ["Физика"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "УАСГ, анотации към учебния план на „Управление в строителството“ (ECTS пакет): четири части – архитектурно-строителна аеродинамика, топлотехника, акустика, светотехника; акцент върху енергоефективно и екологично строителство. Анотацията дава само частите – главите вътре в тях са наша разбивка."
chapters:
  - title: "Сградата и околната среда"
    summary: "Климатични въздействия, физични величини и моделно изследване на процесите в сградите."
  - title: "Архитектурно-строителна аеродинамика"
    summary: "Вятър около сгради, обтичане, ветрово налягане и естествено проветряване."
  - title: "Топлопренасяне"
    summary: "Топлопроводност, конвекция и лъчение – основни закони и величини."
  - title: "Топлопреминаване през ограждащи конструкции"
    summary: "Топлинно съпротивление, коефициент на топлопреминаване, топлинни мостове."
  - title: "Влага в строителните конструкции"
    summary: "Влажност на въздуха, дифузия на водни пари и кондензация в ограждащите елементи."
  - title: "Енергийна ефективност и нетрадиционни източници"
    summary: "Топлинни загуби на сградата, енергоефективни решения и използване на възобновяема енергия."
  - title: "Основи на строителната акустика"
    summary: "Звукови вълни, ниво на звука, звукопоглъщане и звукоотражение."
  - title: "Звукоизолация и защита от шум"
    summary: "Въздушен и ударен шум, звукоизолация на стени и подове, нормативни изисквания."
  - title: "Акустика на помещенията"
    summary: "Време на реверберация и акустично оформяне на зали и работни помещения."
  - title: "Светотехника"
    summary: "Светлинни величини, естествено и изкуствено осветление, изисквания за осветеност."
