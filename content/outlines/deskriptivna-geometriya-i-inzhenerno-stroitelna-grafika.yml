title: "Дескриптивна геометрия и инженерно-строителна графика"
slug: "deskriptivna-geometriya-i-inzhenerno-stroitelna-grafika"
summary: "Монжова проекция, аксонометрия и котирана проекция плюс правилата за изработване и четене на строителни чертежи."
why: "Всеки проект се предава с чертежи – тук се учи как пространството се изобразява и как се чете техническата документация."
related: ["Дескриптивна геометрия", "Техническо чертане и графичен дизайн"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/SSS_A.pdf"
  note: "УАСГ, анотации към учебния план на ССС (ECTS пакет): три проекционни метода, изобразяване на тела, равнинни сечения и взаимно пресичане, пътища в топографска местност, стандартизирани изисквания за графичната част на документацията. Разбивката на глави е наша."
chapters:
  - title: "Успоредно проектиране и равнинни модели"
    summary: "Свойства на успоредното проектиране и трите модела, изучавани в курса."
  - title: "Монжова проекция: точка, права и равнина"
    summary: "Изобразяване на основните елементи и взаимните им положения."
  - title: "Позиционни и метрични задачи"
    summary: "Пресичане, успоредност, перпендикулярност, истинска големина и разстояния."
  - title: "Изобразяване на тела"
    summary: "Многостени и ротационни тела в Монжова проекция."
  - title: "Равнинни сечения и взаимно пресичане на тела"
    summary: "Сечения на тела с равнина и линия на пресичане на две тела."
  - title: "Аксонометрия"
    summary: "Видове аксонометрии и нагледно изобразяване на обекти."
  - title: "Котирана проекция: точка, права и равнина"
    summary: "Коти, интервал и наклон, мащаб на наклона, пресичане на равнини."
  - title: "Топографска повърхнина и пътища в терен"
    summary: "Хоризонтали, откоси на насипи и изкопи, площадки и пътища в топографска местност."
  - title: "Стандарти за строителните чертежи"
    summary: "Формати, мащаби, видове линии, надписи и оформяне на чертежа."
  - title: "Изгледи, разрези и оразмеряване"
    summary: "Правила за проекции, разрези, сечения и нанасяне на размери и коти."
  - title: "Четене на техническа документация"
    summary: "Разчитане и изпълнение на графичната част на строителен проект, на ръка или с компютър."
