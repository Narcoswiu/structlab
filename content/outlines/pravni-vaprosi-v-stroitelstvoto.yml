title: "Правни въпроси в строителството"
slug: "pravni-vaprosi-v-stroitelstvoto"
summary: "Приложение на вещното, облигационното, търговското, административното и екологичното право в инвестиционния строителен процес."
why: "Сделките с имоти, договорите с подизпълнители и отговорността за дефекти са правни въпроси, които строителният мениджър решава постоянно."
related: ["Нормативна база в строителството", "Правна и нормативна уредба в строителството", "Договори в строителството. ФИДИК"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "Официална анотация в ECTS информационния пакет на специалност „Управление в строителството“ в УАСГ (сигнатура LACbCBC, IV семестър, 30 ч. лекции, изпит). След курса студентът познава системата и основните институти на правото и приложението на административното, облигационното, вещното, търговското и екологичното право в инвестиционния строителен процес; прилага нормативната уредба за устройство на територията, администрирането на инвестиционния процес, сделките с недвижима собственост, обществените поръчки за проектиране и строителство и правилата и нормите за проектиране и изпълнение. Анотацията е дословно същата като на „Нормативна база в строителството“ (III семестър), затова разделянето на темите между двете дисциплини е наше предположение: тук са поставени частноправните въпроси – собственост, сделки, договори, търговци. Подробна програма по теми не е намерена – да се провери с катедрата. Законите са посочени само по име."
chapters:
  - title: "Основни институти на правото"
    summary: "Правни субекти, правоспособност и дееспособност, представителство, срокове и давност."
  - title: "Вещно право – собственост и ограничени вещни права"
    summary: "Право на собственост, съсобственост, право на строеж и сервитути."
  - title: "Сделки и разпореждане с недвижими имоти"
    summary: "Продажба, замяна, учредяване на право на строеж; форма и вписване на сделките."
  - title: "Облигационно право – договорът"
    summary: "Сключване, действие, изпълнение и неизпълнение на договора; обезщетения и неустойки."
  - title: "Договор за изработка и договор за строителство"
    summary: "Права и задължения на възложителя и изпълнителя, приемане на работата, недостатъци."
  - title: "Търговско право – търговци и дружества"
    summary: "Видове търговци и търговски дружества, обединения за изпълнение на поръчки."
  - title: "Обществени поръчки за проектиране и строителство"
    summary: "Участие в процедура, оферта, сключване и изменение на договора за обществена поръчка."
  - title: "Административноправни въпроси на инвестиционния процес"
    summary: "Обжалване на административни актове и отговорност при нарушения в строителството."
  - title: "Екологично право"
    summary: "Оценка на въздействието върху околната среда и задължения при управление на отпадъците."
  - title: "Отговорност, гаранции и застраховане"
    summary: "Имуществена отговорност, гаранционни срокове, обезпечения и застраховки на участниците."
