title: "Строителна статика – I част"
slug: "stroitelna-statika-1"
summary: "Разрезни усилия, премествания и линии на влияние в статически определими греди, рамки, дъги и ферми и начало на силовия метод."
why: "С тези методи инженерът намира усилията, по които се оразмерява всяка греда, рамка и ферма."
related: ["Строителна статика – II част"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS/SE/STS1bCBC5SE.pdf"
  note: "Анотация от ECTS пакета на УАСГ (ССС, V семестър, 60/45 ч.) – кратък текст, без номерирани теми. Съгласувано с архивната анотация на ВСУ (план 2014, ССС-21) – https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153. Разлика: в УАСГ силовият метод е в I част, във ВСУ – във II част."
chapters:
  - title: "Кинематичен анализ на равнинни конструкции"
    summary: "Дискове и връзки, степени на свобода, геометрична неизменяемост и статическа определимост."
  - title: "Разрезни усилия в еднодискови греди и рамки"
    summary: "Начупени конзоли, рамки тип проста греда и дискове на три опори: реакции и диаграми M, Q, N."
  - title: "Герберови греди"
    summary: "Основни и второстепенни части, ред на решаване, диаграми на разрезните усилия."
  - title: "Триставни рамки и дъги"
    summary: "Опорни реакции, ставни сили и разрезни усилия; рационална ос на дъга."
  - title: "Статически определими ферми"
    summary: "Прътови усилия по метода на възлите и метода на сеченията; нулеви пръти."
  - title: "Комбинирани, висящи и Лангерови системи"
    summary: "Системи от греда и прътова верига: разпределение на усилията между частите."
  - title: "Енергетични теореми и премествания"
    summary: "Работа на силите, теореми за взаимност, формула на Максвел–Мор, правило на Верешчагин."
  - title: "Премествания от температура и поддаване на опори"
    summary: "Премествания без товар; еластични линии на пълностенни греди и на ферми."
  - title: "Линии на влияние в статически определими системи"
    summary: "Статичен и кинематичен начин за греди, герберови греди, триставни рамки и ферми."
  - title: "Натоварване на линиите на влияние"
    summary: "Определяне на величина от товар по линията на влияние и проверки чрез линии на влияние."
  - title: "Силов метод за статически неопределими греди и рамки"
    summary: "Основна система, канонични уравнения, диаграми и проверки (във ВСУ темата е във II част)."
