title: "Договори в строителството. ФИДИК"
slug: "dogovori-v-stroitelstvoto-fidik"
summary: "Как се съставят и управляват договорите за строителство и как работят типовите договорни условия на ФИДИК."
why: "Големите инфраструктурни обекти се изпълняват по условията на ФИДИК – който не познава сроковете и уведомленията в договора, губи исковете си."
related: ["Правни въпроси в строителството", "Нормативна база в строителството", "Правна и нормативна уредба в строителството", "Управление на доставките", "Управление на риска"]
source:
  status: "unverified"
  url: ""
  note: "Дисциплината е в официалния учебен план на специалност „Управление в строителството“ в УАСГ, но няма страница в списъка с дисциплини на old.uacg.bg и липсва в ECTS пакета с анотации (US_A.pdf). Главите са по стандартното съдържание на курс по строителни договори и общата структура на договорните условия на ФИДИК; номера на клаузи умишлено не са посочени, защото се различават между изданията. Не са сверени с учебна програма – да се проверят с катедрата."
chapters:
  - title: "Договорът за строителство"
    summary: "Същност, страни, предмет, форма и място сред останалите договори в инвестиционния процес."
  - title: "Видове строителни договори"
    summary: "Договори по единични цени, с обща цена и с възстановими разходи; „проектиране и строителство“."
  - title: "Типови договорни условия на ФИДИК"
    summary: "Предназначение на отделните книги и избор според вида на проекта и разпределението на риска."
  - title: "Страни и роли по договора"
    summary: "Възложител, Изпълнител, Инженер и подизпълнители – права, задължения и правомощия."
  - title: "Структура на договора"
    summary: "Общи и специфични условия, договорни документи и ред на предимство между тях."
  - title: "Срокове, програма и закъснение"
    summary: "Начало и срок за завършване, работна програма, удължаване на срока, обезщетение за забава."
  - title: "Цена, измерване и плащане"
    summary: "Измерване на работите, междинни и окончателно плащане, сертификати, аванс и задръжки."
  - title: "Изменения на договора"
    summary: "Нареждане и оценяване на изменения, предложения за оптимизация, корекции на цената."
  - title: "Разпределение на риска, гаранции и застраховки"
    summary: "Рискове на възложителя и на изпълнителя, извънредни събития, гаранции за изпълнение."
  - title: "Искове и уведомления"
    summary: "Ред и срокове за предявяване на искове за допълнително време и плащане; доказване."
  - title: "Приемане и отговорност за дефекти"
    summary: "Изпитвания при завършване, приемане на работите, срок за съобщаване на дефекти."
  - title: "Прекратяване и решаване на спорове"
    summary: "Спиране и прекратяване на договора; комисия за спорове, споразумение и арбитраж."
