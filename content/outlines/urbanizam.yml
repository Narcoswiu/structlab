title: "Урбанизъм"
slug: "urbanizam"
summary: "Общият устройствен план на града с ударение върху транспортната инфраструктура: улична мрежа, градско движение и кръстовища."
why: "Строителният мениджър участва в проекти в градска среда и трябва да познава устройствените планове и изискванията към улиците и кръстовищата."
related: ["Териториално и селищно устройство и градоустройство"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "Информационен пакет (ECTS) на УАСГ за специалност „Управление в строителството“: кратка анотация на дисциплината (катедра „Градоустройство“, III семестър, 30 ч. лекции и 45 ч. упражнения). Намерена е само анотацията – конспект или учебна програма по теми не са открити. Главите следват въпросите, изброени в анотацията; разделянето им на отделни глави е наше и следва да се свери с програмата на катедрата."
chapters:
  - title: "Урбанизирани територии и устройствено планиране"
    summary: "Основни понятия и място на общия устройствен план в планирането на града."
  - title: "Общ устройствен план – основни елементи"
    summary: "Съдържание и елементи на общия устройствен план за урбанизирани територии."
  - title: "Транспортна инфраструктура в общия устройствен план"
    summary: "Цели и насоки за развитие на транспортната инфраструктура като част от инженерната инфраструктура."
  - title: "Улична мрежа и нормативна уредба"
    summary: "Класификация на улиците и действащи норми за проектирането им."
  - title: "Проектиране на улици"
    summary: "Елементи на улицата и основни въпроси при проектирането ѝ."
  - title: "Моделиране на градското движение"
    summary: "Основни характеристики на транспортните потоци и подходи за моделирането им."
  - title: "Управление и организация на градското движение"
    summary: "Средства за организация и регулиране на движението в града."
  - title: "Градски кръстовища"
    summary: "Проектиране, организация и безопасна експлоатация на градските кръстовища."
