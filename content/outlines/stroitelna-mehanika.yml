title: "Строителна механика"
slug: "stroitelna-mehanika"
summary: "Обединен курс по статика и якост: сили, равновесие, опорни реакции, разрезни усилия, напрежения и оразмеряване."
why: "Строителният мениджър трябва да разбира как носи конструкцията, за да преценява решения, срокове и рискове."
related: ["Теоретична механика – I част", "Съпротивление на материалите", "Теоретична механика – II част"]
source:
  status: "unverified"
  url: "https://old.uacg.bg/?p=210&l=1&m=1&id=443"
  note: "Програма за „Строителна механика“ в специалност „Управление в строителството“ (II семестър, 45/45 ч.) не е намерена. Отворена е официалната програма на едноименната дисциплина на катедра „Строителна механика“ в УАСГ, но за специалност „Архитектура“ (45/30 ч.); главите следват нейното съдържание. Обхватът за УС трябва да се свери."
chapters:
  - title: "Конструкции и натоварвания"
    summary: "Какво е конструкция, видове товари – постоянни, експлоатационни, сняг, вятър, земетръс; товарни площи."
  - title: "Сила, момент на сила и двоица"
    summary: "Характеристики на силата, събиране и разлагане на сили, момент спрямо точка, двоица сили."
  - title: "Равновесие и опорни реакции"
    summary: "Условия за равновесие в равнината, видове опори, статическа определимост, реакции на греди."
  - title: "Греди със стави, триставни рамки и дъги"
    summary: "Основни и второстепенни части, ставни сили; рамки и дъги с три стави и с обтегач."
  - title: "Равнинни ферми"
    summary: "Образуване и видове ферми; усилия в прътите по метода на възлите и по метода на сеченията."
  - title: "Въжета и висящи конструкции"
    summary: "Геометрия и усилия във въже при съсредоточена сила и при разпределен товар."
  - title: "Геометрични характеристики на сеченията"
    summary: "Център на тежестта, инерционен момент на просто и на съставно сечение, теорема на Щайнер, инерционен радиус."
  - title: "Напрежения, деформации и поведение на материала"
    summary: "Нормално и срязващо напрежение, закон на Хук, диаграма напрежение – деформация, коефициент на Поасон."
  - title: "Разрезни усилия в греди и рамки"
    summary: "Нормална сила, срязваща сила и огъващ момент; зависимости с товара и чертане на диаграми."
  - title: "Огъване: напрежения и премествания"
    summary: "Нормални и срязващи напрежения в греда, еластична линия и провисване."
  - title: "Оразмеряване на основни елементи"
    summary: "Опънати и натиснати пръти, греди на огъване, колони и изкълчване."
