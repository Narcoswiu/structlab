title: "Икономика на строителството"
slug: "ikonomika-na-stroitelstvoto"
summary: "Пазар, капитал и инвестиции, активи, труд, разходи, цени, печалба и финансов анализ на строителното предприятие."
why: "Инженерът оценява дали един обект или инвестиция се изплаща, колко струва строителството и в какво финансово състояние е фирмата."
related: ["Обща икономическа теория", "Въведение в икономиката", "Микроикономика", "Ценообразуване в строителството", "Корпоративни финанси", "Бизнес планиране"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивна анотация на ВСУ за специалност ССС (учебен план 2014, код ССС-36, катедра „Технология и мениджмънт на строителството“) с изброени теми и курсови задачи – главите следват нея. Анотацията на УАСГ за ССС (https://old.uacg.bg/?p=210&l=1&id=539&m=3) е по-кратка и набляга на пазарни структури, оценка на ефективността и риска на инвестиционни проекти и ценообразуване – покрита е в глави 2, 4 и 8. Пълна учебна програма с часове по теми не е намерена; актуалността на плана от 2014 г. не е потвърдена."
chapters:
  - title: "Предмет и инструменти на икономиката"
    summary: "Основни икономически понятия, пазарни принципи, категории и механизми."
  - title: "Търсене, предлагане и пазарни структури"
    summary: "Пазарно равновесие и поведение на фирмата при различни пазарни условия."
  - title: "Капитал и цена на капитала"
    summary: "Олихвяване, дисконтиране и стойност на парите във времето."
  - title: "Инвестиции и оценка на инвестиционни проекти"
    summary: "Нетна настояща стойност, сравняване на алтернативни проекти и оценка на риска."
  - title: "Активи на строителното предприятие"
    summary: "Дълготрайни и краткотрайни активи, амортизация на дълготрайните активи."
  - title: "Пазар на труда, трудови ресурси и работна заплата"
    summary: "Структура на персонала, производителност на труда и заплащане."
  - title: "Разходи на строителното предприятие"
    summary: "Видове разходи и формиране на себестойността на строителната продукция."
  - title: "Ценообразуване в строителството"
    summary: "Как се образува цената на строителната продукция при особеностите на строителното производство."
  - title: "Приходи, печалба и рентабилност"
    summary: "Финансов резултат и ефективност на производствено-стопанската дейност на фирмата."
  - title: "Данъчна политика и отчетност"
    summary: "Данъчно облагане на предприятието и основни отчетни документи."
  - title: "Финансов анализ на строителното предприятие"
    summary: "Показатели за финансовото състояние на фирмата и тяхното тълкуване."
  - title: "Изработване на бизнес план"
    summary: "Структура и съдържание на бизнес плана на строителна фирма."
