title: "Теория на еластичността и пластичността"
slug: "teoriya-na-elastichnostta-i-plastichnostta"
summary: "Напрежения и деформации в двумерни и тримерни тела – гредостени и плочи, критерии за пластичност и метод на граничното равновесие."
why: "Нужна е за стени, плочи и масивни елементи, които не се описват с прътовата теория, и за разбиране на изчислителните модели."
related: []
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS/SE/TEPbCBC6SE.pdf"
  note: "Анотация от ECTS пакета на УАСГ (ССС, VI семестър, 30/30 ч.) – кратък текст, без номерирани теми. Темите за равнинната задача и тънките плочи са сверени с архивната анотация на ВСУ (план 2014, ССС-26) – https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153. Актуална програма на ВСУ с това име не е намерена."
chapters:
  - title: "Модел на непрекъсната среда и основни хипотези"
    summary: "Сили, напрежения, премествания и деформации; допускания на линейната теория."
  - title: "Теория на напреженията"
    summary: "Тензор на напреженията, уравнения за равновесие, условия на повърхността, главни напрежения."
  - title: "Теория на деформациите"
    summary: "Уравнения на Коши, тензор на деформациите и условия за непрекъснатост."
  - title: "Обобщен закон на Хук и пълна система уравнения"
    summary: "Връзка между напрежения и деформации; решение в премествания и в напрежения."
  - title: "Равнинна задача на теорията на еластичността"
    summary: "Равнинно напрегнато и равнинно деформирано състояние; функция на напреженията."
  - title: "Гредостени"
    summary: "Решения с полиноми и тригонометрични редове; сравнение с гредовата теория."
  - title: "Теория на тънките плочи"
    summary: "Предпоставки, премествания, разрезни усилия, диференциално уравнение и гранични условия."
  - title: "Решения на правоъгълни плочи"
    summary: "Метод на двойните тригонометрични редове; моменти в произволно сечение."
  - title: "Изчислителни модели и тълкуване на резултатите"
    summary: "Изграждане на модел на двумерна конструкция и инженерна оценка на напреженията."
  - title: "Основи на теорията на пластичността"
    summary: "Идеализирани диаграми на материала, етапи на работа и критерии за пластифициране."
  - title: "Методи за решаване на нелинейни задачи"
    summary: "Стъпково натоварване и итерации при еластично-пластично поведение."
  - title: "Метод на граничното равновесие"
    summary: "Гранично състояние, статична и кинематична теорема; решение на плочи с линии на провлачане."
