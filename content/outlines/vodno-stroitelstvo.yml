title: "Водно строителство"
slug: "vodno-stroitelstvo"
summary: "Обзор на хидротехническите съоръжения: корекции на реки, язовирни стени, водохващания, канали и напоителни системи."
why: "Ръководителят на проект трябва да познава видовете водни строежи и особеностите на изграждането им край и във вода."
related: ["Основи на хидравликата, водоснабдяването и канализацията"]
source:
  status: "unverified"
  url: "https://old.uacg.bg/?p=210&l=1&m=5&id=1640"
  note: "Намерена е официална анотация на УАСГ за „Водно строителство“ (катедра „Хидротехника и хидромелиорации“), но за специалност „Водоснабдяване и канализация“, а не за „Управление в строителството“. Главите следват изброените в нея съоръжения. Програма за специалността от каталога не е намерена; там курсът вероятно е по-обзорен."
chapters:
  - title: "Води, отток и основни хидравлични понятия"
    summary: "Водни ресурси, речен отток и основните зависимости, нужни за оразмеряване на съоръженията."
  - title: "Корекции на реки извън населени места"
    summary: "Диги, брегоукрепване и регулиране на речното легло за защита от наводнения и ерозия."
  - title: "Корекции на реки в населени места"
    summary: "Оформяне на речното корито в градска среда, подпорни стени и облицовки."
  - title: "Язовирни стени"
    summary: "Насипни и бетонни стени, преливници и основни изпускатели – конструктивно оформяне и работа."
  - title: "Водохващания и утайници"
    summary: "Безязови и язови водохващания от реки, утаяване на наносите преди деривацията."
  - title: "Хидротехнически канали и тунели"
    summary: "Напорни и безнапорни деривации, облицовки и съоръжения по трасето."
  - title: "Водноелектрически централи"
    summary: "Схеми на централи, напор и мощност, основни съоръжения от водовземането до изтичалото."
  - title: "Напоителни и отводнителни системи"
    summary: "Хидромелиоративни мрежи, съоръжения и помпени станции за напояване и отводняване."
  - title: "Хвостохранилища"
    summary: "Предназначение, начин на изграждане на стената и изисквания за безопасност."
  - title: "Пристанищни съоръжения"
    summary: "Кейови стени, вълноломи и брегозащитни съоръжения."
