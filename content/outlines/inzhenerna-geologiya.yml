title: "Инженерна геология"
slug: "inzhenerna-geologiya"
summary: "Скали и строителни почви, геоложки процеси, подземни води и проучвания на терена преди строеж."
why: "Всеки строеж стъпва върху земната основа – от геоложкия доклад зависят фундирането, цената и рискът от свлачища и слягания."
related: ["Инженерна геология и хидрогеология"]
source:
  status: "unverified"
  url: ""
  note: "Анотация или програма на УАСГ за „Инженерна геология“ в специалност „Управление в строителството“ не е намерена – дисциплината липсва в ECTS пакета с анотации за специалността (https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf). Главите следват плана на модула „Инженерна геология и хидрогеология“ в StructLab. Темите се покриват и с конспекта на УАСГ по „Инженерна геология и хидрогеология“ за други специалности (https://old.uacg.bg/?p=210&l=1&id=921&m=3: обща геология, грунтознание, хидрогеология, физикогеоложки явления и проучвания), но колко от тях влизат в по-краткия курс за УС не е известно."
chapters:
  - title: "Строеж на Земята и скалообразуващи минерали"
    summary: "От какво е изградена Земята и от какви минерали се състоят скалите, върху които строим."
  - title: "Магмени, седиментни и метаморфни скали"
    summary: "Трите начина, по които се образува една скала, и как се разпознава произходът ѝ."
  - title: "Геоложко време и тектонски структури"
    summary: "Възраст на скалите, пластове, гънки и разломи, тектонски движения."
  - title: "Земетресения"
    summary: "Огнище, магнитуд и интензивност и влиянието на земната основа върху труса."
  - title: "Изветряне, срутища и сипеи"
    summary: "Как скалата се разрушава и защо късовете падат или се трупат в подножието."
  - title: "Свлачища"
    summary: "Условия и фактори за свличане, елементи и видове свлачища, равновесие на склона."
  - title: "Физико-механични свойства на скалите и строителните почви"
    summary: "Плътност, водно съдържание, порьозност, деформируемост и якост."
  - title: "Строителни почви и тяхната класификация"
    summary: "Свързани, несвързани и особени почви и инженерно-геоложката им класификация."
  - title: "Водата: ерозия, карст и подземни води"
    summary: "Геоложка дейност на водата, видове подземни води, агресивност към бетона и движение през почвата."
  - title: "Инженерно-геоложки проучвания"
    summary: "Сондажи и шурфове, полеви опити и документация на проучването."
