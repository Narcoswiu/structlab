title: "Екология и устойчиво строителство"
slug: "ekologiya-i-ustoychivo-stroitelstvo"
summary: "Как строителството влияе на въздуха, водите, почвите и ресурсите и как се проектират и строят сгради с по-малък отпечатък."
why: "Инженерът избира материали, технологии и мерки на площадката, от които зависят енергията, отпадъците и замърсяването през целия живот на сградата."
related: ["Опазване на околната среда и устойчиво развитие"]
source:
  status: "unverified"
  url: ""
  note: "Официална програма или анотация на ВСУ за тази дисциплина не е намерена: в архивните анотации (учебен план от 2014 г.) има само избираема „Екологични строителни материали“, а актуални учебни програми ВСУ не публикува. Главите са по стандартното съдържание на дисциплината в строителните специалности и трябва да се проверят с преподавателя."
chapters:
  - title: "Основни понятия в екологията"
    summary: "Екосистема, кръговрат на веществата, природни ресурси и замърсяване."
  - title: "Въздействие на строителството върху околната среда"
    summary: "Какво променя строежът: терен, ресурси, енергия, емисии и отпадъци."
  - title: "Опазване на въздуха, шум и вибрации"
    summary: "Източници на прах, емисии, шум и вибрации при строеж и мерки за ограничаването им."
  - title: "Опазване на водите и почвите"
    summary: "Замърсяване при строителни работи, запазване на хумуса и рекултивация на нарушени терени."
  - title: "Строителни отпадъци и кръгова икономика"
    summary: "Предотвратяване, разделяне, повторна употреба и рециклиране на строителните материали."
  - title: "Устойчиво развитие и устойчиво строителство"
    summary: "Екологична, икономическа и социална страна на устойчивостта и какво значат за една сграда."
  - title: "Жизнен цикъл на сградата"
    summary: "Оценка на въздействията от добива на материалите до разрушаването на сградата."
  - title: "Екологични строителни материали"
    summary: "Материали с ниско въздействие, местни и рециклирани материали, декларации за продуктите."
  - title: "Енергийна ефективност и възобновяема енергия в сградите"
    summary: "Намаляване на потреблението на енергия и използване на слънчева и друга възобновяема енергия."
  - title: "Оценка и сертифициране на устойчиви сгради"
    summary: "По какви показатели се оценява една сграда и как работят системите за сертифициране."
