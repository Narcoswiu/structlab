title: "Автоматизация на инженерния труд"
slug: "avtomatizatsiya-na-inzhenerniya-trud"
summary: "Основи на компютърната графика, чертане със система за компютърно проектиране и въведение в релационните бази данни."
why: "Чертежите и данните на всеки строителен проект се създават и поддържат с такива системи."
related: ["Автоматизация на инженерния труд – I част", "Автоматизация на инженерния труд – II част", "Информатика", "Програмиране и използване на изчислителните системи"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/SSS_A.pdf"
  note: "УАСГ, анотации към учебния план на ССС (ECTS пакет): темите са изброени в анотацията (15 ч. лекции, 30 ч. упражнения, II семестър). Тя назовава конкретна CAD система и конкретна СУБД; тук са описани общо."
chapters:
  - title: "Основи на компютърната графика"
    summary: "Растерна и векторна графика, координатни системи и геометрично моделиране."
  - title: "Трансформации, перспективи и визуализация"
    summary: "Преместване, завъртане, мащабиране, проекции и изобразяване на модела."
  - title: "2D и 2.5D компютърна графика"
    summary: "Равнинни чертежи и обекти с височина – възможности и ограничения."
  - title: "Работна среда на CAD системата"
    summary: "Интерфейс, координати, единици и точно въвеждане на точки."
  - title: "Команди за изчертаване"
    summary: "Отсечки, полилинии, окръжности, дъги и други основни обекти."
  - title: "Команди за редактиране"
    summary: "Копиране, преместване, отрязване, удължаване и офсет на обекти."
  - title: "Пластове и блокове"
    summary: "Организация на чертежа по пластове и многократно използване на блокове."
  - title: "Оразмеряване и визуализация на чертежа"
    summary: "Размери, надписи, изгледи и подготовка на чертежа за печат."
  - title: "Системи за управление на бази данни"
    summary: "Принципи на изграждане, видове СУБД и използването им."
  - title: "Релационни бази данни"
    summary: "Таблици, ключове, връзки и основи на релационния модел."
  - title: "Работа с база данни"
    summary: "Създаване на таблици, заявки, форми и справки."
