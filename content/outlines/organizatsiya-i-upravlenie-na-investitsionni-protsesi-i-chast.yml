title: "Организация и управление на инвестиционни процеси – I част"
slug: "organizatsiya-i-upravlenie-na-investitsionni-protsesi-i-chast"
summary: "Етапите, участниците и процедурите на инвестиционния процес в строителството – от идеята до въвеждането в експлоатация."
why: "Ръководителят на проект трябва да знае кой какво прави и кога, за да преведе един строеж през проектиране, възлагане, изпълнение и приемане."
related: ["Организация и управление на инвестиционни процеси – II част", "Организация и управление на строителството", "Организация на строителството"]
source:
  status: "unverified"
  url: ""
  note: "На официалната страница на дисциплината в УАСГ (old.uacg.bg, ?p=210&l=1&id=2235&m=40) няма анотация; закаченият календарен план е за II част. В ECTS пакета на специалността (US_A.pdf) дисциплината липсва. Главите са съобразени с анотацията на сродната дисциплина „Организация и управление на строителството“ за специалност ССС (ECTS пакет SSS_A.pdf: етапи, фази и участници, обществени поръчки и договори, методи за организация, календарно планиране, контрол), но разпределението между I и II част е наше предположение – да се провери с катедрата."
chapters:
  - title: "Инвестиционен процес в строителството"
    summary: "Същност, цели и особености на инвестиционния процес; жизнен цикъл на строежа."
  - title: "Етапи и фази на инвестиционния процес"
    summary: "Прединвестиционен, проектен, строителен и експлоатационен етап и резултатите от всеки."
  - title: "Участници в инвестиционния процес"
    summary: "Възложител, проектант, строител, консултант, технически ръководител, доставчик – функции и отговорности."
  - title: "Прединвестиционни проучвания"
    summary: "Идея, проучвания за осъществимост, задание за проектиране, избор на площадка."
  - title: "Инвестиционно проектиране"
    summary: "Фази на проектиране, части на проекта, съгласуване и одобряване."
  - title: "Разрешаване на строителството"
    summary: "Одобряване на проекта, разрешение за строеж, откриване на строителната площадка."
  - title: "Възлагане на проектиране и строителство"
    summary: "Процедури за обществени поръчки, избор на изпълнител, оферта и критерии за оценка."
  - title: "Договори за проектиране и строителство"
    summary: "Видове договори, основни клаузи, взаимоотношения между страните."
  - title: "Методи за организация на строителството"
    summary: "Последователен, успореден и поточен метод; параметри на строителния поток."
  - title: "Контрол и документиране по време на строителството"
    summary: "Оперативно ръководство, актове и протоколи, контрол на качеството на работите."
  - title: "Завършване и въвеждане в експлоатация"
    summary: "Приемане на строежа, екзекутивна документация, разрешение за ползване."
