title: "Пътно строителство"
slug: "patno-stroitelstvo"
summary: "Проектиране на път в ситуация, надлъжен и напречен профил, отводняване, земни работи и оразмеряване на пътни настилки."
why: "Пътищата, улиците и площадките към всеки обект се проектират и изпълняват по тези правила – от трасето до пластовете на настилката."
related: ["Пътно и железопътно строителство", "Железопътно строителство", "Транспортно строителство"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&id=1053&m=3"
  note: "Официална страница на дисциплината за специалност ССС в УАСГ (катедра „Пътища и транспортни съоръжения“) с анотация и приложен календарен план на лекциите (https://old.uacg.bg/filebank/att_28053.pdf, 15 седмици, V семестър). Пълна учебна програма с подтеми не е намерена. Главите следват календарния план, като няколко съседни теми са обединени."
chapters:
  - title: "Пътищата в транспортната мрежа"
    summary: "Пътищата като част от транспортната мрежа и класификация на пътищата в страната."
  - title: "Основни елементи на пътя"
    summary: "Елементи на пътя в ситуация, надлъжен и напречен профил."
  - title: "Автомобилно движение"
    summary: "Характеристики на автомобилното движение, които определят изискванията към пътя."
  - title: "Превозно средство, теглителна сила и взаимодействие с пътя"
    summary: "Теглителна сила на моторното превозно средство и взаимодействие между автомобила и пътя."
  - title: "Проектиране на пътя в ситуация"
    summary: "Прави, хоризонтални криви и преходни криви в трасето на пътя."
  - title: "Проектиране на пътя в надлъжен профил"
    summary: "Нивелета, надлъжни наклони и вертикални криви."
  - title: "Разстояния за видимост"
    summary: "Видимост за спиране и изпреварване и осигуряването ѝ в план и профил."
  - title: "Напречен профил и разпределение на земните маси"
    summary: "Елементи на напречния профил, изчисляване и разпределение на земните маси."
  - title: "Земни работи и отводняване на пътя"
    summary: "Изпълнение на земното тяло и съоръжения за отвеждане на повърхностни и подпочвени води."
  - title: "Пътни настилки – функции, изисквания, класификация"
    summary: "Предназначение на настилката, изисквания към нея и видове пътни конструкции."
  - title: "Твърди и еласто-пластични настилки"
    summary: "Бетонови настилки и асфалтови настилки – пластове и особености."
  - title: "Оразмеряване и усилване на пътни настилки"
    summary: "Определяне на дебелините на пластовете и усилване на съществуващи настилки."
