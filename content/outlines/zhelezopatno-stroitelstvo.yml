title: "Железопътно строителство"
slug: "zhelezopatno-stroitelstvo"
summary: "Устройство, проектиране и строителство на железопътни линии: теглителни изчисления, план и надлъжен профил, гари, долно и горно строене."
why: "Строителният инженер среща железопътни линии, гари и промишлени коловози при инфраструктурни обекти и при генералните планове на предприятия."
related: ["Пътно и железопътно строителство", "Пътно строителство", "Транспортно строителство"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&id=1026&m=3"
  note: "Официална страница на дисциплината за специалност ССС в УАСГ (катедра „Железници“) с анотация и приложен конспект (https://old.uacg.bg/filebank/att_15469.pdf, 29 въпроса). Главите следват реда на конспекта, като въпросите са групирани по теми."
chapters:
  - title: "Транспортна система и железен път"
    summary: "Видове транспорт, подразделение на железниците, съставни части на железния път, подвижен състав и габарити."
  - title: "Сили, действащи на влака"
    summary: "Теглителна сила и тягови характеристики, съпротивителни и спирачни сили."
  - title: "Уравнение за движение на влака"
    summary: "Диаграми на равнодействащите сили, определяне на скоростта и времепътуването."
  - title: "Ръководен наклон, маса на влака и енергийни изчисления"
    summary: "Определяне на ръководния наклон и масата на влака, разход на енергия и гориво."
  - title: "Проучване и класификация на железопътните линии"
    summary: "Етапи на проектирането, проучвателни работи, видове превози и техническа мощност на линията."
  - title: "Железопътна линия в план"
    summary: "Хоризонтални криви, разширение и надвишение на релсовия път, преходни криви."
  - title: "Надлъжен профил на железопътната линия"
    summary: "Профилни елементи, вертикални криви, видове наклони и съгласуване на плана с профила."
  - title: "Трасиране и водоотводни съоръжения"
    summary: "Трасировъчни ходове, изкуствено развитие на линията, оценка на трасето, разполагане на водостоците."
  - title: "Гари, стрелки и коловозно развитие"
    summary: "Видове гари, устройство на обикновена стрелка, коловозни съединения и коловозни групи."
  - title: "Долно строене"
    summary: "Земно платно, напречни профили, изчисляване и разпределение на земните маси."
  - title: "Горно строене"
    summary: "Релси, траверси, скрепления и баластова призма; безнаставов релсов път."
  - title: "Промишлен железопътен транспорт"
    summary: "Връзка с мрежата за общо ползване и коловозно развитие в генералния план на предприятието."
