title: "Управление на строителна фирма"
slug: "upravlenie-na-stroitelna-firma"
summary: "Как се създава, организира и развива строителна фирма – стратегия, структура, маркетинг, ресурси, финанси и хора."
why: "Инженерът, който ръководи или създава фирма, отговаря не за един обект, а за това фирмата да има работа, хора и пари и догодина."
related: ["Основи на управление в строителството", "Основи на управлението", "Управление на програми и портфолия"]
source:
  status: "unverified"
  url: ""
  note: "Официалната страница на дисциплината в УАСГ (old.uacg.bg, специалност „Управление в строителството“, катедра „Организация и икономика на строителството“) съществува, но съдържа само катедра и преподавател – без анотация и без програма. В ECTS пакета с анотации на специалността (US_A.pdf) дисциплината липсва. Главите са съобразени и с анотацията на сродната дисциплина „Мениджмънт на строителната фирма“ за специалност ССС (ECTS пакет SSS_A.pdf: стратегическо планиране, фирмена култура и маркетинг на малка и средна строителна фирма), но за самата дисциплина програма не е намерена – да се провери с катедрата."
chapters:
  - title: "Строителната фирма и нейната среда"
    summary: "Предмет на дейност, правни форми, пазар на строителни услуги и конкуренти."
  - title: "Мисия, цели и стратегическо планиране"
    summary: "Елементи на стратегическия план и избор на стратегия за малка и средна фирма."
  - title: "Анализ на средата и на собствените възможности"
    summary: "Силни и слаби страни, възможности и заплахи; конкурентни предимства."
  - title: "Организационна структура на фирмата"
    summary: "Отдели, обекти и звена; разпределение на правомощията и отговорностите."
  - title: "Маркетинг и участие в търгове"
    summary: "Проучване на пазара, избор на поръчки, подготовка на оферта."
  - title: "Управление на производството и ресурсите"
    summary: "Планиране на обектите, механизация, материали и подизпълнители на фирмено равнище."
  - title: "Финансово управление на фирмата"
    summary: "Бюджет, парични потоци, себестойност и рентабилност на обектите."
  - title: "Персонал и фирмена култура"
    summary: "Подбор и задържане на кадри, ценности и правила на поведение във фирмата."
  - title: "Качество, безопасност и околна среда"
    summary: "Фирмени системи за управление и изисквания към строителя."
  - title: "Бизнес план и развитие на фирмата"
    summary: "Съставяне на бизнес план, растеж, разширяване на дейността."
