title: "Статистика"
slug: "statistika"
summary: "Събиране и описване на данни, вероятности, извадки, оценки, проверка на хипотези, корелация и регресия."
why: "Строителният мениджър я ползва за анализ на разходи, срокове и качество, за контрол на материали и за обосноваване на решения с данни."
related: ["Анализ на бизнес данни"]
source:
  status: "unverified"
  url: ""
  note: "Страницата на дисциплината в специалност „Управление в строителството“ на УАСГ (https://old.uacg.bg/?p=210&l=1&id=2241&m=40) съществува, но е без анотация и без приложена програма – дава само катедрата („Организация и икономика на строителството“). Очертанието следва стандартното съдържание на курс по статистика за икономически и управленски специалности. Да се свери с катедрата."
chapters:
  - title: "Статистическо изучаване и събиране на данни"
    summary: "Съвкупност, единици и признаци, измервателни скали, видове наблюдения."
  - title: "Групиране и представяне на данни"
    summary: "Статистически редове, таблици и графики, честотни разпределения."
  - title: "Средни величини и разсейване"
    summary: "Средна аритметична, медиана, мода, дисперсия, стандартно отклонение и коефициент на вариация."
  - title: "Основи на теорията на вероятностите"
    summary: "Случайни събития, вероятност, условна вероятност и независимост."
  - title: "Случайни величини и разпределения"
    summary: "Биномно, Поасоново и нормално разпределение, числови характеристики."
  - title: "Извадки и статистически оценки"
    summary: "Извадкови методи, точкови оценки, доверителни интервали и обем на извадката."
  - title: "Проверка на статистически хипотези"
    summary: "Нулева и алтернативна хипотеза, ниво на значимост, критерии за средни и относителни дялове."
  - title: "Корелационен и регресионен анализ"
    summary: "Измерване на зависимост между признаци и линейна регресия."
  - title: "Динамични редове"
    summary: "Показатели на развитие, тренд и сезонни колебания, прости прогнози."
  - title: "Индекси"
    summary: "Индивидуални и общи индекси на цени и количества."
