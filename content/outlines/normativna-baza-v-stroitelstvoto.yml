title: "Нормативна база в строителството"
slug: "normativna-baza-v-stroitelstvoto"
summary: "Системата от закони, наредби и технически норми, които уреждат устройството на територията, проектирането и изпълнението на строежите."
why: "Строителният мениджър всеки ден работи с разрешения, актове и норми – трябва да знае кой документ откъде произтича и кой го издава."
related: ["Правни въпроси в строителството", "Правна и нормативна уредба в строителството", "Договори в строителството. ФИДИК"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "Официална анотация в ECTS информационния пакет на специалност „Управление в строителството“ в УАСГ (сигнатура PCLbCBC, III семестър, 30 ч. лекции, изпит). След курса студентът познава системата и основните институти на правото и приложението на административното, облигационното, вещното, търговското и екологичното право в инвестиционния строителен процес; прилага нормативната уредба за устройство на територията, администрирането на инвестиционния процес, сделките с недвижима собственост, обществените поръчки за проектиране и строителство и правилата и нормите за проектиране и изпълнение. Анотацията е дословно същата като на „Правни въпроси в строителството“ (IV семестър), затова разделянето на темите между двете дисциплини е наше предположение: тук са поставени административноправната и техническата нормативна уредба. Подробна програма по теми не е намерена – да се провери с катедрата. Законите са посочени само по име."
chapters:
  - title: "Система на правото и нормативни актове"
    summary: "Правна норма, отрасли на правото, йерархия на законите и подзаконовите актове."
  - title: "Административно право в строителството"
    summary: "Административни органи, административни актове, издаване, обжалване и влизане в сила."
  - title: "Нормативна уредба за устройство на територията"
    summary: "Закон за устройство на територията и наредбите към него – обхват и основни понятия."
  - title: "Устройствени планове и правила за застрояване"
    summary: "Видове устройствени планове, предназначение на имотите, показатели и линии на застрояване."
  - title: "Участници в инвестиционния процес"
    summary: "Възложител, проектант, строител, консултант, технически ръководител – изисквания и задължения."
  - title: "Администриране на инвестиционния процес"
    summary: "Съгласуване и одобряване на проектите, разрешение за строеж, категории строежи."
  - title: "Правила и норми за проектиране"
    summary: "Основни изисквания към строежите, технически норми и стандарти за проектиране."
  - title: "Правила и норми за изпълнение и приемане"
    summary: "Актове и протоколи по време на строителството, контрол и приемане на работите."
  - title: "Контрол и въвеждане в експлоатация"
    summary: "Строителен надзор, държавен контрол, незаконно строителство, разрешение за ползване."
  - title: "Обществени поръчки за проектиране и строителство"
    summary: "Нормативна рамка, възложители и основни видове процедури."
