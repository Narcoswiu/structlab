title: "Управление на програми и портфолия"
slug: "upravlenie-na-programi-i-portfoliya"
summary: "Как група свързани проекти се управлява като програма и как организацията подбира, оценява и балансира портфолио от проекти."
why: "Строителна фирма или възложител почти никога не води само един обект – трябва да избере кои проекти да поеме и как да разпредели ресурсите между тях."
related: ["Управление на строителна фирма", "Управление на риска"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "Официална анотация в ECTS информационния пакет на специалност „Управление в строителството“ в УАСГ (сигнатура PPMPbCBC, VIII семестър, изпит): основни понятия, подходи и техники за създаване, поддържане и оптимизация на програми и портфолия, включително подбор и оценка. Анотацията е кратка и описва дисциплината като предназначена за магистри – вероятно пренесен текст; подробна програма по теми не е намерена и главите са наша разбивка на анотацията."
chapters:
  - title: "Проект, програма и портфолио"
    summary: "Основни понятия, разлики и връзки между трите равнища на управление."
  - title: "Стратегия на организацията и портфолио"
    summary: "Как стратегическите цели се превръщат в набор от проекти и програми."
  - title: "Подбор и оценка на проекти"
    summary: "Критерии, финансови и нефинансови показатели, модели за оценяване."
  - title: "Подреждане по приоритет и балансиране на портфолиото"
    summary: "Съчетаване на проектите по полза, риск и натоварване на ресурсите."
  - title: "Създаване и структуриране на програма"
    summary: "Цели на програмата, съставни проекти, пътна карта и етапи."
  - title: "Управление на ползите"
    summary: "Определяне, проследяване и реализиране на ползите от програмата."
  - title: "Ресурси и зависимости между проектите"
    summary: "Общи ресурси, взаимни зависимости и съгласуване на графиците."
  - title: "Риск на равнище програма и портфолио"
    summary: "Натрупване на рисковете от отделните проекти и общи мерки."
  - title: "Управленска структура и офис за управление на проекти"
    summary: "Роли, правомощия и вземане на решения на равнище програма и портфолио."
  - title: "Наблюдение, отчитане и оптимизация"
    summary: "Показатели за състоянието, преглед на портфолиото, спиране и добавяне на проекти."
