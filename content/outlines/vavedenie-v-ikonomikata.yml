title: "Въведение в икономиката"
slug: "vavedenie-v-ikonomikata"
summary: "Основни икономически понятия: оскъдност и избор, търсене и предлагане, фирма и разходи, пазари и макроикономически показатели."
why: "Строителният мениджър чете пазара, лихвите и инфлацията, за да планира цени, оферти и инвестиции в обекти."
related: ["Обща икономическа теория", "Микроикономика", "Макроикономика", "Икономика на строителството"]
source:
  status: "unverified"
  url: ""
  note: "Официална програма или анотация на ВСУ за дисциплината в специалност „Строителен мениджмънт“ не е намерена: архивната страница с анотации на vsu.bg обхваща само специалност ССС, а на текущия сайт са открити само разписания. Планът е по стандартното съдържание на уводен курс по икономика и е съгласуван с „Обща икономическа теория“ в УАСГ – да се провери с катедрата."
chapters:
  - title: "Предмет и метод на икономиката"
    summary: "Оскъдност, избор, алтернативни разходи, микро- и макроикономика."
  - title: "Икономически системи и кръгооборот"
    summary: "Пазарна икономика, участници и движение на продукти, ресурси, доходи и разходи."
  - title: "Търсене, предлагане и пазарно равновесие"
    summary: "Закони на търсенето и предлагането, равновесна цена, еластичност."
  - title: "Потребителски избор"
    summary: "Полезност, бюджетно ограничение и формиране на търсенето на домакинството."
  - title: "Производство, разходи и печалба на фирмата"
    summary: "Производствени фактори, видове разходи, приходи и печалба."
  - title: "Пазарни структури"
    summary: "Съвършена конкуренция, монопол, олигопол и монополистична конкуренция."
  - title: "Пазари на производствените фактори"
    summary: "Пазар на труда, капитала и земята; работна заплата, лихва и рента."
  - title: "Пазарни дефекти и роля на държавата"
    summary: "Външни ефекти, обществени блага и държавна намеса в пазара."
  - title: "Макроикономически показатели"
    summary: "Брутен вътрешен продукт, инфлация и безработица."
  - title: "Икономически растеж и цикъл"
    summary: "Фактори на растежа и фази на икономическия цикъл."
  - title: "Пари, банки и макроикономическа политика"
    summary: "Функции на парите, банкова система, фискална и парична политика."
