title: "Зидани конструкции"
slug: "zidani-konstruktsii"
summary: "Материали и поведение на зидарията, изчисляване на неармирани, армирани и усилени зидани стени за вертикални и хоризонтални сили."
why: "Нужна е при нови нискоетажни сгради и най-вече при реконструкция и усилване на съществуващи зидани сгради."
related: ["Обследване и изпитване на строителни конструкции", "Обследване, диагностика и изпитване на строителните конструкции", "Стоманобетонни конструкции"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=179&l=1&f=2&dp=22&id=432"
  note: "Кратка анотация на УАСГ (катедра „Масивни конструкции“, ССС): материали, изграждане, носеща способност за вертикални и хоризонтални сили, усилени и армирани зидарии, Еврокод 6. Архивната анотация на ВСУ (ССС-39.1, план 2014) добавя сеизмичните изисквания и усилването. Номериран конспект не е намерен – разбивката на глави е наша."
chapters:
  - title: "Материали за зидария"
    summary: "Зидарийни тела и разтвори – видове, класове и якости; материали за усилване."
  - title: "Механични свойства на зидарията"
    summary: "Якост на натиск, срязване и огъване, деформационни характеристики по БДС EN 1996-1-1."
  - title: "Конструктивни системи и изграждане"
    summary: "Видове зидани сгради и стени, превръзка, пояси, връзка с подовите конструкции, правила за изпълнение."
  - title: "Неармирани стени на вертикален товар"
    summary: "Ексцентрицитети, стройност, проверка на стени и стълбове на натиск, концентрирани товари."
  - title: "Стени на хоризонтални сили"
    summary: "Срязване в равнината на стената и огъване извън нея от вятър и земен натиск."
  - title: "Армирани и оградени зидарии"
    summary: "Армирана зидария и зидария, оградена със стоманобетонни пояси и колонки – изчисляване и конструиране."
  - title: "Зидани сгради в сеизмични райони"
    summary: "Изисквания на БДС EN 1998-1 към зиданите сгради: видове зидария, ограничения, правила за конструиране."
  - title: "Повреди и оценка на съществуващи зидани сгради"
    summary: "Характерни пукнатини и дефекти, причини, оценка на носещата способност преди реконструкция."
  - title: "Възстановяване и усилване"
    summary: "Методи за усилване на стени и на сградата като цяло, изчисляване на усилени зидани конструкции."
