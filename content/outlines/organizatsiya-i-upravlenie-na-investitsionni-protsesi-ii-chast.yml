title: "Организация и управление на инвестиционни процеси – II част"
slug: "organizatsiya-i-upravlenie-na-investitsionni-protsesi-ii-chast"
summary: "Календарно планиране с мрежови и линейни графици, ресурси, временно строителство, строителен ситуационен план и план за безопасност и здраве."
why: "Това са работните документи на всеки строеж – графикът, ситуационният план и планът за безопасност и здраве се изискват и се следят всеки ден."
related: ["Организация и управление на инвестиционни процеси – I част", "Организация и управление на строителството", "Организация на строителството", "План за безопасност и здраве и управление на строителните отпадъци"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&id=2234&m=40"
  note: "Официална страница на дисциплината в УАСГ (специалност „Управление в строителството“, катедра „Организация и икономика на строителството“) с приложен календарен план за упражненията и курсовия проект (https://old.uacg.bg/filebank/att_29196.pdf, 16 седмици). Главите следват темите на този план. Лекционна програма и анотация не са намерени (в ECTS пакета US_A.pdf дисциплината липсва), затова съдържанието на лекциите не е потвърдено."
chapters:
  - title: "Мрежови графици, ориентирани по работи и по събития"
    summary: "Елементи на мрежовия модел, правила за построяване, два начина на изобразяване."
  - title: "Изчисляване на мрежови графици"
    summary: "Таблично изчисляване на ранни и късни срокове, резерви и критичен път."
  - title: "Схеми на мрежовите графици"
    summary: "Изчертаване на графика в мащаб на времето и проверка на логическите връзки."
  - title: "Линеен календарен план"
    summary: "Работи, обеми, трудоемкост, състав на звената и продължителности в линеен график."
  - title: "Ресурсни диаграми"
    summary: "Диаграми на работната ръка, механизацията и материалите по време; неравномерност."
  - title: "Оптимизация на графици"
    summary: "Подобряване на графика по време и по ресурси в рамките на резервите."
  - title: "Оразмеряване на временното строителство"
    summary: "Временни сгради, складове, водоснабдяване и електрозахранване на площадката."
  - title: "Строителен ситуационен план"
    summary: "Разполагане на кранове, пътища, складове и временни сгради на строителната площадка."
  - title: "Схеми към плана за безопасност и здраве"
    summary: "Опасни зони, проходи, евакуационни пътища и места на съоръженията за безопасност."
  - title: "Организационни и технологични мерки по ЗБУТ"
    summary: "Основни действия и указания за преодоляване на опасностите при изпълнение на работите."
  - title: "План за предотвратяване и ликвидиране на пожари и аварии"
    summary: "Мерки, отговорности и ред за действие при пожар или авария на строежа."
