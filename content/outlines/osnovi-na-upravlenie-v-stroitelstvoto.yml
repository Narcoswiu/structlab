title: "Основи на управление в строителството"
slug: "osnovi-na-upravlenie-v-stroitelstvoto"
summary: "Основните понятия и функции на управлението, приложени към строителната фирма и строителния проект."
why: "Дава общата рамка, върху която стъпват всички следващи дисциплини по управление на проекти, риск, качество и доставки."
related: ["Основи на управлението", "Управление на строителна фирма"]
source:
  status: "unverified"
  url: ""
  note: "Официалната страница на дисциплината в УАСГ (old.uacg.bg, специалност „Управление в строителството“, катедра „Организация и икономика на строителството“) съществува, но съдържа само катедра и преподавател – без анотация и без програма. В ECTS пакета с анотации на специалността (US_A.pdf) дисциплината липсва. Главите са по стандартното съдържание на дисциплината и не са сверени с учебна програма – да се проверят с катедрата."
chapters:
  - title: "Строителството като отрасъл и обект на управление"
    summary: "Особености на строителния продукт и строителното производство, които определят управлението."
  - title: "Същност и функции на управлението"
    summary: "Планиране, организиране, ръководене и контрол; равнища на управление."
  - title: "Участници в инвестиционния процес"
    summary: "Възложител, проектант, строител, консултант, доставчици – роли и взаимоотношения."
  - title: "Строителната фирма като система"
    summary: "Вътрешна и външна среда, цели, ресурси и процеси на строителната фирма."
  - title: "Организационни структури в строителството"
    summary: "Линейна, функционална, матрична и проектна структура; организация на обекта."
  - title: "Планиране и цели"
    summary: "Стратегически, тактически и оперативни планове във фирмата и на обекта."
  - title: "Управленски решения"
    summary: "Етапи на вземане на решение, критерии за избор, решения при несигурност."
  - title: "Основи на управлението на проекти"
    summary: "Проект и жизнен цикъл; обхват, време, цена и качество като свързани ограничения."
  - title: "Управление на ресурсите"
    summary: "Работна сила, механизация, материали и финанси като управлявани ресурси."
  - title: "Ръководене на хора и екипи"
    summary: "Мотивация, стилове на ръководство и комуникация в строителния екип."
  - title: "Контрол и отчитане"
    summary: "Контрол на срокове, разходи и качество; показатели и обратна връзка."
