title: "Строителна динамика и сеизмичен анализ"
slug: "stroitelna-dinamika-i-seizmichen-analiz"
summary: "Трептения на конструкции, собствени честоти и форми, спектрален метод по Еврокод 8 и оценка на поведението при земетръс."
why: "Всяка сграда в земетръсен район се изчислява на сеизмични въздействия именно с тези методи."
related: ["Устойчивост и динамика на строителните конструкции"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS/SE/DSSAbCBC7SE.pdf"
  note: "Анотация от ECTS пакета на УАСГ (ССС, VII семестър, 45/45 ч.) – кратък текст, без номерирани теми; главите разгръщат изброените в нея теми."
chapters:
  - title: "Динамични въздействия и изчислителни модели"
    summary: "Видове динамични товари, степени на свобода и моделиране на инерционните свойства."
  - title: "Свободни трептения на система с една степен на свобода"
    summary: "Уравнение на движението, собствена честота и период, затихване на трептенията."
  - title: "Принудени трептения и резонанс"
    summary: "Хармонично въздействие, динамичен коефициент и влияние на затихването."
  - title: "Реагиране при произволно въздействие"
    summary: "Импулсен товар, интеграл на Дюамел и числено интегриране на уравнението на движението."
  - title: "Системи с повече степени на свобода"
    summary: "Матрици на масите и на коравина, собствени честоти и форми, ортогоналност."
  - title: "Модален анализ"
    summary: "Разлагане по собствени форми и определяне на усилията при динамичен товар."
  - title: "Сеизмично въздействие и спектри на реагиране"
    summary: "Движение на основата, акселерограми и построяване на спектър на реагиране."
  - title: "Спектрален метод по Еврокод 8"
    summary: "Проектен спектър, коефициент на поведение, модални сеизмични сили и комбинирането им."
  - title: "Анализ на историите във времето"
    summary: "Пряко интегриране на уравненията на движението при зададени записи на земетръси."
  - title: "Оценка на сеизмичното поведение"
    summary: "Методи за оценка на конструкциите при земетръс и препроектиране на съществуващи съоръжения."
