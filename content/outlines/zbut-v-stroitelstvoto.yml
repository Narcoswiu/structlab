title: "ЗБУТ в строителството"
slug: "zbut-v-stroitelstvoto"
summary: "Вредните и опасните фактори на строежа, как се предотвратяват и какво изисква нормативната уредба за безопасност."
why: "Ръководителят на проект и на обект организира работата така, че да няма злополуки, и отговаря за спазването на изискванията за безопасност."
related: ["Здравословни и безопасни условия на труд", "План за безопасност и здраве и управление на строителните отпадъци"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "ECTS пакет на УАСГ за специалност „Управление в строителството“ – кратка анотация (2 кредита, катедра „Технология и механизация на строителството“): общи и специфични вредни и опасни фактори, начини и средства за предотвратяването им, българска и европейска нормативна уредба. Списък на темите няма. Главите са по стандартното съдържание на дисциплината и са съгласувани с анотацията на ВСУ за „Здравословни и безопасни условия на труд“ – да се проверят по учебната програма."
chapters:
  - title: "Нормативна уредба за безопасност и здраве при работа"
    summary: "Българските и европейските изисквания и как са подредени."
  - title: "Участници в строителството и техните задължения"
    summary: "Отговорности на възложител, строител, технически ръководител и работещи."
  - title: "Опасни и вредни фактори в строителството"
    summary: "Общи и специфични фактори, които застрашават човека и околната среда."
  - title: "Оценка на риска"
    summary: "Как се откриват опасностите, оценява се рискът и се избират мерки."
  - title: "Вредни фактори на работната среда"
    summary: "Шум, вибрации, прах, микроклимат и осветление – въздействие и защита."
  - title: "Колективни и лични предпазни средства"
    summary: "Парапети, мрежи и огради; каски, колани и друго лично предпазно оборудване."
  - title: "Работа на височина и скелета"
    summary: "Предпазване от падане при скелета, платформи, покриви и отвори."
  - title: "Безопасност при земни, кофражни, бетонови и монтажни работи"
    summary: "Типични опасности и мерки при основните видове строителни работи."
  - title: "Безопасност при строителни машини и електробезопасност"
    summary: "Работа с кранове и машини, опасни зони, защита от електрически ток."
  - title: "Инструктажи, злополуки и документация"
    summary: "Обучение и инструктаж, действия при злополука и документите по безопасност на обекта."
