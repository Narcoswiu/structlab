title: "Транспортно строителство"
slug: "transportno-stroitelstvo"
summary: "Обзор на транспортната инфраструктура – пътища, железопътни линии и транспортни съоръжения – и на начина, по който се проектират и изграждат."
why: "Инфраструктурните проекти са голяма част от строителния пазар, а строителният мениджър ги планира, остойностява и ръководи."
related: ["Пътно и железопътно строителство", "Пътно строителство", "Железопътно строителство"]
source:
  status: "unverified"
  url: ""
  note: "Официална учебна програма или анотация не е намерена: в информационния пакет на УАСГ за специалност „Управление в строителството“ (https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf) и в списъка с дисциплини на специалността в old.uacg.bg тази дисциплина липсва. Главите следват обичайното съдържание на обзорен курс по транспортно строителство и са съгласувани с намерените програми по пътно и железопътно строителство за ССС – да се сверят с катедрата."
chapters:
  - title: "Транспортна система и видове транспорт"
    summary: "Видове транспорт, транспортна мрежа и класификация на пътищата и железопътните линии."
  - title: "Елементи на пътя и автомобилно движение"
    summary: "Елементи на пътя и характеристики на движението, които определят изискванията към него."
  - title: "Геометрично проектиране на пътя"
    summary: "Ситуация, надлъжен профил и напречен профил на пътя; видимост."
  - title: "Земно тяло и отводняване"
    summary: "Насипи и изкопи, разпределение на земните маси, отводнителни съоръжения."
  - title: "Пътни настилки"
    summary: "Видове настилки, пластове на пътната конструкция и принципи на оразмеряване."
  - title: "Устройство на железопътната линия"
    summary: "План и надлъжен профил на железопътната линия, криви и наклони."
  - title: "Долно и горно строене на железния път"
    summary: "Земно платно, баластова призма, траверси, релси и скрепления."
  - title: "Гари и коловозно развитие"
    summary: "Видове гари, стрелки и коловозни съединения."
  - title: "Транспортни съоръжения"
    summary: "Мостове, водостоци, тунели и подпорни стени по трасето – предназначение и видове."
  - title: "Технология и организация на изпълнението"
    summary: "Последователност на работите, механизация и контрол на качеството при линейни обекти."
  - title: "Поддържане и рехабилитация"
    summary: "Експлоатационно състояние, ремонт и усилване на пътища и железопътни линии."
