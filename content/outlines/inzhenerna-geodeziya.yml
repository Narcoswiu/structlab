title: "Инженерна геодезия"
slug: "inzhenerna-geodeziya"
summary: "Геодезически измервания и дейности при проучване, проектиране, трасиране, изграждане и експлоатация на строежи."
why: "Строителният инженер управлява и контролира строително-монтажните работи по геодезически данни: оси, коти и отклонения."
related: ["Геодезия"]
source:
  status: "unverified"
  url: "https://old.uacg.bg/?p=210&l=1&m=3&id=1257"
  note: "Отворена е официалната страница на дисциплината в УАСГ (катедра „Приложна геодезия“, специалност ССС). Тя дава само цел и списък с материали (ъглов, полигонов, нивелачен и дължинен карнет), без номерирани теми. Конспектът не е отварян. Главите следват стандартното съдържание и са съгласувани с „Геодезия“ на ВСУ."
chapters:
  - title: "Основни понятия, координатни системи и мащаб"
    summary: "Форма на Земята, координатни и височинни системи, мащаб и точност на плановете."
  - title: "Грешки при измерванията"
    summary: "Видове грешки, средна квадратна грешка и оценка на точността на измерванията."
  - title: "Измерване на хоризонтални и зенитни ъгли"
    summary: "Теодолит и тотална станция, начини на измерване и водене на ъглов карнет."
  - title: "Измерване на дължини"
    summary: "Ролетка и електронен далекомер, редукции и дължинен карнет."
  - title: "Нивелация"
    summary: "Геометрична и тригонометрична нивелация, нивелачен карнет, изчисляване на коти и надлъжен профил."
  - title: "Геодезическа основа и полигонови ходове"
    summary: "Опорни мрежи, полигонов ход, права и обратна геодезическа задача, изчисляване на координати."
  - title: "Топографска снимка и геодезически планове"
    summary: "Полярна снимка, изобразяване на релефа, четене и ползване на планове и карти."
  - title: "Площи, обеми и вертикално планиране"
    summary: "Определяне на площи, земни маси и проектни коти при подготовка на строителната площадка."
  - title: "Трасировъчни работи"
    summary: "Трасиране на оси, ъгли, дължини и коти на сгради и съоръжения; строителна мрежа и трасировъчен план."
  - title: "Геодезически контрол при строителството"
    summary: "Контрол на вертикалност, оси и коти при монтаж, екзекутивни снимки и допустими отклонения."
  - title: "Изследване на деформации на сгради и съоръжения"
    summary: "Измерване на слягания, наклони и хоризонтални премествания по време на строителство и експлоатация."
