title: "Строителни машини и механизация"
slug: "stroitelni-mashini-i-mehanizatsiya"
summary: "Устройство, действие, производителност и избор на строителните машини – от машинните елементи до крановете, багерите и бетонната техника."
why: "Който планира и ръководи строеж, избира машините по товароподемност и производителност и отговаря за правилната им експлоатация."
related: ["Строителни машини"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "ECTS пакет на УАСГ за специалност „Управление в строителството“ – кратка анотация на „Строителни машини и механизация“ (4 кредита, изпит), без списък на темите. Главите следват конспекта и календарния план на едноименната по съдържание дисциплина „Строителни машини“ за ССС от същата катедра и същия водещ преподавател (https://old.uacg.bg/?p=210&l=1&id=592&m=3, файлове att_29236.pdf и att_29586.pdf, 2025 г.) – не е потвърдено, че програмата за УС е същата. Подредбата е съгласувана с плана на модула „Строителни машини“ в StructLab; мостовите кранове идват от него и не фигурират в конспекта на УАСГ."
chapters:
  - title: "Механизация на строителството и задвижване на машините"
    summary: "Класификация на строителните машини, показатели за използването им, хидравлично задвижване, експлоатация и обслужване."
  - title: "Машинни елементи и възли"
    summary: "Съединения, ремъчни, зъбни и верижни предавки, оси, валове, лагери, съединители и спирачки."
  - title: "Въжета, полиспасти, лебедки и крикове"
    summary: "Куки, въжета, ролки и барабани; как лебедката и полиспастът вдигат товара."
  - title: "Кулови кранове"
    summary: "Видове, основни възли, устойчивост, товарна характеристика и производителност."
  - title: "Самоходни стрелови кранове"
    summary: "Автомобилни, пневмоколесни и верижни кранове – устройство, устойчивост и избор."
  - title: "Мостови, портални и кабелни кранове"
    summary: "Кранове по релсов път и по носещо въже – устройство и област на приложение."
  - title: "Подемници и транспортьори"
    summary: "Строителни подемници, лентови и винтови транспортьори, кошови елеватори – производителност."
  - title: "Земекопни и земекопно-транспортни машини"
    summary: "Багери, булдозери, скрепери, грейдери и товарачи – работни органи, съпротивления и производителност."
  - title: "Трошачни и пресевни машини"
    summary: "Челюстни, конусни и ударни трошачки, пресевни машини и трошачно-сортировъчни инсталации."
  - title: "Машини за приготвяне на бетон и разтвори"
    summary: "Бетоносмесители и дозатори – видове, действие и производителност."
  - title: "Машини за транспортиране, полагане и уплътняване на бетон"
    summary: "Бетон-помпи, разтворови помпи и вибратори за бетон."
  - title: "Уплътнителни и пилотонабивни машини"
    summary: "Валяци, вибрационни плочи и трамбовки; машини и чукове за пилоти; механизирани инструменти и компресори."
