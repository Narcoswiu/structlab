title: "Управление на риска"
slug: "upravlenie-na-riska"
summary: "Как се откриват, оценяват и овладяват рисковете в строителен проект – от плана за управление на риска до контрола."
why: "Закъсненията, поскъпването и авариите на строежа рядко са изненада – ръководителят на проект ги предвижда и залага резерви и мерки предварително."
related: ["Управление на качеството на проекта", "Договори в строителството. ФИДИК"]
source:
  status: "unverified"
  url: ""
  note: "Официалната страница на дисциплината в УАСГ (old.uacg.bg, специалност „Управление в строителството“, катедра „Организация и икономика на строителството“) съществува, но съдържа само катедра и преподавател – без анотация и без програма. В ECTS пакета с анотации на специалността (US_A.pdf) дисциплината липсва. Главите са съобразени с анотацията на сродната дисциплина „Управление на риска на проекта“ за специалност ССС (ECTS пакет SSS_A.pdf: план за управление на риска, определяне на рисковете, качествен и количествен анализ, контрол), но за самата дисциплина програма не е намерена – да се провери с катедрата."
chapters:
  - title: "Риск и несигурност в строителните проекти"
    summary: "Понятие за риск, вероятност и въздействие, положителни и отрицателни рискове."
  - title: "Източници на риск в строителството"
    summary: "Технически, геоложки, пазарни, договорни, организационни и външни рискове."
  - title: "План за управление на риска"
    summary: "Методология, участници и отговорности, формати и скали за оценка."
  - title: "Идентифициране на рисковете"
    summary: "Методи за откриване на рискове и съставяне на регистър на рисковете."
  - title: "Качествен анализ на риска"
    summary: "Оценка по вероятност и въздействие, матрица на риска, подреждане по важност."
  - title: "Количествен анализ на риска"
    summary: "Очаквана стойност, анализ на чувствителността, сценарии и симулации."
  - title: "Планиране на реакция на риска"
    summary: "Избягване, намаляване, прехвърляне и приемане; резерви за време и разходи."
  - title: "Разпределение на риска чрез договори и застраховане"
    summary: "Кой носи риска според договора; гаранции и застраховки в строителството."
  - title: "Наблюдение и контрол на рисковете"
    summary: "Проследяване на регистъра, нови рискове, оценка на ефекта от мерките."
