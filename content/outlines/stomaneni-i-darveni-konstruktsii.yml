title: "Стоманени и дървени конструкции"
slug: "stomaneni-i-darveni-konstruktsii"
summary: "Принципи на проектиране на конструкции от стомана и дърво: поведение и оразмеряване на елементи и съединения, конструктивни системи."
why: "Строителният мениджър оценява конструктивни решения, чертежи и изпълнение на стоманени и дървени конструкции."
related: ["Стоманени конструкции", "Метални конструкции", "Дървени и пластмасови конструкции", "Конструкции от дървесина и конструкционни композити"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "Информационен пакет с анотации на УАСГ за „Управление в строителството“: дисциплина SITSbCBC, V семестър, 45 ч. лекции и 30 ч. упражнения, с кратка анотация – принципи на проектиране, елементи и съединения, композиционни решения и конструктивни системи. Списък с теми няма – разбивката на глави е наша по стандартното съдържание."
chapters:
  - title: "Стоманата като конструктивен материал"
    summary: "Свойства и класове на стоманата, профили, предимства и недостатъци на стоманените конструкции."
  - title: "Основи на оразмеряването"
    summary: "Гранични състояния, въздействия и комбинации в рамката на Еврокодовете."
  - title: "Стоманени елементи"
    summary: "Опън, натиск и изкълчване, огъване и измятане – основни проверки по БДС EN 1993-1-1."
  - title: "Съединения в стоманените конструкции"
    summary: "Заварени и болтови съединения – видове, работа и основни проверки."
  - title: "Греди, ферми и колони от стомана"
    summary: "Конструктивно оформяне и характерни детайли на основните стоманени елементи."
  - title: "Стоманени конструктивни системи"
    summary: "Едноетажни производствени сгради и етажни сгради, пространствено укрепяване."
  - title: "Дървесината като конструктивен материал"
    summary: "Структура, якости, влияние на влажността, защита от биологични повреди и пожар."
  - title: "Дървени елементи"
    summary: "Опън, натиск, огъване и комбинирани въздействия – основни проверки по БДС EN 1995-1-1."
  - title: "Съединения в дървените конструкции"
    summary: "Врязвания, гвоздеи, болтове, дюбели и лепила."
  - title: "Дървени конструктивни системи"
    summary: "Покривни конструкции, ферми, лепени греди и рамки, укрепяване."
