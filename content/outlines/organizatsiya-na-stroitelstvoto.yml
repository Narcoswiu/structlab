title: "Организация на строителството"
slug: "organizatsiya-na-stroitelstvoto"
summary: "Нормиране на труда, поточен метод, линейни и мрежови календарни графици и строителен ситуационен план."
why: "Строителният инженер планира по тези методи сроковете, работниците, машините и подредбата на площадката за всеки обект."
related: ["Организация и управление на строителството"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивна анотация на ВСУ (код ССС-41, учебен план от 2014 г., VII и VIII семестър, общо 90 ч. лекции и 60 ч. упражнения, курсов проект). Главите следват темите в анотацията. Актуална учебна програма на ВСУ не е публикувана, затова не е сигурно, че съдържанието важи и днес."
chapters:
  - title: "Инвестиционен процес в строителството"
    summary: "Същност и елементи на инвестиционния процес, нормативни документи, участници и видове строежи."
  - title: "Техническо нормиране и разход на работно време"
    summary: "Методи за изследване на работното време и обработване на хронометражни редове."
  - title: "Норми за труд и разход на ресурси"
    summary: "Норма време и норма изработка, оразмеряване на разхода на труд, материали и машинно време."
  - title: "Цени в строителството и заплащане на труда"
    summary: "Методи за формиране на цените и организация на заплащането."
  - title: "Организационни методи и поточен метод"
    summary: "Последователен, успореден и поточен метод; ритмични, кратноритмични и неритмични потоци."
  - title: "Оразмеряване на потоци и циклограми"
    summary: "Аналитично и графично оразмеряване на строителен поток с циклограма."
  - title: "Линеен календарен план"
    summary: "Трудоемкост, състав на звеното, продължителност на работите, хоризонтални диаграми и оптимизиране."
  - title: "Мрежови графици – модели и построяване"
    summary: "Мрежови модели, ориентирани към събития и към работи; метод на критичния път и метод на потенциалите."
  - title: "Параметри и оптимизиране на мрежовия график"
    summary: "Ранни и късни срокове, резерви, критичен път, табличен метод и оптимизиране на графика."
  - title: "Контрол на ресурсите по време на строителството"
    summary: "Форми за следене на разхода на труд, материали и машини спрямо графика."
  - title: "Строителен ситуационен план"
    summary: "Предназначение, обхват, видове и основни елементи на плана на строителната площадка."
  - title: "Временно строителство и план за безопасност и здраве"
    summary: "Временни сгради, складове, пътища и проводи; временна организация на движението; план за безопасност и здраве."
