title: "Сградни инсталации"
slug: "sgradni-instalatsii"
summary: "Видовете инженерни инсталации в сградите – ВиК, отопление, вентилация, климатизация и електрически – техните елементи и оразмеряване."
why: "Инсталациите заемат място, минават през конструкцията и се изпълняват в определен ред – инженерът трябва да ги съгласува със строежа."
related: ["Сградни инсталации и съоръжения"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивирана официална страница с анотации на ВСУ за специалност ССС, учебен план от 2014 г. (дисциплина ССС-25, V семестър, 45 ч. лекции и 30 ч. упражнения, курсов проект). Анотацията описва обхвата общо – електрически, ВиК, ОВК и други инсталации, мрежи и елементи, изисквания, проектиране и оразмеряване – без списък по теми. Разделянето на глави е наше, в рамките на този обхват; да се свери с актуалната програма."
chapters:
  - title: "Видове сградни инсталации и изисквания към тях"
    summary: "Обхват, предназначение и основни технически, нормативни и конструктивни изисквания."
  - title: "Сградна водопроводна инсталация"
    summary: "Схеми на водоснабдяване, елементи на мрежата, тръби и арматури, принципи на оразмеряване."
  - title: "Сградна канализационна инсталация"
    summary: "Елементи на канализацията, отвеждане на битови и дъждовни води, принципи на оразмеряване."
  - title: "Отоплителни инсталации"
    summary: "Топлинни загуби на помещенията, видове отоплителни системи и техните елементи."
  - title: "Вентилация и климатизация"
    summary: "Естествена и механична вентилация, климатични системи, въздуховоди и съоръжения."
  - title: "Електрически инсталации в сгради"
    summary: "Захранване, табла, силови и осветителни инсталации, защити и заземяване."
  - title: "Други инсталации в сградата"
    summary: "Допълнителни инженерни инсталации и мястото им в общото решение на сградата."
  - title: "Съгласуване и последователност на изпълнение"
    summary: "Трасета, шахти и отвори в конструкцията; ред на изпълнение на инсталационните работи."
