title: "Управление на качеството на проекта"
slug: "upravlenie-na-kachestvoto-na-proekta"
summary: "Концепциите за качество, системите за управление на качеството и прилагането им в строителни проекти и строителни фирми."
why: "Строителят отговаря за качеството пред възложителя и надзора – трябва да го планира, доказва и документира, а не само да го поправя."
related: ["Управление на риска", "Управление на доставките"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "Официална анотация в ECTS информационния пакет на специалност „Управление в строителството“ в УАСГ (сигнатура PQMbCBC, VI семестър, 30 ч. лекции, изпит): класически концепции от контрола на качеството до съвременните тенденции, системи за управление на качеството и стандартите ISO, изграждане на качеството в организациите, управление на качеството в проекти и в строителни фирми с масово производство. Подробна учебна програма по теми не е намерена – подредбата и детайлите в главите са наши."
chapters:
  - title: "Понятие за качество и развитие на концепциите"
    summary: "Качество, изисквания и удовлетвореност на клиента; от контрол към управление на качеството."
  - title: "Осигуряване и цялостно управление на качеството"
    summary: "Предотвратяване вместо проверка, участие на всички, разходи за качество."
  - title: "Системи за управление на качеството"
    summary: "Изисквания на международните стандарти от серията ISO 9000 и структура на системата."
  - title: "Процесен подход и непрекъснато подобряване"
    summary: "Процеси, показатели, цикъл „планирай – изпълни – провери – действай“."
  - title: "Изграждане на качеството в организацията"
    summary: "Политика и цели по качеството, отговорности, документирана информация."
  - title: "Планиране на качеството в проекта"
    summary: "Изисквания към резултата, план за качество, критерии за приемане."
  - title: "Осигуряване и контрол на качеството в проекта"
    summary: "Проверки, изпитвания, записи и доказване на съответствието при изпълнението."
  - title: "Инструменти за анализ на качеството"
    summary: "Контролни листове, диаграма на Парето, причинно-следствена диаграма, контролни карти."
  - title: "Качество в строителна фирма с масово производство"
    summary: "Управление на качеството при серийно производство на строителни продукти и елементи."
  - title: "Несъответствия, одити и подобряване"
    summary: "Управление на дефекти, коригиращи действия, вътрешни одити и преглед от ръководството."
