title: "Управление на човешките ресурси на проекти"
slug: "upravlenie-na-choveshkite-resursi-na-proekti"
summary: "Как се планира, набира, развива и ръководи екипът на един строителен проект."
why: "Един строеж се прави от хора от много фирми и професии – ръководителят на проект трябва да ги подбере, разпредели и задържи до края."
related: ["Развитие на лидерски умения", "Междуличностна комуникация"]
source:
  status: "unverified"
  url: ""
  note: "Официалната страница в УАСГ (old.uacg.bg, ?p=210&l=1&id=2258&m=40; там името е „Управление на човешките ресурси на проекта“) съдържа само катедра и преподавател – без анотация. В ECTS пакета на специалността (US_A.pdf) дисциплината липсва. Главите са по стандартното съдържание на дисциплината и не са сверени с учебна програма – да се проверят с катедрата."
chapters:
  - title: "Човешките ресурси в проекта"
    summary: "Особености на временния проектен екип спрямо постоянния персонал на фирмата."
  - title: "Организационна структура и роли в проекта"
    summary: "Организационна схема на проекта, роли и матрица на отговорностите."
  - title: "Планиране на потребностите от персонал"
    summary: "Брой, квалификация и време на заетост според графика на проекта."
  - title: "Набиране и подбор"
    summary: "Вътрешни и външни източници, критерии и методи за подбор на членове на екипа."
  - title: "Изграждане и развитие на екипа"
    summary: "Етапи в развитието на екипа, обучение, въвеждане на нови хора."
  - title: "Мотивация и възнаграждение"
    summary: "Материални и нематериални стимули, заплащане според резултатите."
  - title: "Оценка на изпълнението"
    summary: "Цели, показатели, обратна връзка и атестиране на членовете на екипа."
  - title: "Управление на конфликти в екипа"
    summary: "Причини за конфликти в проекти и подходи за разрешаването им."
  - title: "Трудови отношения и безопасност на труда"
    summary: "Основни задължения на работодателя и ръководителя към работещите на обекта."
  - title: "Освобождаване на екипа при приключване на проекта"
    summary: "Пренасочване на хората и запазване на натрупания опит."
