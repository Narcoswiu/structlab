title: "Микроикономика"
slug: "mikroikonomika"
summary: "Поведение на потребители и фирми: търсене, предлагане, еластичност, разходи, пазарни структури и факторни пазари."
why: "С нея строителният мениджър разбира как се образуват цените на строителния пазар и как фирмата избира обем, разходи и оферта."
related: ["Макроикономика", "Обща икономическа теория", "Въведение в икономиката", "Икономика на строителството"]
source:
  status: "unverified"
  url: ""
  note: "Страницата на дисциплината за „Управление в строителството“ в УАСГ (https://old.uacg.bg/?p=210&l=1&id=2206&m=40, катедра „Организация и икономика на строителството“) съществува, но е без анотация и без приложени файлове; дисциплината липсва и в информационния пакет с анотации на специалността. Планът е по стандартното съдържание на курс по микроикономика."
chapters:
  - title: "Предмет и метод на микроикономиката"
    summary: "Оскъдност, избор, алтернативни разходи и икономически модели."
  - title: "Търсене и предлагане"
    summary: "Закони на търсенето и предлагането, пазарно равновесие и изменението му."
  - title: "Еластичност"
    summary: "Ценова, доходна и кръстосана еластичност и значението им за приходите на фирмата."
  - title: "Потребителско поведение"
    summary: "Полезност, криви на безразличие, бюджетна линия и потребителски избор."
  - title: "Производство и производствена функция"
    summary: "Производствени фактори, общ, среден и пределен продукт, закон за намаляващата възвръщаемост."
  - title: "Разходи на фирмата"
    summary: "Постоянни, променливи, средни и пределни разходи в кратък и дълъг период."
  - title: "Приходи, печалба и оптимален обем"
    summary: "Общ и пределен приход, критична точка и максимизиране на печалбата."
  - title: "Съвършена конкуренция"
    summary: "Поведение на фирмата и на отрасъла при съвършено конкурентен пазар."
  - title: "Монопол и несъвършена конкуренция"
    summary: "Монопол, олигопол и монополистична конкуренция; пазарна власт и ценообразуване."
  - title: "Пазари на производствените фактори"
    summary: "Пазар на труда, капитала и земята; работна заплата, лихва и рента."
  - title: "Пазарни дефекти и държавна намеса"
    summary: "Външни ефекти, обществени блага, асиметрична информация и регулиране."
