title: "Компютърни системи в строителството"
slug: "kompyutarni-sistemi-v-stroitelstvoto"
summary: "Избор и използване на компютърни системи за инженерни изчисления, анализ на конструкции, управление на проекти и документация."
why: "Строителният инженер ежедневно смята, моделира, планира и оформя документи с компютърни системи."
related: []
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS/SE/CSCEbCBC4SE.pdf"
  note: "Анотация от ECTS пакета на УАСГ (ССС, IV и V семестър; 15/30 и 30/30 ч.) – кратък текст с пет направления, без номерирани теми; главите разгръщат тези направления. Втората част (V семестър) е със същата анотация: https://old.uacg.bg/filebank/ECTS/SE/CSCEbCBC5SE.pdf."
chapters:
  - title: "Компютърните системи в работата на инженера"
    summary: "Видове системи, сфери на приложение в строителството и критерии за избор."
  - title: "Инженерни изчисления с електронни таблици"
    summary: "Формули, таблици с данни и графики за типични строителни изчисления."
  - title: "Инженерни изчисления с математически системи"
    summary: "Запис на формули с мерни единици, решаване на уравнения и работа с матрици."
  - title: "Изчислителен модел на строителна конструкция"
    summary: "Оси, възли, сечения, материали и опори в програма за анализ."
  - title: "Товари и анализ на модела"
    summary: "Товарни състояния, комбинации и получаване на усилия и премествания."
  - title: "Критична оценка на резултатите"
    summary: "Проверки за равновесие и сравнение с ръчно решение на опростена схема."
  - title: "Управление на проекти"
    summary: "Дейности, зависимости и ресурси; линеен и мрежов график на строителен проект."
  - title: "Чертежи и техническа документация"
    summary: "Оформяне на чертежи, изчислителни записки и таблици по изискванията за проектна документация."
  - title: "Представяне на резултатите"
    summary: "Подготовка на презентация и защита на инженерно решение пред аудитория."
  - title: "Сравнителен анализ на системи"
    summary: "Съпоставяне на възможностите на различни системи за една и съща инженерна задача."
