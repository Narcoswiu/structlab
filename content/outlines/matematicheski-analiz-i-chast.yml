title: "Математически анализ – I част"
slug: "matematicheski-analiz-i-chast"
summary: "Диференциално и интегрално смятане на функция на една променлива и начало на функциите на няколко променливи."
why: "Производните и интегралите са езикът на механиката – с тях се намират разрезни усилия, провисвания, лица, обеми и центрове на тежестта."
related: ["Математически анализ", "Математически анализ – II част"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/att_28024.pdf"
  note: "Учебна програма на УАСГ „Математически анализ 1“ за специалност ССС (катедра „Математика“, I семестър, 45 ч. лекции + 45 ч. упражнения) – 13 лекционни теми, 20 упражнения и конспект. Документът е проект към учебен план от 2025 г. – номерът на протокола на АС не е попълнен и няма подписи. Главите следват лекционните теми; комплексните числа са взети от темите на упражненията."
chapters:
  - title: "Множества, числови множества и комплексни числа"
    summary: "Операции с множества, реални числа, комплексни числа в алгебричен и тригонометричен вид."
  - title: "Полиноми и рационални функции"
    summary: "Корени на полиноми, разлагане на множители и разлагане на рационална функция на елементарни дроби."
  - title: "Числови редици"
    summary: "Сходящи и монотонни редици, намиране на граници на редици."
  - title: "Граница на функция и елементарни функции"
    summary: "Основните елементарни функции, граница на функция и техники за пресмятането ѝ."
  - title: "Непрекъснатост и обратна функция"
    summary: "Непрекъснати и монотонни функции, обратна функция и обратни тригонометрични функции."
  - title: "Производна и диференциал"
    summary: "Геометричен смисъл, правила и таблични производни, производни и диференциали от по-висок ред."
  - title: "Основни теореми, Лопитал и формула на Тейлор"
    summary: "Теореми за средните стойности, правила на Лопитал, формули на Тейлор и Маклорен."
  - title: "Изследване на функции и графики"
    summary: "Приложение на производните за изследване на функция; векторна функция на скаларен аргумент."
  - title: "Неопределен интеграл"
    summary: "Примитивна функция, смяна на променливата, интегриране по части, рационални и ирационални функции."
  - title: "Определен интеграл"
    summary: "Дефиниция, свойства и методи за пресмятане на определен интеграл."
  - title: "Приложения на интеграла в геометрията и механиката"
    summary: "Лица, дължини, обеми и физични величини, пресметнати с определен интеграл."
  - title: "Функции на няколко променливи"
    summary: "Частни производни, пълен диференциал, локални екстремуми и производни на неявни функции."
