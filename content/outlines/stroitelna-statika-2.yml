title: "Строителна статика – II част"
slug: "stroitelna-statika-2"
summary: "Статически неопределими конструкции: силов и деформационен метод, непрекъснати греди, ферми, дъги, линии на влияние."
why: "Реалните рамки, непрекъснати греди и дъги са статически неопределими и се изчисляват с тези методи."
related: ["Строителна статика – I част"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS/SE/STS2bCBC6SE.pdf"
  note: "Анотация от ECTS пакета на УАСГ (ССС, VI семестър, 30/45 ч.) – кратък текст, без номерирани теми. Съгласувано с архивната анотация на ВСУ (план 2014, ССС-24) – https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153. Във ВСУ силовият метод е в тази част, в УАСГ – в I част."
chapters:
  - title: "Статическа и кинематическа неопределимост"
    summary: "Степен на неопределимост, излишни връзки и неизвестни премествания; избор на метод."
  - title: "Силов метод: основна система и канонични уравнения"
    summary: "Единични и товарни диаграми, коефициенти, окончателни диаграми и проверки."
  - title: "Силов метод при температура и поддаване на опори"
    summary: "Свободни членове от нетоварни въздействия; премествания в неопределими системи."
  - title: "Непрекъснати греди. Тримоментови уравнения"
    summary: "Решение по силов метод с опорните моменти като неизвестни."
  - title: "Статически неопределими ферми и комбинирани системи"
    summary: "Прътови усилия по силов метод при външно и вътрешно неопределими схеми."
  - title: "Деформационен метод: основни зависимости"
    summary: "Кинематически определима основна система, реакции на прътите, канонични уравнения."
  - title: "Деформационен метод за изместваеми рамки"
    summary: "Ъглови и линейни неизвестни; температура и поддаване на опори."
  - title: "Смесен и комбиниран метод. Симетрия"
    summary: "Съчетаване на силов и деформационен метод; симетрично и обратно симетрично натоварване."
  - title: "Линии на влияние в статически неопределими системи"
    summary: "Линии на влияние по силов метод чрез линии на влияние за премествания; построяване по вид."
  - title: "Статически неопределими дъги"
    summary: "Двуставна и безставна дъга: хоризонтален разпор и разрезни усилия."
  - title: "Греди върху еластична основа"
    summary: "Модел на Винклер, диференциално уравнение и решения за характерни товари."
  - title: "Пространствени рамки и матрична формулировка"
    summary: "Шест разрезни усилия в прът; преход към матричния запис и метода на крайните елементи."
