title: "Счетоводство в строителството"
slug: "schetovodstvo-v-stroitelstvoto"
summary: "Основи на счетоводството и особеностите му в строителната фирма: активи, разходи по обекти, приходи по договори, отчети."
why: "Мениджърът следи разходите и резултата по всеки обект и чете финансовите отчети на своята фирма, на подизпълнители и на клиенти."
related: ["Корпоративни финанси", "Икономика на строителството", "Ценообразуване в строителството", "Финансово управление на проекти"]
source:
  status: "unverified"
  url: ""
  note: "Страницата на дисциплината за „Управление в строителството“ в УАСГ (https://old.uacg.bg/?p=210&l=1&id=2242&m=40, катедра „Организация и икономика на строителството“) е без анотация и без приложени файлове; дисциплината липсва в информационния пакет с анотации на специалността. Планът е по стандартното съдържание на курс по счетоводство с приложение в строителството; приложимите счетоводни стандарти да се уточнят по програмата на катедрата."
chapters:
  - title: "Предмет, метод и принципи на счетоводството"
    summary: "Задачи на счетоводството, основни принципи и счетоводна политика на предприятието."
  - title: "Активи, собствен капитал и пасиви. Счетоводен баланс"
    summary: "Имущество на предприятието, източници на финансиране и балансово равенство."
  - title: "Счетоводни сметки и двойно записване"
    summary: "Сметки, дебит и кредит, счетоводни статии, сметкоплан."
  - title: "Документиране и инвентаризация"
    summary: "Първични счетоводни документи, счетоводни регистри и инвентаризация."
  - title: "Отчитане на дълготрайните активи"
    summary: "Придобиване, амортизация и отписване на машини, съоръжения и други дълготрайни активи."
  - title: "Отчитане на материалните запаси"
    summary: "Доставка, изписване и оценка на строителните материали и незавършеното производство."
  - title: "Отчитане на труда и разчетите"
    summary: "Разчети с персонала, доставчици, клиенти, подизпълнители и бюджета."
  - title: "Разходи и себестойност на строителната продукция"
    summary: "Отчитане на разходите по обекти и видове, преки и непреки разходи."
  - title: "Приходи по договори за строителство"
    summary: "Признаване на приходите според етапа на завършеност на обекта."
  - title: "Финансов резултат и капитал"
    summary: "Формиране на печалбата или загубата и отчитане на собствения капитал."
  - title: "Годишен финансов отчет"
    summary: "Баланс, отчет за приходите и разходите, отчет за паричните потоци и приложения."
