title: "Стоманени и комбинирани мостове"
slug: "stomaneni-i-kombinirani-mostove"
summary: "Пътни конструкции, пълностенни, кутиени и прътови главни греди, комбинирани мостове, лагеруване, умора и сеизмично осигуряване."
why: "Нужна е при проектиране и обследване на железопътни и пътни мостове със стоманена или комбинирана връхна конструкция."
related: ["Мостове", "Стоманобетонни мостове", "Метални конструкции", "Специални стоманени конструкции"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/att_27381.pdf"
  note: "Конспект и изисквания на УАСГ за ССС, IX семестър (30 въпроса, приет от катедра „Метални, дървени и пластмасови конструкции“ през септември 2024 г.). Главите групират въпросите от конспекта. За ВСУ програма не е намерена."
chapters:
  - title: "Стоманени мостове: части и системи"
    summary: "Области на приложение, основни части, видове главни носещи системи."
  - title: "Умора на материала"
    summary: "Същност и фактори, S-N линии, спектър на напреженията, правило за натрупване на повреди – БДС EN 1993-1-9."
  - title: "Пътни конструкции при железопътни мостове"
    summary: "Отворени пътни скари, лъкатушни и спирателни връзки, затворени конструкции с баластово легло."
  - title: "Пътни конструкции при пътни мостове"
    summary: "Натоварване по БДС EN 1991-2, композиция и особености на изследването."
  - title: "Ортотропни пътни конструкции"
    summary: "Композиция, поведение, изоставане от срязване, устойчивост на ортотропни плочи в натискова зона."
  - title: "Пълностенни главни греди"
    summary: "Гранични диаграми, напречни сечения, местна устойчивост, монтажни снаждания."
  - title: "Кутиени главни греди"
    summary: "Композиция и конструиране, усукване, ограничена депланация и дисторсия."
  - title: "Прътови главни греди"
    summary: "Конструктивна форма и решетки, сечения на прътите, възли и снаждания на поясите."
  - title: "Пространствено укрепяване"
    summary: "Надлъжни ветрови връзки, напречни връзки и портални рамки, устойчивост на пояси с U-рамки."
  - title: "Комбинирани стомано-стоманобетонни мостове"
    summary: "Етапи на работа, пълзене и съсъхване, непрекъснати греди, дюбели и надлъжно срязване – БДС EN 1994-2."
  - title: "Лагеруване и сеизмично осигуряване"
    summary: "Лагерни движения и видове лагери, сеизмично поведение, изолация и демпфери – БДС EN 1998-2."
  - title: "Рамкови, дъгови, вантови и висящи мостове; монтаж"
    summary: "Общи сведения за системите при големи отвори и особености при монтажа на връхните конструкции."
