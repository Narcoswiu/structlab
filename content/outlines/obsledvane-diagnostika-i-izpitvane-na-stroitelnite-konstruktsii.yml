title: "Обследване, диагностика и изпитване на строителните конструкции"
slug: "obsledvane-diagnostika-i-izpitvane-na-stroitelnite-konstruktsii"
summary: "Обследване на съществуващи конструкции, откриване на повреди, безразрушителен контрол, статични и динамични изпитвания."
why: "Нужна е при технически паспорт, реконструкция, надстрояване или оценка на сграда след повреда."
related: ["Обследване и изпитване на строителни конструкции", "Зидани конструкции", "Стоманобетон", "Стоманени конструкции", "Метални конструкции"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивно копие на официалния сайт на ВСУ (анотации на специалност ССС, учебен план от 2014 г.); може да не е актуално. Там дисциплината е ССС-43 „Обследване и изпитване на строителни конструкции“ – името в сегашното разписание е по-дълго и не е сигурно, че съдържанието е същото. Главите следват темите от архивната анотация; главата за оценка и заключение е добавена от нас."
chapters:
  - title: "Цели, видове и етапи на обследването"
    summary: "Задачи и съдържание на обследването на конструкции и елементи, проучване на документацията."
  - title: "Повреди и дефекти на конструкциите"
    summary: "Откриване и регистриране на характерни повреди при стоманобетонни, зидани, стоманени и дървени конструкции."
  - title: "Измервателни средства"
    summary: "Уреди за премествания, деформации и сили – класификация, изисквания, избор, монтаж и снемане на отчети."
  - title: "Безразрушителен контрол"
    summary: "Методи за определяне на якостта на бетона, положението на армировката и дефектите без разрушаване."
  - title: "Статично изпитване"
    summary: "Цели, подготовка, начини на натоварване, степени на натоварване и измервани величини."
  - title: "Обработка и анализ на резултатите"
    summary: "Статистическа обработка на измерванията, сравнение с изчислителния модел, грешки при измерване."
  - title: "Динамични изпитвания"
    summary: "Натоварвания, измервани величини, видове виброграми, определяне на динамичните характеристики."
  - title: "Оценка на състоянието и заключение"
    summary: "Оценка на годността на конструкцията за експлоатация и съдържание на доклада от обследването."
