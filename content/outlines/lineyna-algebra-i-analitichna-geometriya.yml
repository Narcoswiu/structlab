title: "Линейна алгебра и аналитична геометрия"
slug: "lineyna-algebra-i-analitichna-geometriya"
summary: "Матрици, детерминанти, системи линейни уравнения, вектори, прави и равнини, криви и повърхнини от втора степен."
why: "Матричното смятане стои зад изчисляването на конструкции, а векторите и уравненията на прави и равнини – зад статиката и геометрията на съоръженията."
related: []
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/att_28156.pdf"
  note: "Учебна програма на УАСГ за специалност ССС (катедра „Математика“, I семестър, 45 ч. лекции + 30 ч. упражнения, по учебен план от 2016 г.) – 16 лекционни теми и конспект; документът е без подписи. Главите следват тези теми. За ВСУ е намерена само архивна анотация по учебен план от 2014 г. (https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153) – темите съвпадат, но там има и комплексни числа и полиноми; актуална програма на ВСУ не е публикувана."
chapters:
  - title: "Матрици и действия с тях"
    summary: "Видове матрици, събиране, умножение с число, умножение на матрици и транспониране."
  - title: "Детерминанти"
    summary: "Детерминанти от втори и трети ред, свойства и пресмятане на детерминанта от произволен ред."
  - title: "Ранг на матрица и системи линейни уравнения"
    summary: "Елементарни преобразувания, метод на Гаус, теорема на Кронекер–Капели и хомогенни системи."
  - title: "Обратна матрица и матрични уравнения"
    summary: "Кога съществува обратна матрица, как се намира и как с нея се решават матрични уравнения."
  - title: "Вектори, базис и координатни системи"
    summary: "Линейни операции с вектори, линейна зависимост и независимост, базис и координати на вектор и точка."
  - title: "Скаларно, векторно и смесено произведение"
    summary: "Произведения на два и три вектора и приложенията им за ъгли, лица, обеми и момент на сила."
  - title: "Права в равнината"
    summary: "Видове уравнения на права, нормално уравнение, взаимно положение на прави, разстояния и ъгли."
  - title: "Равнина и права в пространството"
    summary: "Уравнения на равнина и права, взаимно положение на права и равнина и на две прави, основни задачи."
  - title: "Окръжност и конусни сечения"
    summary: "Окръжност, елипса, хипербола и парабола – канонични уравнения и свойства."
  - title: "Векторни пространства и линейни оператори"
    summary: "Крайномерно векторно пространство, линеен оператор, собствени стойности и собствени вектори на матрица."
  - title: "Криви и повърхнини от втора степен"
    summary: "Общо уравнение на линия от втора степен и канонизиране, сфера и повърхнини от втора степен."
