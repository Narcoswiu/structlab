title: "Бизнес планиране"
slug: "biznes-planirane"
summary: "Как се съставя бизнес план: анализ на пазара, маркетингов, производствен, организационен и финансов план, оценка на риска."
why: "С бизнес план строителната фирма обосновава нов обект или дейност пред собственици, банки и инвеститори."
related: ["Предприемачество", "Маркетинг", "Корпоративни финанси", "Икономика на строителството"]
source:
  status: "unverified"
  url: ""
  note: "Официална програма или анотация на ВСУ за дисциплината в специалност „Строителен мениджмънт“ не е намерена: архивната страница с анотации на vsu.bg обхваща само специалност ССС, а на текущия сайт са открити само разписания. В архивната анотация по „Икономика на строителството“ на ВСУ изработването на бизнес план е само една от темите. Планът е по стандартната структура на бизнес плана."
chapters:
  - title: "Същност и роля на бизнес планирането"
    summary: "Видове планове, предназначение на бизнес плана и неговите ползватели."
  - title: "Структура на бизнес плана и резюме"
    summary: "Основни раздели на бизнес плана и съставяне на резюмето."
  - title: "Описание на фирмата и на бизнес идеята"
    summary: "Мисия, цели, продукти и услуги на строителната фирма."
  - title: "Анализ на средата и на отрасъла"
    summary: "Външна и вътрешна среда, силни и слаби страни, възможности и заплахи."
  - title: "Пазар и конкуренти"
    summary: "Проучване на търсенето, целеви клиенти и анализ на конкурентите."
  - title: "Маркетингов план"
    summary: "Продукт, цена, пласмент и комуникация; прогноза за продажбите."
  - title: "Производствен план"
    summary: "Технология, мощности, материали, механизация и подизпълнители."
  - title: "Организационен план и човешки ресурси"
    summary: "Организационна структура, управленски екип и потребност от персонал."
  - title: "Финансов план"
    summary: "Прогнозни приходи и разходи, парични потоци, необходими средства и източници."
  - title: "Оценка на ефективността и на риска"
    summary: "Показатели за ефективност, критична точка, анализ на чувствителността."
  - title: "Представяне и изпълнение на бизнес плана"
    summary: "Представяне пред инвеститори и банки, контрол и актуализация на плана."
