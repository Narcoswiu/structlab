title: "Теоретична механика – I част"
slug: "teoretichna-mehanika-i-chast"
summary: "Статика: сили и моменти, редукция на системи сили, равновесие, опорни реакции, герберови греди, триставни системи и ферми."
why: "Без опорни реакции и разрезни усилия не започва нито едно изчисление на конструкция."
related: ["Теоретична механика – II част", "Съпротивление на материалите", "Строителна механика"]
source:
  status: "unverified"
  url: ""
  note: "Не е намерена публикувана програма с теми; редът следва обичайното съдържание на статиката и темите от конспекта на курса."
chapters:
  - title: "Сила, момент на сила и двоица"
    summary: "Силата като вектор, проекции, събиране на сходящи сили, момент спрямо точка, двоица сили."
  - title: "Редукция на равнинна система сили"
    summary: "Главен вектор и главен момент, смяна на редукционния център, равнодействаща и нейната директриса, разпределени товари."
  - title: "Равновесие на тяло в равнината. Опорни реакции"
    summary: "Трите условия за равновесие, видове опори, статическа определимост, реакции на греда и на рамка."
  - title: "Герберова греда"
    summary: "Многоотворна статически определима греда със стави: основни и второстепенни части, ставни сили, проверки."
  - title: "Триставни системи"
    summary: "Триставна рамка и дъга: четири реакции от три уравнения плюс условието в ставата; диада."
  - title: "Ферми"
    summary: "Прътови усилия по метода на изрязване на възли и чрез Ритерови разрези; нулеви пръти; план на Кремона."
  - title: "Център на тежестта на равнинна фигура"
    summary: "Статичен момент, център на тежестта на съставна фигура, фигури с отвори."
  - title: "Редукция на пространствена система сили"
    summary: "Момент спрямо ос, главен вектор и главен момент в пространството, инварианти, динама, основни случаи."
  - title: "Равновесие на тяло в пространството"
    summary: "Шестте условия за равновесие, пространствени опори, реакции на плоча и на пространствена греда."
