title: "Технология на строителството – I част"
slug: "tehnologiya-na-stroitelstvoto-1-chast"
summary: "Как се изпълняват основните строителни процеси на площадката: транспорт, земни работи, пилоти, кофражи, армировка и бетониране."
why: "Всеки технически ръководител и проектант избира машини, кофраж и ред на работа по тези правила, когато подготвя и води един строеж."
related: ["Технология на строителството – II част"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Главите следват архивната анотация на ВСУ за „Технология на строителните процеси“ (код ССС-34, учебен план от 2014 г., два семестъра: 45+15 и 45+15 часа) – под това име дисциплината е в онзи план. Анотацията е обща за двата семестъра; разделянето на темите между I и II част тук е предположение. За УАСГ са отворени само кратките анотации в ECTS пакетите (https://old.uacg.bg/filebank/ECTS-NOW/STR/SSS_A.pdf и https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf) – те не изброяват теми, но не противоречат на това разделяне. Актуална учебна програма не е намерена."
chapters:
  - title: "Основни понятия в технологията на строителното производство"
    summary: "Строителен процес, работна операция, технологично проектиране, технологични схеми и карти."
  - title: "Транспортни и товаро-разтоварни работи"
    summary: "Видове транспорт, временни пътища, комплектация и контейнеризация, брой и график на транспортните средства."
  - title: "Земни работи – почви и подготовка"
    summary: "Строително-технологични свойства на почвите, разкъртване, отводняване и временно укрепване на изкопи."
  - title: "Механизирано изпълнение на земните работи"
    summary: "Работа с багери, скрепери, булдозери и автогрейдери; избор на комплект машини и разпределение на земните маси."
  - title: "Пилотни работи"
    summary: "Забиване на готови пилоти и изграждане на изливни пилоти."
  - title: "Кофражи"
    summary: "Сглобяемо-разглобяеми кофражи за стени, колони и плочи, рамкови и гредови кофражи, катерещ се кофраж."
  - title: "Строителни и кофражни скелета"
    summary: "Класификация, устройство, натоварване и приложение на скелетата."
  - title: "Армировъчни работи"
    summary: "Видове армировка и армировъчни изделия, монтаж на армировката в кофража."
  - title: "Бетониране и уплътняване на конструкции"
    summary: "Полагане и уплътняване на бетона, монолитно бетониране и бетониране с работни фуги."
  - title: "Бетонови работи при особени условия"
    summary: "Втвърдяване на бетона през зимата, ускоряване с химични добавки, бетониране под вода, торкретиране."
