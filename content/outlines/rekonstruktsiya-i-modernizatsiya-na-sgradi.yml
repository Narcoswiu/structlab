title: "Реконструкция и модернизация на сгради"
slug: "rekonstruktsiya-i-modernizatsiya-na-sgradi"
summary: "Как се обследва съществуваща сграда, как се оценява състоянието на конструкцията и как се усилва, преустройва и обновява."
why: "Голяма част от строителството е работа по съществуващи сгради, където мениджърът трябва да планира обследване, усилване и обновяване."
related: []
source:
  status: "unverified"
  url: ""
  note: "Официална учебна програма или анотация не е намерена: в информационния пакет на УАСГ за специалност „Управление в строителството“ (https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf) и в списъка с дисциплини на специалността в old.uacg.bg тази дисциплина липсва. Главите следват обичайното съдържание на дисциплината в строителните специалности – да се сверят с програмата на катедрата."
chapters:
  - title: "Видове намеси в съществуващи сгради"
    summary: "Ремонт, реконструкция, модернизация, основно обновяване и промяна на предназначението."
  - title: "Обследване и технически паспорт"
    summary: "Цел, обхват и етапи на обследването; документиране на състоянието на сградата."
  - title: "Дефекти и повреди в конструкциите"
    summary: "Пукнатини, корозия, слягания и овлажняване – признаци и причини."
  - title: "Диагностика на материали и конструкции"
    summary: "Безразрушителни и разрушителни методи за установяване на якост, армировка и състояние."
  - title: "Оценка на носимоспособността и сеизмичната осигуреност"
    summary: "Проверка на съществуващата конструкция за действащите натоварвания и изисквания."
  - title: "Усилване на основи"
    summary: "Разширяване и подхващане на фундаменти, заздравяване на земната основа."
  - title: "Усилване на стоманобетонни конструкции"
    summary: "Обличане, допълнителни сечения, външна армировка и нови носещи елементи."
  - title: "Усилване на зидани конструкции"
    summary: "Инжектиране, пояси, обтегачи и армирани замазки за зидани стени."
  - title: "Усилване на стоманени и дървени конструкции"
    summary: "Увеличаване на сечения, подмяна на елементи и защита от корозия и биологични повреди."
  - title: "Надстрояване, пристрояване и преустройство"
    summary: "Нови натоварвания, връзка между нова и стара конструкция, отвори в носещи елементи."
  - title: "Обновяване на ограждащи елементи и инсталации"
    summary: "Топлоизолация, хидроизолация, подмяна на дограма и на сградни инсталации."
  - title: "Организация и безопасност на изпълнението"
    summary: "Работа в обитавана сграда, временно укрепване, разрушаване и управление на отпадъците."
