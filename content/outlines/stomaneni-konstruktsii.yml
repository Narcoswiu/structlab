title: "Стоманени конструкции"
slug: "stomaneni-konstruktsii"
summary: "Стоманата като материал, оразмеряване на елементи и съединения по Еврокод 3, ферми, колони и едноетажни производствени сгради."
why: "Нужна е за проектиране и изпълнение на халета, покривни конструкции, площадки и стоманени сгради."
related: ["Метални конструкции", "Специални стоманени конструкции", "Стоманени и комбинирани мостове", "Проектиране на стоманени конструкции за сеизмични въздействия", "Стоманени и дървени конструкции"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивно копие на официалния сайт на ВСУ (анотации на специалност ССС, учебен план от 2014 г.); може да не е актуално. Дисциплина ССС-28 „Стоманени конструкции“ с три модула лекции и курсов проект на едноетажна производствена сграда; главите следват темите от модулите."
chapters:
  - title: "Стоманата като конструктивен материал"
    summary: "Видове стомани и означения, сортамент на профилите, работа на стоманата при различни условия на натоварване."
  - title: "Основи на оразмеряването"
    summary: "Гранични състояния, частни коефициенти, комбинации на усилията, класификация на напречните сечения."
  - title: "Носимоспособност на напречните сечения"
    summary: "Опън, натиск, огъване, срязване и комбинации; пластична става; усукване."
  - title: "Устойчивост на елементите"
    summary: "Изкълчване при центричен натиск, измятане на греди, натиск с огъване по БДС EN 1993-1-1."
  - title: "Заварени съединения"
    summary: "Видове шевове, оразмеряване на челни и ъглови шевове, конструктивни правила."
  - title: "Болтови съединения"
    summary: "Ненапрегнати и предварително напрегнати болтове – носимоспособност, оразмеряване и конструиране."
  - title: "Греди и гредови конструкции"
    summary: "Видове греди, оразмеряване, съединения на главни и второстепенни греди, снаждания."
  - title: "Колони"
    summary: "Видове колони, основни проверки, конструиране и оразмеряване на главата и базата."
  - title: "Ферми"
    summary: "Видове ферми, оразмеряване на прътите и възлите, особености при тежки ферми."
  - title: "Едноетажни производствени сгради"
    summary: "Напречни рамки, покривно и стенно ограждане, подкранови конструкции, горно осветление."
  - title: "Пространствено укрепяване"
    summary: "Предназначение и разполагане на връзките, укрепяване на рамки с прътови ригели и на сгради с кранове."
  - title: "Етажни и високи сгради"
    summary: "Общи сведения за конструкциите на етажни и високи сгради със стоманена конструкция."
