title: "Сградни инсталации и съоръжения"
slug: "sgradni-instalatsii-i-saorazheniya"
summary: "Системи и схеми за водоснабдяване, канализация, санитарни помещения, сметоотстраняване и електросъоръжаване на сградите."
why: "Строителният мениджър планира и приема инсталационните работи и трябва да знае къде минават инсталациите и какво място изискват."
related: ["Сградни инсталации"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "Информационен пакет (ECTS) на УАСГ за специалност „Управление в строителството“: кратка анотация на дисциплината (катедра „Технология на архитектурата“, IV семестър, 30 ч. лекции и 30 ч. упражнения). Намерена е само анотацията – конспект по теми не е открит. Главите следват изброените в анотацията области; разделянето им е наше и следва да се свери с програмата на катедрата."
chapters:
  - title: "Технически изисквания, системи и схеми"
    summary: "Общи изисквания към сградните инсталации, видове системи и принципни схеми."
  - title: "Сградно водоснабдяване"
    summary: "Системи и елементи на водопроводната инсталация, принципи на проектиране и изпълнение."
  - title: "Сградна канализация"
    summary: "Системи и елементи на канализационната инсталация, принципи на проектиране и изпълнение."
  - title: "Санитарни помещения"
    summary: "Санитарни прибори, габарити и разположение на помещенията в сградата."
  - title: "Сметоотстраняване"
    summary: "Начини за събиране и отстраняване на отпадъците от сградата и необходимите помещения."
  - title: "Електросъоръжаване на сгради"
    summary: "Системи за електроснабдяване на сградата и основни елементи на електрическото оборудване."
  - title: "Асансьори и ескалатори"
    summary: "Видове, габарити и изисквания към шахтите и машинните помещения."
  - title: "Габарити и местоположение на инсталациите"
    summary: "Разполагане на инсталациите и съоръженията в сградата и съгласуването им със строителната част."
