title: "Специални стоманобетонни конструкции"
slug: "spetsialni-stomanobetonni-konstruktsii"
summary: "Гредостени и конзоли, черупки и куполи, резервоари, водни кули, силози, бункери, комини, подпорни стени и басейни."
why: "Нужна е при проектиране на инженерни съоръжения – резервоари, пречиствателни станции, силози, кули, подпорни стени."
related: ["Стоманобетон", "Стоманобетонни конструкции", "Масивни конструкции"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/att_27082.pdf"
  note: "Конспект на УАСГ за специалност ССС – конструкции, IX семестър (46 въпроса, септември 2024 г.), приложен към страницата на дисциплината в катедра „Масивни конструкции“. Главите групират въпросите от конспекта. За ВСУ програма не е намерена."
chapters:
  - title: "Гредостени, конзоли и прътови модели"
    summary: "Къси и високи греди, конзолни стени, къси и герберови конзоли – носимоспособност и конструиране с прътови модели."
  - title: "Кръгли плочи, пръстени и напрегнати плочи"
    summary: "Кръгли плочи, опорни и фундаментни пръстени, предварително напрегнати плочи, ортогонална армировка в плочи."
  - title: "Черупки: мембранно и моментово състояние"
    summary: "Форми и класификация на тънкостенните конструкции, гранични условия, опорни конструкции, краеви ефекти."
  - title: "Ротационни черупки и възли"
    summary: "Куполи и цилиндрични стени при ососиметричен товар, прости и сложни възли между ротационни елементи."
  - title: "Полегати и цилиндрични покривни черупки"
    summary: "Черупки с положителна, нулева и отрицателна гаусова кривина – мембранно състояние и конструиране."
  - title: "Кръгли резервоари"
    summary: "Конструктивни решения, меродавни въздействия, дъно, предварително напрягане, температурни въздействия."
  - title: "Правоъгълни резервоари и пречиствателни съоръжения"
    summary: "Натоварване, изчисляване и конструиране на стените и ъглите; утаители и други съоръжения."
  - title: "Водни кули, телевизионни кули и комини"
    summary: "Конструктивни решения и особености при изчисляването на високи съоръжения; сеизмика при надземни резервоари."
  - title: "Силози и бункери"
    summary: "Композиционни решения, силозен натиск, изчисляване и конструиране на стени, дъно и фундамент."
  - title: "Подпорни стени и плувни басейни"
    summary: "Конструктивни решения, натоварвания и изчисления; сеизмични въздействия при ъглови подпорни стени."
