title: "Макроикономика"
slug: "makroikonomika"
summary: "Икономиката като цяло: брутен продукт, равновесие, растеж и цикъл, инфлация, безработица, фискална и парична политика."
why: "Лихвите, инфлацията и фазата на цикъла определят търсенето на строителство, цената на кредита и поскъпването на материалите."
related: ["Микроикономика", "Обща икономическа теория", "Въведение в икономиката", "Икономика на строителството"]
source:
  status: "unverified"
  url: ""
  note: "Страницата на дисциплината за „Управление в строителството“ в УАСГ (https://old.uacg.bg/?p=210&l=1&id=2207&m=40, катедра „Организация и икономика на строителството“) е без анотация; приложените към нея файлове са календарни планове на други дисциплини. Дисциплината липсва в информационния пакет с анотации на специалността. Планът е по стандартното съдържание на курс по макроикономика и е съгласуван с макро частта на „Обща икономическа теория“ в УАСГ."
chapters:
  - title: "Предмет на макроикономиката и кръгооборот"
    summary: "Макроикономически цели, сектори на икономиката и кръгооборот на доходи и разходи."
  - title: "Измерване на икономическата активност"
    summary: "Брутен вътрешен продукт, номинални и реални величини, ценови индекси."
  - title: "Съвкупно търсене и съвкупно предлагане"
    summary: "Модел на съвкупното търсене и предлагане и макроикономическо равновесие."
  - title: "Потребление, спестяване и инвестиции"
    summary: "Съвкупни разходи, мултипликатор и ролята на инвестициите."
  - title: "Икономически растеж"
    summary: "Източници и фактори на дългосрочния растеж."
  - title: "Икономически цикъл"
    summary: "Фази на цикъла и причини за колебанията в стопанската активност."
  - title: "Безработица"
    summary: "Видове безработица, измерване и икономически последици."
  - title: "Инфлация"
    summary: "Същност, причини, измерване и последици на инфлацията."
  - title: "Държавен бюджет и фискална политика"
    summary: "Приходи и разходи на държавата, бюджетен дефицит и държавен дълг."
  - title: "Пари, банкова система и парична политика"
    summary: "Функции на парите, търговски банки, централна банка и лихвени проценти."
  - title: "Отворена икономика"
    summary: "Международна търговия, платежен баланс и валутни курсове."
