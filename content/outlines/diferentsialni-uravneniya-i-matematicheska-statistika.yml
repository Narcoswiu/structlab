title: "Диференциални уравнения и математическа статистика"
slug: "diferentsialni-uravneniya-i-matematicheska-statistika"
summary: "Обикновени и частни диференциални уравнения, числено решаване, вероятности и основни статистически методи."
why: "Диференциалните уравнения описват огъването на греди и трептенията, а статистиката стои зад обработката на изпитвания и надеждността на конструкциите."
related: ["Математически анализ – II част"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивно копие на официалния сайт на ВСУ: анотация на дисциплината (ССС-14) по учебен план на специалност ССС от 2014 г., II курс, III семестър. Анотацията изброява темите накратко, без часове; главите следват техния ред. Актуална програма на ВСУ не е публикувана и анотацията може да е остаряла."
chapters:
  - title: "Диференциални уравнения от първи ред"
    summary: "Основни понятия, задача на Коши и основните типове уравнения, решени спрямо производната."
  - title: "Уравнения от втори ред с понижаване на реда"
    summary: "Случаите, в които уравнение от втори ред се свежда до уравнение от първи ред."
  - title: "Линейни уравнения от n-ти ред"
    summary: "Линейни уравнения с променливи и с постоянни коефициенти, общо и частно решение."
  - title: "Системи диференциални уравнения"
    summary: "Линейни системи с постоянни коефициенти и нелинейни системи в симетричен вид."
  - title: "Числени методи за диференциални уравнения"
    summary: "Основни методи за приближено решаване на задачата на Коши."
  - title: "Частни диференциални уравнения"
    summary: "Уравнения от първи и втори ред – основни понятия и класически примери."
  - title: "Случайни събития и вероятност"
    summary: "Действия със събития, класическа вероятност, условна вероятност и независимост."
  - title: "Случайни величини и разпределения"
    summary: "Дискретни и непрекъснати величини, числови характеристики и основни разпределения."
  - title: "Статистически оценки"
    summary: "Извадка, точкови и интервални оценки на параметрите на разпределение."
  - title: "Корелационен и регресионен анализ"
    summary: "Коефициент на корелация и линейна регресия по метода на най-малките квадрати."
  - title: "Проверка на статистически хипотези"
    summary: "Нулева и алтернативна хипотеза, ниво на значимост и основни критерии."
