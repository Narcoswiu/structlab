title: "Стоманобетон"
slug: "stomanobeton"
summary: "Свойства на бетона и армировката, гранични състояния и оразмеряване на плочи, греди, колони и фундаменти по Еврокод 2."
why: "Всяка монолитна сграда се оразмерява и армира с тези проверки – от плочата до фундамента."
related: ["Стоманобетонни конструкции", "Специални стоманобетонни конструкции", "Масивни конструкции", "Проектиране на стоманобетонни конструкции за сеизмични въздействия", "Стоманобетонни мостове"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=179&l=1&f=2&dp=22&id=421"
  note: "Страница на дисциплината в катедра „Масивни конструкции“ на УАСГ с анотация и приложен конспект за ССС (41 въпроса, 2012 г.); главите следват конспекта. Сверено и с архивната анотация на ВСУ (ССС-27, план 2014). Конспектът е стар – да се свери с актуалния."
chapters:
  - title: "Материали: бетон и армировъчна стомана"
    summary: "Якости и класове на бетона, съсъхване и пълзене, работни диаграми, класове армировка, сцепление."
  - title: "Метод на граничните състояния"
    summary: "Стадии на работа на сечението, въздействия и комбинации, изчислителни характеристики по БДС EN 1990 и БДС EN 1992-1-1."
  - title: "Огъване"
    summary: "Форми на разрушаване и носимоспособност на правоъгълни и плочогредови сечения с единична и двойна армировка."
  - title: "Натиск и опън с огъване"
    summary: "Нецентричен натиск с голям и малък ексцентрицитет, центричен и нецентричен опън, стройни колони и ефекти от втори ред."
  - title: "Срязване и усукване"
    summary: "Елементи със и без напречна армировка, прътови модели за D-области, къси конзоли, усукване със срязване и огъване."
  - title: "Експлоатационни гранични състояния"
    summary: "Ограничаване на напреженията, изчисляване и контрол на пукнатините и на провисванията."
  - title: "Дълготрайност и конструиране на армировката"
    summary: "Класове по въздействие на средата, бетонно покритие, закотвяне и снаждане на армировката."
  - title: "Плочи и подови конструкции"
    summary: "Еднопосочно и двупосочно армирани плочи, главни и второстепенни греди, стълби, безгредови плочи и продънване."
  - title: "Колони и фундаменти"
    summary: "Конструиране на колони; единични фундаменти при центрично и нецентрично натоварване."
  - title: "Предварително напрегнат стоманобетон"
    summary: "Начини на напрягане, загуби на напрежение, проверки по експлоатационни и крайни гранични състояния."
