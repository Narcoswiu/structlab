title: "Организация и управление на строителството"
slug: "organizatsiya-i-upravlenie-na-stroitelstvoto"
summary: "Как се подготвя и води един инвестиционен проект: участници, възлагане, календарни графици, площадка и контрол."
why: "Инженерът на обекта и ръководителят на проекта работят всеки ден с договори, графици и план на площадката – това е техният инструментариум."
related: ["Организация на строителството", "Организация и управление на инвестиционни процеси – I част", "Организация и управление на инвестиционни процеси – II част"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&id=554&m=3"
  note: "Официална страница на дисциплината за специалност ССС в УАСГ (катедра „Организация и икономика на строителството“) с анотация; същият текст е в ECTS пакета (https://old.uacg.bg/filebank/ECTS-NOW/STR/SSS_A.pdf: IX семестър, 45 ч. лекции, 3 кредита, изпит). Учебна програма с теми по часове не е намерена – главите следват изброените в анотацията въпроси, а подредбата и подробностите са по стандартното съдържание на дисциплината."
chapters:
  - title: "Инвестиционен процес в строителството"
    summary: "Етапи и фази на инвестиционния процес и участници в него."
  - title: "Възлагане чрез обществени поръчки"
    summary: "Процедури за избор на проектант и строител при обществени поръчки."
  - title: "Договори за проектиране и строителство"
    summary: "Видове договори за възлагане, предмет, срокове и отговорности на страните."
  - title: "Методи за организация на строителството"
    summary: "Последователно, успоредно и поточно изпълнение на строителните работи."
  - title: "Календарно планиране – линейни графици"
    summary: "Определяне на обеми, трудоемкост и продължителност и съставяне на линеен график."
  - title: "Календарно планиране – мрежови графици"
    summary: "Мрежов модел, критичен път, резерви на времето и оптимизиране на графика."
  - title: "Организация на строителната площадка"
    summary: "Строителен ситуационен план, временни сгради, складове, пътища и захранване на площадката."
  - title: "Контрол на качеството на строително-монтажните работи"
    summary: "Системи за контрол на качеството и документи, с които се доказва изпълнението."
  - title: "Оперативно ръководство и контрол по време на строителството"
    summary: "Следене на изпълнението спрямо графика, отчитане и управление на отклоненията."
