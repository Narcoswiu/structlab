title: "Автоматизация на конструктивното проектиране"
slug: "avtomatizatsiya-na-konstruktivnoto-proektirane"
summary: "Моделиране и статичен и динамичен анализ на равнинни и пространствени конструкции с програми и критична оценка на резултатите."
why: "Проектантът моделира сградата с програма за анализ и носи отговорност за верността на получените усилия."
related: ["Компютърни системи в строителната механика", "Компютърни методи за проектиране на строителни конструкции"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивна анотация на ВСУ по учебен план 2014 за ССС-30 „Автоматизация на строително-конструктивното проектиране“ (името се различава леко от сегашното; може да не е актуална). Анотацията назовава конкретни програмни продукти – тук те са описани само като вид инструмент."
chapters:
  - title: "Принципи на компютъризираното проектиране"
    summary: "Етапи на работа, видове програми за анализ на конструкции и граници на приложимост."
  - title: "Изчислителен модел на конструкцията"
    summary: "Прътови и повърхнинни елементи, възли, опори и връзки между елементите."
  - title: "Материали, сечения и коравини"
    summary: "Задаване на характеристики и влиянието им върху разпределението на усилията."
  - title: "Товарни състояния и комбинации"
    summary: "Постоянни и променливи товари, дефиниране на комбинации на разрезните усилия."
  - title: "Статичен анализ на равнинна рамка"
    summary: "Модел, решение и диаграми на разрезните усилия за различни товарни състояния."
  - title: "Моделиране и анализ на плоча"
    summary: "Мрежа от крайни елементи, опорни условия и разчитане на огъващите моменти."
  - title: "Пространствени модели на сгради"
    summary: "Съвместна работа на рамки, стени и плочи в тримерен модел."
  - title: "Динамичен анализ"
    summary: "Маси, собствени периоди и форми; сеизмично въздействие върху модела."
  - title: "Тълкуване и критичен анализ на резултатите"
    summary: "Проверки за равновесие и правдоподобност; типични грешки при моделиране."
  - title: "Изчислителна записка"
    summary: "Оформяне на входните данни, схемите, диаграмите и резултатите от изчислението."
