title: "Основи на хидравликата, водоснабдяването и канализацията"
slug: "osnovi-na-hidravlikata-vodosnabdyavaneto-i-kanalizatsiyata"
summary: "Закони за равновесие и движение на течностите и устройство на водоснабдителните и канализационните мрежи."
why: "Строителният инженер предвижда и изгражда водопровод и канализация на сгради, строителни площадки и населени места."
related: ["Водно строителство"]
source:
  status: "unverified"
  url: "https://old.uacg.bg/?p=210&l=1&m=3&id=898"
  note: "Отворена е официалната страница на дисциплината в УАСГ (катедра „Водоснабдяване, канализация и пречистване на води“, специалност ССС). Анотацията посочва само обхвата: закони за равновесие и движение на течностите; водоснабдителни и канализационни мрежи и съоръжения на населени места, сгради и строителни площадки. Номерирани теми няма; главите следват стандартното съдържание."
chapters:
  - title: "Свойства на течностите"
    summary: "Плътност, вискозитет, свиваемост; модел на идеална и на реална течност."
  - title: "Хидростатика"
    summary: "Хидростатично налягане, основно уравнение, сила на натиск върху равнинни и криволинейни стени."
  - title: "Основни уравнения на движението на течностите"
    summary: "Водно количество, уравнение за непрекъснатост и уравнение на Бернули."
  - title: "Хидравлични загуби и режими на движение"
    summary: "Ламинарен и турбулентен режим, загуби по дължина и местни загуби."
  - title: "Напорни тръбопроводи и изтичане"
    summary: "Оразмеряване на прости и сложни тръбопроводи; изтичане през отвори и накрайници."
  - title: "Безнапорно движение в канали и тръби"
    summary: "Равномерно движение в открити канали и в частично запълнени канализационни тръби."
  - title: "Водоснабдяване на населени места"
    summary: "Водоснабдителни норми и количества, водоизточници, водовземане, резервоари и помпени станции."
  - title: "Водопроводни мрежи"
    summary: "Схеми на мрежите, тръби и арматури, оразмеряване на клонове и изисквания при полагане."
  - title: "Канализация на населени места"
    summary: "Канализационни системи, отпадъчни и дъждовни води, оразмеряване на канали и съоръжения."
  - title: "Сградни водопроводни и канализационни инсталации"
    summary: "Сградно водопроводно и канализационно отклонение, вертикални и хоризонтални клонове, прибори."
  - title: "Водоснабдяване и отводняване на строителната площадка"
    summary: "Временни водопроводи и канализация, противопожарни нужди и отводняване на изкопи."
