title: "Електротехника"
slug: "elektrotehnika"
summary: "Електрически вериги, машини и инсталации – колкото е нужно, за да се разбира електрозахранването на сгради и строителни площадки."
why: "Строителят координира електроинсталациите в сградата и отговаря за временното захранване и електробезопасността на обекта."
related: []
source:
  status: "unverified"
  url: ""
  note: "В учебния план на УАСГ за „Управление в строителството“ дисциплината е в I семестър с 30 часа лекции и 2 кредита, но страницата с анотацията ѝ във файла с анотации е празна; друга официална програма не е намерена. Главите следват стандартното съдържание на електротехника за строителни специалности."
chapters:
  - title: "Електрически вериги за постоянен ток"
    summary: "Напрежение, ток, съпротивление, закони на Ом и Кирхоф, мощност и енергия."
  - title: "Еднофазни вериги за променлив ток"
    summary: "Синусоидални величини, активна и реактивна мощност, фактор на мощността."
  - title: "Трифазни вериги"
    summary: "Свързване звезда и триъгълник, линейни и фазни величини, трифазна мощност."
  - title: "Електрически измервания"
    summary: "Измерване на ток, напрежение, мощност и енергия; електромери."
  - title: "Трансформатори"
    summary: "Принцип на действие, параметри и приложение в електроснабдяването."
  - title: "Електрически машини и задвижвания"
    summary: "Асинхронни двигатели, пускане и управление, задвижване на строителни машини."
  - title: "Електроснабдяване на сгради и строителни площадки"
    summary: "Мрежи ниско напрежение, табла, кабели и временно захранване на обекта."
  - title: "Електрически инсталации и осветление в сгради"
    summary: "Силови и осветителни инсталации, избор на проводници, осветителни уредби."
  - title: "Защитни апарати и електробезопасност"
    summary: "Предпазители и прекъсвачи, заземяване, зануляване, мълниезащита."
