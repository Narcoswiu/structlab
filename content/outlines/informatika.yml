title: "Информатика"
slug: "informatika"
summary: "Основи на програмирането и работа с програма за компютърно чертане – от алгоритъм до отпечатан строителен чертеж."
why: "Инженерът автоматизира изчисленията си с малки програми и изработва чертежите си на компютър."
related: ["Програмиране и използване на изчислителните системи", "Автоматизация на инженерния труд", "Автоматизация на инженерния труд – I част", "Автоматизация на инженерния труд – II част"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "ВСУ, архивно копие на официалния сайт (20.01.2018): анотация на „Информатика“ (ССС-4) по учебния план на ССС от 2014 г. – два модула (програмиране и компютърно чертане), 30 ч. лекции и 60 ч. упражнения. Анотацията назовава конкретни продукти (свободна среда за Pascal и CAD система); тук са описани общо. Анотацията е стара и е за ССС; дали важи днес, не е потвърдено."
chapters:
  - title: "Алгоритми и езици за програмиране"
    summary: "Какво е алгоритъм, начини за описание и видове езици за програмиране."
  - title: "Интегрирана среда за програмиране"
    summary: "Създаване, компилиране и изпълнение на програма; структура на програмата."
  - title: "Типове данни и присвояване"
    summary: "Основни типове, променливи, оператор за присвояване и преобразуване на типа."
  - title: "Аритметични и логически изрази"
    summary: "Операции, приоритет и съставяне на изрази за инженерни формули."
  - title: "Условен и съставен оператор"
    summary: "Разклоняване на изчисленията според условие."
  - title: "Оператори за цикъл"
    summary: "Цикли с брояч и с условие; натрупване на суми и търсене."
  - title: "Масиви"
    summary: "Едномерни и двумерни масиви и типични действия с тях."
  - title: "Среда за компютърно чертане"
    summary: "Интерфейс, файлови формати и настройки на работната среда."
  - title: "Слоеве, чертане и редактиране"
    summary: "Организация на чертежа чрез слоеве; основни чертожни и редактиращи команди."
  - title: "Блокове и атрибути"
    summary: "Повторяеми елементи, атрибути и извличане на информация от чертежа."
  - title: "Оразмеряване, надписване и щриховане"
    summary: "Размерни стилове, текст и щриховки по правилата на строителния чертеж."
  - title: "Печат и връзка с други програми"
    summary: "Подготовка за отпечатване в мащаб и обмен на данни с други програмни системи."
