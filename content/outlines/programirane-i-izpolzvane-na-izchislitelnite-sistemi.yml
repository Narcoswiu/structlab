title: "Програмиране и използване на изчислителните системи"
slug: "programirane-i-izpolzvane-na-izchislitelnite-sistemi"
summary: "Устройство на компютъра, алгоритми и основи на програмирането с език, вграден в електронна таблица."
why: "Със собствени малки програми инженерът автоматизира повтарящи се изчисления и таблици."
related: ["Информатика", "Автоматизация на инженерния труд", "Автоматизация на инженерния труд – I част"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/SSS_A.pdf"
  note: "УАСГ, анотации към учебния план на ССС (ECTS пакет): темите са изброени в анотацията (30 ч. лекции, 30 ч. упражнения, I семестър). По нея езикът е VBA в средата на електронна таблица; тук е описан общо."
chapters:
  - title: "Основни понятия на приложната информатика"
    summary: "Информация, данни, бройни системи и представяне на данните в компютъра."
  - title: "Апаратна и програмна част на компютъра"
    summary: "Основни компоненти на персоналния компютър и видове софтуер."
  - title: "Операционни системи"
    summary: "Принципи на изграждане и функции; файлове и папки."
  - title: "Алгоритми"
    summary: "Видове алгоритми и описанието им с блок-схеми."
  - title: "Типове данни и променливи"
    summary: "Деклариране на променливи, константи и основни типове данни."
  - title: "Аритметични, логически и релационни операции"
    summary: "Изрази, приоритет на операциите и съставяне на условия."
  - title: "Условно изпълнение и преход"
    summary: "Оператори за разклоняване на програмата."
  - title: "Оператори за цикъл"
    summary: "Цикли с брояч и с условие; обработка на редици от стойности."
  - title: "Функции"
    summary: "Собствени процедури и функции, параметри и връщана стойност."
  - title: "Обекти"
    summary: "Работа с обектите на електронната таблица – клетки, области, листове."
  - title: "Работа с файлове"
    summary: "Четене и запис на данни във файл."
