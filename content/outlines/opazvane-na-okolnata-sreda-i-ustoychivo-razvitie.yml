title: "Опазване на околната среда и устойчиво развитие"
slug: "opazvane-na-okolnata-sreda-i-ustoychivo-razvitie"
summary: "Въздействията на строителните проекти върху околната среда, начините за ограничаването им и принципите на устойчивото развитие."
why: "Ръководителят на проект отговаря за екологичните разрешения, мерките на площадката и за това проектът да е устойчив през целия си живот."
related: ["Екология и устойчиво строителство"]
source:
  status: "unverified"
  url: ""
  note: "Официална анотация на УАСГ за тази дисциплина не е намерена: тя липсва в ECTS пакета с анотации за специалност „Управление в строителството“ (https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf) и няма собствена страница в списъка с дисциплини на old.uacg.bg. Главите са по стандартното съдържание на дисциплината и трябва да се проверят по учебната програма. Номера на нормативни актове нарочно не са посочени."
chapters:
  - title: "Околна среда и основни екологични понятия"
    summary: "Компоненти на околната среда, екосистеми, природни ресурси и замърсяване."
  - title: "Устойчиво развитие – принципи и цели"
    summary: "Екологично, икономическо и социално измерение на устойчивото развитие."
  - title: "Въздействие на строителните проекти върху околната среда"
    summary: "Въздействия по етапи: проектиране, строителство, експлоатация и разрушаване."
  - title: "Опазване на въздуха и климата"
    summary: "Източници на емисии и прах в строителството и мерки за намаляването им."
  - title: "Опазване на водите, почвите и биоразнообразието"
    summary: "Защита на водни обекти, почвен слой и защитени територии при строеж."
  - title: "Шум, вибрации и други вредни физични фактори"
    summary: "Нива на въздействие върху хората край строежа и начини за ограничаване."
  - title: "Управление на строителните отпадъци"
    summary: "Предотвратяване, разделно събиране, рециклиране и оползотворяване."
  - title: "Екологични оценки и разрешителни процедури"
    summary: "Кога един проект подлежи на екологична оценка и как тя влиза в инвестиционния процес."
  - title: "Системи за управление на околната среда във фирмата"
    summary: "Екологична политика, цели, наблюдение и непрекъснато подобряване."
  - title: "Устойчиво строителство и зелени сгради"
    summary: "Жизнен цикъл, ефективно използване на ресурсите и сертифициране на сгради."
