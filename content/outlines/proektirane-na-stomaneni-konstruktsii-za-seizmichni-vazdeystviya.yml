title: "Проектиране на стоманени конструкции за сеизмични въздействия"
slug: "proektirane-na-stomaneni-konstruktsii-za-seizmichni-vazdeystviya"
summary: "Капацитивно проектиране и дуктилност на стоманените конструкции; рамки на огъване и рамки с диагонали по Еврокод 8."
why: "Нужна е при всяка стоманена сграда в България – изборът на сеизмична система определя профилите и възлите."
related: ["Метални конструкции", "Стоманени конструкции", "Специални стоманени конструкции", "Проектиране на стоманобетонни конструкции за сеизмични въздействия"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/att_29252.pdf"
  note: "Конспект и изисквания на УАСГ за ССС, VIII семестър (16 основни и 5 допълнителни въпроса, приет от катедра „Метални, дървени и пластмасови конструкции“ през февруари 2025 г.). Главите групират въпросите от конспекта."
chapters:
  - title: "Сеизмично въздействие и изисквания към конструкциите"
    summary: "Същност на земетресението, сеизмична опасност в България, гранични състояния, коефициент на поведение."
  - title: "Принципи и капацитивно проектиране"
    summary: "Основни изисквания на БДС EN 1998-1, дисипативни зони и недисипативни елементи."
  - title: "Конструктивни системи и класове на дуктилност"
    summary: "Системи за поемане на сеизмичните въздействия, класове по дуктилност, референтни коефициенти на поведение."
  - title: "Дуктилност на материала и на елементите"
    summary: "Изисквания към стоманите, локална дуктилност на греди, клас на сеченията в дисипативните елементи."
  - title: "Рамкови възли при циклично натоварване"
    summary: "Конструктивно оформяне на възлите, баланс между носимоспособност, коравина и дуктилност."
  - title: "Рамки, работещи на огъване"
    summary: "Сеизмично реагиране, принцип „силни колони – слаби ригели“, правила за ригели, колони и възли."
  - title: "Рамки с центрично включени диагонали"
    summary: "Основни типове, сеизмично поведение, правила за диагонали, ригели и колони."
  - title: "Рамки с нецентрично включени диагонали"
    summary: "Конфигурации, сеизмични свързващи елементи, проектиране на недисипативните компоненти."
  - title: "Съвременни системи за сеизмична защита"
    summary: "Диагонали с възпрепятствано изкълчване, стоманени шайби, демпферни системи и сеизмична изолация."
