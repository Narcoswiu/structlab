title: "Производствени бази в строителството"
slug: "proizvodstveni-bazi-v-stroitelstvoto"
summary: "Как в завода и в базата на строителната фирма се произвеждат бетонни смеси, армировка и готови стоманобетонни елементи."
why: "Инженерът поръчва бетон, армировъчни заготовки и сглобяеми елементи и трябва да знае как се правят и как се контролира качеството им."
related: []
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивна анотация на ВСУ за избираемата дисциплина „Производствена база на строителните фирми“ (код ССС-44.4, учебен план от 2014 г., 15 ч. лекции + 15 ч. упражнения, текуща оценка). Името в днешния план е различно – прието е, че е същата дисциплина, но това не е потвърдено. Главите следват темите в анотацията. Актуална програма на ВСУ не е публикувана."
chapters:
  - title: "Технология на производството на бетонни смеси"
    summary: "Технологична характеристика, структура и схема на процеса."
  - title: "Бетоносмесително отделение и складове"
    summary: "Устройство и действие на бетоносмесителното отделение и на складовете за добавъчни материали и цимент."
  - title: "Заготовка на армировъчна стомана"
    summary: "Изправяне, отмерване, рязане и огъване на кангална и прътова стомана; видове армировъчни изделия."
  - title: "Заваряване на армировка и производство на мрежи"
    summary: "Контактно точково и челно електросъпротивително заваряване, заварени мрежи."
  - title: "Технологични схеми за производство на елементи"
    summary: "Основни схеми на производствения процес за бетонни и стоманобетонни елементи и изделия."
  - title: "Кофражни форми и смазки"
    summary: "Видове и устройство на формите и подготовката им преди формуване."
  - title: "Формуване и уплътняване на бетонната смес"
    summary: "Основни и комбинирани методи за уплътняване при заводско производство."
  - title: "Контрол на качеството"
    summary: "Какво се проверява при материалите, процеса и готовите изделия."
