title: "Енергийна ефективност"
slug: "energiyna-efektivnost"
summary: "Как сградата губи и печели енергия, как се оценяват енергийните ѝ характеристики и с какви мерки се намалява потреблението."
why: "Всяка нова или обновявана сграда трябва да покрие изисквания за енергийна ефективност, а мерките се планират, остойностяват и изпълняват от строителите."
related: []
source:
  status: "unverified"
  url: ""
  note: "Официална учебна програма или анотация не е намерена: в информационния пакет на УАСГ за специалност „Управление в строителството“ (https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf) и в списъка с дисциплини на специалността в old.uacg.bg тази дисциплина липсва. Главите следват обичайното съдържание на дисциплината в строителните специалности – да се сверят с програмата на катедрата."
chapters:
  - title: "Енергийно потребление на сградите и изисквания"
    summary: "Къде се изразходва енергията в сградата и какви нормативни изисквания се поставят."
  - title: "Топлопренасяне през ограждащите елементи"
    summary: "Топлопроводност, конвекция и лъчение; топлинно съпротивление на многослойни елементи."
  - title: "Коефициент на топлопреминаване и топлинни мостове"
    summary: "Изчисляване на коефициента на топлопреминаване и отчитане на линейни и точкови топлинни мостове."
  - title: "Влажностен режим на ограждащите елементи"
    summary: "Дифузия на водни пари, кондензация по повърхността и в конструкцията."
  - title: "Топлоизолационни материали и системи"
    summary: "Свойства на материалите и системи за топлоизолиране на стени, покриви и подове."
  - title: "Прозорци, остъкляване и слънцезащита"
    summary: "Топлинни характеристики на дограмата, слънчеви топлинни притоци и защита от прегряване."
  - title: "Въздухопропускливост и вентилация"
    summary: "Инфилтрация, въздухоплътност на обвивката и вентилация с оползотворяване на топлината."
  - title: "Ефективност на сградните системи"
    summary: "Отопление, охлаждане, топла вода и осветление – източници на загуби и начини за намаляването им."
  - title: "Възобновяеми източници в сградите"
    summary: "Слънчеви топлинни и фотоволтаични системи, термопомпи и оползотворяване на биомаса."
  - title: "Енергиен баланс и енергийни характеристики"
    summary: "Топлинни загуби и притоци, годишен разход на енергия и клас на енергопотребление."
  - title: "Обследване и сертифициране на сгради"
    summary: "Обследване за енергийна ефективност, енергиен сертификат и технически паспорт."
  - title: "Енергоспестяващи мерки и оценката им"
    summary: "Избор на мерки при ново строителство и обновяване, срок на откупуване, сгради с близко до нулево потребление."
