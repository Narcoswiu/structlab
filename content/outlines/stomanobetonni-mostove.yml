title: "Стоманобетонни мостове"
slug: "stomanobetonni-mostove"
summary: "Проектиране на гредови пътни мостове от обикновен и предварително напрегнат стоманобетон: въздействия, връхна конструкция, опори."
why: "Пътните надлези и гредовите мостове са най-масовите мостови съоръжения у нас – проектират се и се обследват точно така."
related: ["Мостове", "Стоманени и комбинирани мостове", "Стоманобетон"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/att_29655.pdf"
  note: "Изпитен конспект на УАСГ (18 въпроса) за англоезичното обучение по ССС, приложен към страницата на дисциплината в катедра „Масивни конструкции“; българската анотация за ССС потвърждава обхвата – главно пътни гредови мостове. Български конспект не е намерен. За ВСУ отделна програма не е намерена (вж. „Мостове“)."
chapters:
  - title: "Основни понятия и класификация на мостовете"
    summary: "Определения, видове мостове, елементи на моста и техните функции, изходни данни за проектиране."
  - title: "Въздействия върху мостове"
    summary: "Постоянни и променливи въздействия, товарни модели от движение по БДС EN 1991-2."
  - title: "Пътно платно и мостово обзавеждане"
    summary: "Настилка, тротоари, хидроизолация, отводняване, предпазни огради, дилатационни фуги, преходни конструкции."
  - title: "Системи за връхната конструкция"
    summary: "Подходящи статически схеми и напречни сечения за гредови стоманобетонни мостове."
  - title: "Плочи и статическо изследване"
    summary: "Пътна плоча, напречно разпределение на товарите, статическо изследване на връхната конструкция."
  - title: "Кутиени връхни конструкции"
    summary: "Особености в поведението, изследването и конструирането на мостове с кутиено сечение."
  - title: "Проверки и конструиране без предварително напрягане"
    summary: "Оразмерителни проверки и армиране на мостови елементи от обикновен стоманобетон."
  - title: "Предварително напрегнати мостове"
    summary: "Предварително напрегнати греди, двуетапно изпълнение, съвременни системи за изграждане."
  - title: "Лагери и долно строене"
    summary: "Проверки на еластомерни лагери; устои, стълбове и фундаменти."
  - title: "Сеизмично проектиране и разширен анализ"
    summary: "Сеизмично осигуряване на стоманобетонни мостове, предпоставки при по-сложни изчислителни модели."
