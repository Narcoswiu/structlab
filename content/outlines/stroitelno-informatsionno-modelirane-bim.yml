title: "Строително информационно моделиране (BIM)"
slug: "stroitelno-informatsionno-modelirane-bim"
summary: "Принципи, сфери на приложение, стандарти и видове програмни платформи за строително информационно моделиране (СИМ)."
why: "Все повече строителни проекти се управляват през общ информационен модел на сградата."
related: []
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS/PMC/BIMbCBC1MS6.pdf"
  note: "Анотация от ECTS пакета на УАСГ за дисциплина със същото име, катедра „Автоматизация на инженерния труд“, но от магистърската програма „Управление на проекти в строителството“ (30/30 ч.). Отделна анотация за бакалавърската специалност „Управление в строителството“ не е намерена. Текстът е кратък, без номерирани теми; главите разгръщат изброеното в него."
chapters:
  - title: "Същност на строително информационното моделиране"
    summary: "Модел, информация и процес; разлика спрямо традиционното чертане."
  - title: "Сфери на приложение през жизнения цикъл"
    summary: "Проектиране, строителство, експлоатация и поддръжка на сградата."
  - title: "Информационният модел"
    summary: "Обекти, параметри и нива на детайлност и на информация."
  - title: "Време и стойност в модела"
    summary: "Свързване на модела с графика на строителството и с количествата и цените."
  - title: "Съвместна работа на участниците"
    summary: "Роли, отговорности, обща среда за данни и план за изпълнение."
  - title: "Международни стандарти"
    summary: "Стандарти за управление на информацията и отворени формати за обмен на модели."
  - title: "Координация на моделите"
    summary: "Обединяване на модели по части и откриване на колизии."
  - title: "Количества и документация от модела"
    summary: "Количествени сметки, спецификации и чертежи, извлечени от модела."
  - title: "Предимства, недостатъци и внедряване"
    summary: "Ползи, ограничения и типични пречки пред прилагането на технологията."
  - title: "Програмни продукти и платформи"
    summary: "Видове комерсиални и свободни инструменти за моделиране, преглед и координация."
