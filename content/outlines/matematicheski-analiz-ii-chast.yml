title: "Математически анализ – II част"
slug: "matematicheski-analiz-ii-chast"
summary: "Функции на няколко променливи, обикновени диференциални уравнения, криви и повърхнини, кратни и криволинейни интеграли."
why: "С двойни и тройни интеграли се намират инерционни моменти и центрове на тежестта, а диференциалните уравнения описват еластичната линия и трептенията."
related: ["Математически анализ", "Математически анализ – I част", "Диференциални уравнения и математическа статистика"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/att_29774.pdf"
  note: "Учебна програма на УАСГ „Математически анализ 2“ за специалност ССС (II семестър, 45 ч. лекции + 45 ч. упражнения) – 22 лекционни теми и конспект; проект към учебен план от 2025 г. без номер на протокол и подписи. За ВСУ има само архивна анотация по план от 2014 г. (https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153). Обхватът се различава: в УАСГ втората част започва с диференциални уравнения, а функциите на няколко променливи са в първата част; във ВСУ е обратното – функциите на няколко променливи са тук, а диференциалните уравнения са отделна дисциплина. Кривите, повърхнините и интегралите са общи. Очертанието обединява двете програми."
chapters:
  - title: "Функции на няколко променливи и екстремуми"
    summary: "Частни производни, локални и условни екстремуми, метод на най-малките квадрати (ВСУ; в УАСГ е в I част)."
  - title: "Диференциални уравнения от първи ред"
    summary: "Разделящи се променливи, хомогенни, линейни, на Бернули и точни уравнения; задача на Коши (УАСГ)."
  - title: "Уравнения от по-висок ред и понижаване на реда"
    summary: "Основни понятия за уравнения от по-висок ред и случаите, в които редът се понижава (УАСГ)."
  - title: "Линейни диференциални уравнения с постоянни коефициенти"
    summary: "Хомогенни и нехомогенни уравнения, специална дясна част, метод на Лагранж, уравнение на Ойлер (УАСГ)."
  - title: "Системи диференциални уравнения"
    summary: "Линейни системи от първи ред с постоянни коефициенти – метод на изключването и метод на Ойлер (УАСГ)."
  - title: "Криви в пространството"
    summary: "Векторна функция на скаларен аргумент, естествен параметър, кривина, торзия и триедър на Френе."
  - title: "Повърхнини в пространството"
    summary: "Параметрично задаване на повърхнина, допирателна равнина и нормала."
  - title: "Двойни и тройни интеграли"
    summary: "Дефиниция и пресмятане на кратни интеграли чрез повторно интегриране."
  - title: "Смяна на променливите и приложения на кратните интеграли"
    summary: "Полярни, цилиндрични и сферични координати; лице, обем, маса, център на тежестта, инерционни моменти."
  - title: "Несобствени интеграли"
    summary: "Прости и кратни несобствени интеграли и тяхната сходимост (УАСГ; във ВСУ са в първата част)."
  - title: "Криволинейни интеграли"
    summary: "Интеграли от първи и втори тип по крива, работа във векторно поле, формула на Грийн."
  - title: "Повърхнинни интеграли"
    summary: "Интеграли по повърхнина от първи и втори тип и връзката им с кратните интеграли."
