title: "Обследване и изпитване на строителни конструкции"
slug: "obsledvane-i-izpitvane-na-stroitelni-konstruktsii"
summary: "Натурно обследване, безразрушителен контрол, статични и динамични изпитвания и оценка на годността на конструкциите."
why: "Нужна е при оценка на съществуващи сгради и мостове преди реконструкция, усилване или след земетръс и пожар."
related: ["Обследване, диагностика и изпитване на строителните конструкции", "Зидани конструкции", "Стоманобетон", "Стоманени конструкции", "Метални конструкции"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/att_25687.pdf"
  note: "Конспект на УАСГ за ССС (32 въпроса, февруари 2024 г.), приложен към страницата на дисциплината в катедра „Масивни конструкции“. Главите групират въпросите от конспекта."
chapters:
  - title: "Предмет, цели и етапи на обследването"
    summary: "Задачи на обследването и изпитването, проучване на техническата документация, етапи на изпълнение."
  - title: "Измерителна техника"
    summary: "Уреди за премествания, завъртания и деформации, регистриращи системи, преси и силомери, сверяване на уредите."
  - title: "Статични изпитвания: планиране"
    summary: "Изпитвателни схеми и натоварвания, разпределение на товара, брой и места на уредите."
  - title: "Статични изпитвания: провеждане и оценка"
    summary: "Степени на натоварване, влияние на температура и влажност, грешки, коравини, провисвания и усилия."
  - title: "Динамични изпитвания"
    summary: "Видове динамични натоварвания, виброграми, опитно определяне на динамичните характеристики, оценка."
  - title: "Трептения и въздействието им"
    summary: "Влияние на трептенията върху хората и производствените процеси, предпазване от вредни трептения."
  - title: "Безразрушителен контрол на бетона"
    summary: "Склерометрични и физични методи, методи с местно повреждане, диагностика на конструкциите."
  - title: "Моделни и специални методи"
    summary: "Поляризационно-оптично и физико-механично моделиране, крехки лакови покрития, остатъчни напрежения."
  - title: "Обследване при сеизмична оценка и след пожар"
    summary: "Обследване за оценка и усилване на сгради по БДС EN 1998-3; конструкции, претърпели пожар."
  - title: "Повреди, дефекти и експлоатационна надеждност"
    summary: "Влияние на повредите върху състоянието на конструкцията, методи за контрол, обобщени изводи."
