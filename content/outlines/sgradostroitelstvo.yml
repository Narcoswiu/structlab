title: "Сградостроителство"
slug: "sgradostroitelstvo"
summary: "Елементите на сградата – носеща конструкция, подове, стълби, покриви, стени и дограма – и принципните им конструктивни решения."
why: "Без тези знания инженерът не може да съгласува носещата конструкция с архитектурата, нито да разработи детайлите на подове, покриви и фасади."
related: ["Сградостроителство и архитектура", "Архитектура"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&id=174&m=3"
  note: "Официална страница на дисциплината за специалност ССС в УАСГ (катедра „Технология на архитектурата“) с анотация и приложена учебна програма на лекционния курс за IV семестър (https://old.uacg.bg/filebank/att_6243.pdf, 10 основни и 2 допълнителни теми). Главите следват програмата. Същата анотация стои и в информационния пакет на специалност „Управление в строителството“ (https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf), където дисциплината е в III семестър; отделна програма за тази специалност не е намерена."
chapters:
  - title: "Сградата и нейните елементи"
    summary: "Етажни и зални сгради, елементи на сградата и функциите им, видове носещи конструкции."
  - title: "Сгради с безскелетна носеща конструкция"
    summary: "Зидани и лети монолитни стени, сглобяеми стени, комбинирани изпълнения, влияние върху архитектурната форма."
  - title: "Сгради със скелетна носеща конструкция"
    summary: "Елементи на скелета; монолитен и сглобяем стоманобетонен скелет, стоманен скелет."
  - title: "Подови конструкции"
    summary: "Функции и изисквания; монолитни, сглобяемо-монолитни и сглобяеми стоманобетонни подове, стоманени подови конструкции."
  - title: "Подови настилки"
    summary: "Структура и елементи, обикновени и плаващи настилки, видове според лицевия слой, двойни подове."
  - title: "Стълби"
    summary: "Основни видове и оразмеряване, конструиране и детайли на стоманобетонни и стоманени стълби."
  - title: "Скатни покриви"
    summary: "Покривни форми, дървени покривни конструкции, покривки и отводняване на скатни покриви."
  - title: "Плоски покриви"
    summary: "Елементи и конструктивни решения, детайли при завършеци, водоприемник и деформационна фуга."
  - title: "Вътрешни преградни стени"
    summary: "Стационарни, демонтажни и мобилни стени; изпълнения от панели и чрез послоен монтаж."
  - title: "Фасадни неносещи стени"
    summary: "Строително-физически характеристики, зидани и лети стени, сандвич-панели, леки окачени стени."
  - title: "Врати, прозорци и витрини"
    summary: "Изисквания, устройство и елементи; конструктивни решения от дърво, метал и пластмаса."
  - title: "Фасадни облицовки и окачени тавани"
    summary: "Видове облицовки по материал и конструкция, елементи и решения на окачените тавани."
