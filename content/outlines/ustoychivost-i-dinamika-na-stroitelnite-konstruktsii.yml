title: "Устойчивост и динамика на строителните конструкции"
slug: "ustoychivost-i-dinamika-na-stroitelnite-konstruktsii"
summary: "Критични товари и ефективни дължини на пръти и рамки; трептения на системи с една и повече степени на свобода, спектрален метод."
why: "По тези методи се проверяват стройни натиснати елементи и се определят сеизмичните сили върху конструкцията."
related: ["Устойчивост на строителните конструкции", "Строителна динамика и сеизмичен анализ"]
source:
  status: "unverified"
  url: ""
  note: "Актуална програма на ВСУ с това име не е намерена. Темите следват частите „устойчивост“ и „динамика“ от архивната анотация на ВСУ по план 2014 за ССС-26 „Теория на еластичността, устойчивост и динамика на строителните конструкции“ – https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153. Не е потвърдено, че сегашният курс има същия обхват."
chapters:
  - title: "Предмет и задачи на устойчивостта"
    summary: "Видове равновесие, загуба на устойчивост и критичен параметър на натоварването."
  - title: "Натиснат прът по теория от II ред"
    summary: "Диференциално уравнение на прав прът при осов и напречен товар и неговото интегриране."
  - title: "Формули на Ойлер и ефективни дължини"
    summary: "Критична сила при различни опорни условия; изкълчвателни дължини на натиснати пръти."
  - title: "Натиснато-огънати пръти и коректурни функции"
    summary: "Премествания, възлови реакции и моменти в осово натоварени пръти при опорни премествания."
  - title: "Деформационен метод в задачите за устойчивост"
    summary: "Критичен параметър и ефективни дължини на прътите в осово натоварени равнинни рамки."
  - title: "Рамки при осов и напречен товар по теория от II ред"
    summary: "Идея на изчислението по деформирана схема и нарастване на усилията."
  - title: "Предмет и задачи на динамиката"
    summary: "Динамични товари, маси, степени на свобода и изчислителни модели."
  - title: "Системи с една степен на свобода"
    summary: "Свободни и принудени трептения без затихване: период, честота, динамичен коефициент."
  - title: "Свободни трептения на системи с повече степени на свобода"
    summary: "Матрици на податливост и на коравина, собствени честоти и форми, ортогоналност."
  - title: "Принудени трептения на системи с повече степени на свобода"
    summary: "Амплитуди на инерционните сили и динамични диаграми на разрезните усилия."
  - title: "Спектрален метод и модален анализ при земетръс"
    summary: "Сеизмични сили по форми на трептене съгласно нормите и комбиниране на приносите."
