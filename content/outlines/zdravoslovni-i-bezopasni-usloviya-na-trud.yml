title: "Здравословни и безопасни условия на труд"
slug: "zdravoslovni-i-bezopasni-usloviya-na-trud"
summary: "Задължения, оценка на риска, предпазни средства и правила за безопасна работа при строителни и монтажни работи."
why: "Техническият ръководител носи лична отговорност за безопасността на хората на обекта – инструктажи, предпазни мерки и безопасни работни места."
related: ["ЗБУТ в строителството", "План за безопасност и здраве и управление на строителните отпадъци"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивна анотация на ВСУ (код ССС-31, учебен план от 2014 г., VI семестър, 15 ч. лекции + 15 ч. упражнения, текуща оценка). Главите следват темите в анотацията. Актуална учебна програма на ВСУ не е публикувана."
chapters:
  - title: "Законодателни изисквания за ЗБУТ"
    summary: "Европейски и национални изисквания за здравословни и безопасни условия на труд."
  - title: "Задължения на работодателя и на работещите"
    summary: "Комитети и групи по условия на труд, функции на длъжностните лица по безопасност и здраве."
  - title: "Минимални изисквания при строителни и монтажни работи"
    summary: "Изисквания към строителната площадка и работните места; инструкции за безопасна работа."
  - title: "Лични предпазни средства"
    summary: "Избор и използване на личните предпазни средства на работното място."
  - title: "Електробезопасност"
    summary: "Мероприятия и средства за защита от поражение от електрически ток."
  - title: "Знаци и сигнали за безопасност"
    summary: "Видове знаци и сигнали и къде се поставят на обекта."
  - title: "Обучение и инструктаж"
    summary: "Видове инструктажи и обучение на работниците по правилата за безопасност."
  - title: "Трудови злополуки и оценка на риска"
    summary: "Какво е трудова злополука и как се оценява рискът в строителството."
  - title: "Безопасност при подемно-транспортни машини и работа на височина"
    summary: "Опасности и предпазни мерки при кранове, подемници, скелета и работа на височина."
  - title: "Безопасност при основните видове строителни работи"
    summary: "Мерки при земни, кофражни, бетонови и монтажни работи, при ремонт, надстрояване и разрушаване."
