title: "Архитектура"
slug: "arhitektura"
summary: "Основни принципи и норми на архитектурното проектиране, типология на жилищни, обществени и промишлени сгради и преглед на историята на архитектурата."
why: "Строителният инженер работи заедно с архитект по всеки проект и трябва да разбира функционалните изисквания, които определят конструкцията."
related: ["Сградостроителство и архитектура", "Сградостроителство"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&id=199&m=3"
  note: "Официална страница на дисциплината за специалност ССС в УАСГ (катедра „Индустриални сгради“) с анотация и приложен конспект на лекционния курс за втори поток (https://old.uacg.bg/filebank/att_25624.pdf, 30 теми за 15 седмици). Главите следват конспекта, като близките теми са обединени. Същата анотация стои и в информационния пакет на специалност „Управление в строителството“ (https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf, II семестър); отделен конспект за тази специалност не е намерен."
chapters:
  - title: "Архитектурата и околната среда"
    summary: "Предмет на архитектурата и мястото ѝ в преобразяването на околната среда."
  - title: "Методика на архитектурното проектиране"
    summary: "Етапи и подходи на архитектурното проектиране, връзка между проекта и строителната практика."
  - title: "Териториално и селищно устройство и градоустройство"
    summary: "Основни понятия за устройството на територията и на населените места."
  - title: "Жилищни сгради"
    summary: "Жилищни сгради за постоянно и за временно обитаване – видове и функционални изисквания."
  - title: "Обществени сгради – общи характеристики"
    summary: "Класификация и общи функционални и пространствени изисквания към обществените сгради."
  - title: "Сгради за образованието и библиотеки"
    summary: "Функционална структура на учебните сгради и на библиотеките."
  - title: "Сгради за здравеопазването"
    summary: "Видове здравни сгради и основни изисквания към тяхното устройство."
  - title: "Сгради за културата, изкуството и спорта"
    summary: "Зали и съоръжения за култура, изкуство и спорт – особености на пространството."
  - title: "Административни и търговски сгради"
    summary: "Административни сгради и сгради за търговията и услугите."
  - title: "Сгради за транспорта и промишлени сгради"
    summary: "Приемни сгради на транспорта и видове промишлени сгради."
  - title: "История на архитектурата: древност и античност"
    summary: "Архитектура на древните цивилизации, на древна Гърция и на древен Рим."
  - title: "История на архитектурата: от Средновековието до модернизма"
    summary: "Византийска, романска и готическа архитектура, Ренесанс, барок, класицизъм и модернизъм."
