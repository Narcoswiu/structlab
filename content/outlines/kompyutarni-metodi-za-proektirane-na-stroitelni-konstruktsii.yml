chapters:
  - title: "Числени методи в основата на програмите"
    summary: "Метод на крайните елементи и матричен анализ като основа на програмните системи."
  - title: "Пространствен модел на сграда"
    summary: "Плочи, стени, колони и греди в общ модел; избор на елементи и мрежа."
  - title: "Връзки, ексцентрицитети и диафрагми"
    summary: "Корави зони, стави, корава подова диафрагма и влиянието им върху резултатите."
  - title: "Въздействия и комбинации по Еврокод"
    summary: "Постоянни, експлоатационни, климатични и сеизмични въздействия; изчислителни комбинации."
  - title: "Модален и спектрален анализ"
    summary: "Маси, собствени форми, проектен спектър и комбиниране на модалните приноси."
  - title: "Ефекти от II ред и устойчивост"
    summary: "Отчитане на деформираната схема и определяне на критичен параметър в модела."
  - title: "Взаимодействие на конструкцията с основата"
    summary: "Еластична основа под фундаменти и плочи; чувствителност към коравината на почвата."
  - title: "Оразмеряване на стоманобетонни елементи"
    summary: "Армировка на плочи, греди, колони и стени по усилията от модела; проверка на резултата."
  - title: "Оразмеряване на стоманени елементи"
    summary: "Проверки на сечения и на устойчивост на елементи по усилията от модела."
  - title: "Проверка и документиране на модела"
    summary: "Независими контролни изчисления и оформяне на записка с входни данни и резултати."
