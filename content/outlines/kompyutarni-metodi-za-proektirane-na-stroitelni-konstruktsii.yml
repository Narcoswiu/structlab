title: "Компютърни методи за проектиране на строителни конструкции"
slug: "kompyutarni-metodi-za-proektirane-na-stroitelni-konstruktsii"
summary: "Пространствено моделиране, сеизмичен анализ и оразмеряване на стоманобетонни и стоманени конструкции с програмни системи."
why: "Конструкторът изготвя с тези методи цялостния изчислителен модел и оразмеряването на реална сграда."
related: ["Компютърни системи в строителната механика", "Автоматизация на конструктивното проектиране"]
