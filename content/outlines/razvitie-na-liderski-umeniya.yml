title: "Развитие на лидерски умения"
slug: "razvitie-na-liderski-umeniya"
summary: "Как ръководителят влияе на хората – стилове на лидерство, мотивиране, делегиране, вземане на решения и водене на екип."
why: "Ръководителят на обект или проект постига резултатите чрез другите – чрез бригадири, подизпълнители и колеги, които трябва да го последват."
related: ["Междуличностна комуникация", "Управление на човешките ресурси на проекти"]
source:
  status: "unverified"
  url: ""
  note: "Официалната страница в УАСГ (old.uacg.bg, ?p=210&l=1&id=2239&m=40; там името е изписано „Развитие на лидерски умение“) съдържа само катедра и преподавател – без анотация. В ECTS пакета на специалността (US_A.pdf) дисциплината липсва. Главите са по стандартното съдържание на дисциплината и не са сверени с учебна програма – да се проверят с катедрата."
chapters:
  - title: "Лидерство и управление"
    summary: "Разлика между лидер и ръководител; формална и неформална власт."
  - title: "Подходи и стилове на лидерство"
    summary: "Личностен, поведенчески и ситуационен подход; избор на стил според хората и задачата."
  - title: "Самопознание и емоционална интелигентност"
    summary: "Силни и слаби страни, самоконтрол, разбиране на чуждите емоции."
  - title: "Общуване и влияние"
    summary: "Активно слушане, убеждаване и даване на обратна връзка."
  - title: "Мотивиране на хората"
    summary: "Какво движи хората в работата и как лидерът го използва."
  - title: "Делегиране и развитие на сътрудниците"
    summary: "Какво и на кого се възлага; наставничество и развитие на хората."
  - title: "Вземане на решения и поемане на отговорност"
    summary: "Индивидуални и групови решения, решения под натиск."
  - title: "Изграждане и водене на екип"
    summary: "Роли в екипа, доверие, общи цели и правила."
  - title: "Конфликти и преговори"
    summary: "Стилове на поведение при конфликт и водене на преговори."
  - title: "Лидерство при промяна"
    summary: "Водене на хората през промени и кризисни ситуации на проекта."
  - title: "Етика и отговорност на лидера"
    summary: "Личен пример, почтеност и отговорност към хората и обществото."
