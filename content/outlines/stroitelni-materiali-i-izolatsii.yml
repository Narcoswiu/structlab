title: "Строителни материали и изолации"
slug: "stroitelni-materiali-i-izolatsii"
summary: "Свойства и приложение на строителните материали и основите на хидро-, топло- и звукоизолациите на сгради."
why: "Инженерът избира и контролира материалите за конструкцията и решава как строежът да се пази от вода, студ, шум и огън."
related: ["Строителни материали", "Строителни изолации"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивни анотации на ВСУ по учебен план от 2014 г., където предметът е в две отделни дисциплини: ССС-16 „Строителни материали“ и ССС-20 „Строителни изолации“. Главите обединяват темите от двете анотации. Програма за обединената дисциплина по текущия план не е намерена."
chapters:
  - title: "Строително материалознание: структура и свойства"
    summary: "Класификации; връзка състав – структура – свойства; физични, механични и термични свойства; влажност."
  - title: "Естествени скални материали, керамика и стъкло"
    summary: "Неметални материали: скални материали, строителна керамика, стъкло – свойства и приложение."
  - title: "Въздушни свързващи вещества"
    summary: "Строителен гипс, строителна вар, магнезиални свързващи вещества и водоразтворимо стъкло."
  - title: "Цименти"
    summary: "Портландциментов клинкер, минерален състав, циментов камък, видове и специални цименти."
  - title: "Бетон: съставки, бетонна смес и втвърден бетон"
    summary: "Добавъчни материали и добавки, свойства на сместа, якостни и деформационни свойства на бетона."
  - title: "Проектиране на състава на бетона и видове бетони"
    summary: "Фактори, влияещи върху свойствата, определяне на състава, технология на бетонните работи."
  - title: "Метали и сплави"
    summary: "Строителни стомани и алуминиеви сплави, диаграма напрежение – деформация, означения и обработка."
  - title: "Органични свързващи вещества и дървесина"
    summary: "Полимери, еластомери и битуми; дървесина – структура, свойства и приложение."
  - title: "Хидроизолации на строежи"
    summary: "Скатни и плоски покриви, фасади и подземни части; покривни материали, обшивки и детайли."
  - title: "Топлоизолации и влажностен режим"
    summary: "Енергийна ефективност, топлофизични свойства, топлотехническо оразмеряване и кондензна влага."
  - title: "Огнезащита и корозионна защита"
    summary: "Поведение при огън и огнезащитни покрития; агресивни среди и защита на стомана и стоманобетон."
  - title: "Звуко- и виброизолация на сгради"
    summary: "Звукоизолационни, звукопоглъщащи и виброизолиращи материали и решения."
