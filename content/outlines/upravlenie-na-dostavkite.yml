title: "Управление на доставките"
slug: "upravlenie-na-dostavkite"
summary: "Как се планират, възлагат и контролират доставките на материали, оборудване и услуги и работата на подизпълнителите в строителен проект."
why: "Материалите и подизпълнителите са най-голямата част от цената на строежа – закъсняла или грешна доставка спира работата на целия обект."
related: ["Договори в строителството. ФИДИК", "Управление на риска"]
source:
  status: "unverified"
  url: ""
  note: "Официалната страница на дисциплината в УАСГ (old.uacg.bg, специалност „Управление в строителството“, катедра „Организация и икономика на строителството“) съществува, но съдържа само катедра и преподавател – без анотация и без програма. В ECTS пакета с анотации на специалността (US_A.pdf) дисциплината липсва. Главите са по стандартното съдържание на дисциплината и не са сверени с учебна програма – да се проверят с катедрата."
chapters:
  - title: "Доставките в проекта и в строителната фирма"
    summary: "Място на доставките в управлението на проекта; материали, оборудване, услуги, подизпълнители."
  - title: "Планиране на доставките"
    summary: "Какво се изработва със собствени сили и какво се купува; график на доставките."
  - title: "Технически спецификации и количествени сметки"
    summary: "Описване на изискванията към продуктите и услугите като основа за запитване."
  - title: "Избор на доставчици и подизпълнители"
    summary: "Запитване, оферти, критерии за оценка и сравняване на предложенията."
  - title: "Обществени поръчки"
    summary: "Основни принципи и видове процедури при възлагане с публични средства."
  - title: "Видове договори за доставка и подизпълнение"
    summary: "Начини за определяне на цената и разпределение на отговорностите между страните."
  - title: "Логистика на строителната площадка"
    summary: "Транспорт, доставка „точно навреме“, разтоварване и вътрешно преместване."
  - title: "Запаси и складово стопанство"
    summary: "Нормиране на запасите, съхранение и отчитане на материалите."
  - title: "Контрол на изпълнението на договорите"
    summary: "Входящ контрол, приемане, изменения, плащания и рекламации."
  - title: "Приключване на доставките и оценка на доставчиците"
    summary: "Закриване на договорите, гаранции и оценка на доставчиците за следващи проекти."
