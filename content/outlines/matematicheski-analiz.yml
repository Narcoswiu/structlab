title: "Математически анализ"
slug: "matematicheski-analiz"
summary: "Граници, производни и интеграли на функция на една променлива, изследване на функции и безкрайни редове."
why: "Производните и интегралите са езикът на механиката – с тях се намират разрезни усилия, провисвания, лица, обеми и центрове на тежестта."
related: ["Математически анализ – I част", "Математически анализ – II част"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивно копие на официалния сайт на ВСУ: анотация на дисциплината „Математически анализ – I част“ (ССС-2) по учебен план на специалност ССС от 2014 г., I курс, I семестър. Анотацията изброява темите накратко; главите следват техния ред. Актуална програма на ВСУ не е публикувана и анотацията може да е остаряла. В днешните разписания на ВСУ дисциплината в зимния семестър се казва само „Математически анализ“ – приема се, че е същата първа част."
chapters:
  - title: "Числови редици и граница на функция"
    summary: "Сходимост на редици, граница на функция и основни техники за пресмятане на граници."
  - title: "Непрекъснатост на функция"
    summary: "Непрекъснати функции, точки на прекъсване и свойства на непрекъснатите функции в интервал."
  - title: "Производна и диференциал"
    summary: "Дефиниция и геометричен смисъл на производната, правила за диференциране, производни от по-висок ред."
  - title: "Основни теореми на диференциалното смятане"
    summary: "Теореми за средните стойности, правило на Лопитал и формула на Тейлор."
  - title: "Изследване на функции и екстремуми"
    summary: "Монотонност, локални екстремуми, изпъкналост, асимптоти и построяване на графика."
  - title: "Неопределен интеграл и методи за интегриране"
    summary: "Примитивна функция, смяна на променливата, интегриране по части и на рационални функции."
  - title: "Определен интеграл"
    summary: "Дефиниция, свойства, формула на Нютон–Лайбниц и пресмятане на определени интеграли."
  - title: "Несобствени интеграли"
    summary: "Интеграли в безкрайни граници и от неограничени функции, сходимост."
  - title: "Приложения на определения интеграл"
    summary: "Лице, дължина на дъга, обем на ротационно тяло, статични моменти и център на тежестта."
  - title: "Безкрайни числови редове"
    summary: "Сходимост на ред, критерии за редове с положителни членове, алтернативни редове."
  - title: "Степенни редове"
    summary: "Радиус на сходимост и развитие на функция в степенен ред."
