title: "Правна и нормативна уредба в строителството"
slug: "pravna-i-normativna-uredba-v-stroitelstvoto"
summary: "Правната рамка на строителството – инвестиционен процес, вещи и собственост, устройствени планове, обществени поръчки, договори и околна среда."
why: "Нито един строеж не започва без устройствен план, разрешение и договор – инженерът трябва да знае какво изисква законът на всяка стъпка."
related: ["Нормативна база в строителството", "Правни въпроси в строителството", "Договори в строителството. ФИДИК"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&id=2185&m=3"
  note: "Официална страница на дисциплината за специалност ССС в УАСГ (катедра „Организация и икономика на строителството“) с анотация: шест основни направления – същност на инвестиционния процес; правен режим на движими и недвижими вещи; устройствени планове; обществени поръчки; договори в строителството; правни аспекти на опазване на околната среда. Същата дисциплина има анотация и в ECTS пакета на ССС (https://old.uacg.bg/filebank/ECTS-NOW/STR/SSS_A.pdf). Подробна програма по теми не е намерена; първата глава и разбивката на направленията са наши. Законите са посочени само по име – конкретните разпоредби да се следят в действащата им редакция."
chapters:
  - title: "Основни правни понятия и нормативни актове"
    summary: "Правна норма, източници на правото, закони и подзаконови актове в строителството."
  - title: "Същност на инвестиционния процес"
    summary: "Етапи, участници и техните права и задължения според Закона за устройство на територията."
  - title: "Правен режим на движими и недвижими вещи"
    summary: "Видове вещи, поземлен имот, сграда, кадастър и имотен регистър."
  - title: "Право на собственост и ограничени вещни права"
    summary: "Придобиване на собственост, право на строеж, сервитути."
  - title: "Устройствени планове"
    summary: "Общ и подробен устройствен план, предназначение на територията, показатели на застрояване."
  - title: "Разрешаване на строителството и въвеждане в експлоатация"
    summary: "Одобряване на проектите, разрешение за строеж, контрол и разрешение за ползване."
  - title: "Обществени поръчки"
    summary: "Възложители, видове процедури и изисквания при възлагане на проектиране и строителство."
  - title: "Договори в строителството"
    summary: "Договор за проектиране и за строителство – страни, съдържание, изпълнение и отговорност."
  - title: "Правни аспекти на опазването на околната среда"
    summary: "Оценка на въздействието върху околната среда и изисквания към строителните отпадъци."
