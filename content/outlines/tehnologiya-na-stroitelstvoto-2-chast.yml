title: "Технология на строителството – II част"
slug: "tehnologiya-na-stroitelstvoto-2-chast"
summary: "Как се изграждат цели сгради и съоръжения: монтаж на конструкции, зидарии, кофражни системи и покривни работи."
why: "С тези методи се разработва строително-технологичният проект – изборът на кран, монтажна схема и строителна система за конкретната сграда."
related: ["Технология на строителството – I част"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Главите следват архивната анотация на ВСУ за „Технология на строителните процеси“ (код ССС-34, учебен план от 2014 г., два семестъра: 45+15 и 45+15 часа) – под това име дисциплината е в онзи план. Анотацията е обща за двата семестъра; разделянето на темите между I и II част тук е предположение. За УАСГ са отворени само кратките анотации в ECTS пакетите (https://old.uacg.bg/filebank/ECTS-NOW/STR/SSS_A.pdf и https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf) – те не изброяват теми, но не противоречат на това разделяне. Актуална учебна програма не е намерена."
chapters:
  - title: "Монтаж на строителни конструкции – структура на процеса"
    summary: "От какви етапи се състои монтажът и какво се решава преди началото му."
  - title: "Транспортиране и складиране на сглобяеми елементи"
    summary: "Как елементите се превозват, приемат и подреждат на площадката."
  - title: "Подготвителни и основни монтажни процеси"
    summary: "Окачване, повдигане, поставяне, временно укрепване и окончателно закрепване на елементите."
  - title: "Методи за монтаж и избор на механизация"
    summary: "Методи за монтаж на конструкции, избор на кран и технически средства, монтажни схеми."
  - title: "Монтаж на съоръжения с метална и стоманобетонна конструкция"
    summary: "Особености при монтажа на едноетажни промишлени сгради и инженерни съоръжения."
  - title: "Зидарии и строителни разтвори"
    summary: "Видове зидарии и разтвори, правила за изпълнение, зидане с леки бетонни и керамични блокове."
  - title: "Организация на работното място при зидарски работи"
    summary: "Подреждане на материалите, скелето и работниците, така че зидането да върви без прекъсване."
  - title: "Изграждане на сгради със системни и едроразмерни кофражи"
    summary: "Технология на монолитното строителство със съвременни кофражни системи, вкл. катерещ се кофраж."
  - title: "Сгради с предплочи, предстени и топлоизолиращи кофражи"
    summary: "Комбинирани системи, в които сглобяеми елементи или изолационни блокове остават в конструкцията."
  - title: "Покривни работи"
    summary: "Изпълнение на скатни покриви с керемиди и на плоски покриви с рулонни материали."
