title: "Масивни конструкции"
slug: "masivni-konstruktsii"
summary: "Основи на бетонните и стоманобетонните конструкции: материали, работа на елементите, армиране и конструктивни системи на сгради."
why: "Строителният мениджър чете армировъчни чертежи, следи изпълнението и говори на един език с конструктора."
related: ["Стоманобетон", "Стоманобетонни конструкции", "Специални стоманобетонни конструкции"]
source:
  status: "unverified"
  url: ""
  note: "В учебния план на УАСГ за „Управление в строителството“ дисциплината е вписана (код RCSbCBC, 45 часа лекции, катедра „Масивни конструкции“), но в информационния пакет с анотации и на страницата на катедрата не е намерена анотация или конспект. Главите са по стандартното съдържание на уводен курс по стоманобетон за неконструктори."
chapters:
  - title: "Бетон, армировка и стоманобетон"
    summary: "Същност на стоманобетона, класове бетон и армировъчна стомана, съвместна работа на двата материала."
  - title: "Основи на проектирането"
    summary: "Гранични състояния, въздействия, комбинации и коефициенти на сигурност в рамката на Еврокодовете."
  - title: "Елементи на огъване: плочи и греди"
    summary: "Как работи огънатото сечение, надлъжна и напречна армировка, основни проверки."
  - title: "Колони и стени"
    summary: "Натиск с огъване, стройност, армиране на колони и стоманобетонни стени."
  - title: "Пукнатини, провисвания и дълготрайност"
    summary: "Експлоатационни изисквания, бетонно покритие и влияние на средата върху конструкцията."
  - title: "Конструиране и армировъчни чертежи"
    summary: "Закотвяне и снаждане, кофражни и армировъчни планове, спецификации на армировката."
  - title: "Подови конструкции и стълби"
    summary: "Гредови и безгредови плочи, стълби – видове и принципи на армиране."
  - title: "Фундаменти и подпорни стени"
    summary: "Единични, ивични и плочести фундаменти, подпорни стени – предназначение и армиране."
  - title: "Конструктивни системи на сгради"
    summary: "Скелетни и стенни системи, монолитно и сглобяемо изпълнение, поведение при земетръс."
  - title: "Предварително напрегнати и сглобяеми елементи"
    summary: "Идея на предварителното напрягане, сглобяеми елементи, изисквания при изпълнението."
