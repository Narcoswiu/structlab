title: "Иновации в управлението на строителството"
slug: "inovatsii-v-upravlenieto-na-stroitelstvoto"
summary: "Съвременните подходи и технологии, които променят управлението на строителни проекти, и начинът за внедряването им във фирмата."
why: "Фирмите, които въвеждат цифрови модели, сглобяемо строителство и нови форми на договаряне, строят по-бързо и с по-малко загуби."
related: ["Строително информационно моделиране (BIM)", "Информационни системи за управление на проекти"]
source:
  status: "unverified"
  url: ""
  note: "Официалната страница на дисциплината в УАСГ (old.uacg.bg, специалност „Управление в строителството“, катедра „Организация и икономика на строителството“) съществува, но съдържа само катедра и преподавател – без анотация и без програма. В ECTS пакета с анотации на специалността (US_A.pdf) дисциплината липсва. Съдържанието на тази дисциплина зависи силно от преподавателя; главите са обичайните теми за такъв курс и не са сверени с учебна програма – да се проверят с катедрата."
chapters:
  - title: "Иновации – същност и видове"
    summary: "Продуктови, технологични, организационни и управленски иновации."
  - title: "Иновационен процес"
    summary: "От идеята до внедряването; разпространение на иновациите в отрасъла."
  - title: "Особености на иновациите в строителството"
    summary: "Уникални обекти, много участници и ниска производителност като пречки и стимули."
  - title: "Цифровизация и информационно моделиране"
    summary: "Цифров модел на строежа като основа за планиране, координация и контрол."
  - title: "Индустриализирано и модулно строителство"
    summary: "Заводско производство на елементи и модули и влиянието му върху организацията."
  - title: "Щадящо строителство"
    summary: "Намаляване на загубите, планиране „от края към началото“, поток на работата."
  - title: "Интегрирано изпълнение на проекти"
    summary: "Ранно включване на строителя и съвместни форми на договаряне."
  - title: "Устойчиво строителство и кръгова икономика"
    summary: "Жизнен цикъл на сградата, ресурсна ефективност, повторна употреба."
  - title: "Автоматизация и данни от строителната площадка"
    summary: "Роботизирани процеси, сензори, заснемане и анализ на данни за напредъка."
  - title: "Внедряване на иновации и управление на промяната"
    summary: "Оценка на ползите, съпротива срещу промяната, обучение на хората."
