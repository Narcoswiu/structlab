title: "Ценообразуване в строителството"
slug: "tsenoobrazuvane-v-stroitelstvoto"
summary: "Как се определя цената на строителството: количествени сметки, анализи на единични цени, сметна документация и оферти."
why: "Всяка оферта, договор и разплащане на обект стъпват на количествена сметка и обосновани единични цени."
related: ["Икономика на строителството", "Счетоводство в строителството", "Финансово управление на проекти"]
source:
  status: "unverified"
  url: ""
  note: "Страницата на дисциплината за „Управление в строителството“ в УАСГ (https://old.uacg.bg/?p=210&l=1&id=2262&m=40, катедра „Организация и икономика на строителството“) е без анотация и без приложени файлове; дисциплината липсва в информационния пакет с анотации на специалността. Планът е по стандартното съдържание на дисциплината; нормативните документи и действащите норми да се добавят по програмата на катедрата."
chapters:
  - title: "Особености на строителната продукция и на цената ѝ"
