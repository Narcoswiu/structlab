  - title: "Разходни норми"
    summary: "Норми за разход на труд, материали и механизация за единица работа."
  - title: "Преки разходи"
    summary: "Разходи за труд, материали и механизация и определянето им по видове работи."
  - title: "Допълнителни разходи и печалба"
    summary: "Допълнителни разходи върху труд и механизация, доставно-складови разходи, печалба."
  - title: "Анализ на единична цена"
    summary: "Съставяне на анализ на единичната цена за вид строителна работа."
  - title: "Сметна документация на обекта"
    summary: "Количествено-стойностна сметка и обобщена стойност на строителния обект."
  - title: "Окрупнени показатели и прогнозна стойност"
    summary: "Оценка на стойността в ранна фаза по окрупнени показатели."
  - title: "Офертна цена и участие в търгове"
    summary: "Формиране на офертата, ценови риск и непредвидени разходи."
  - title: "Договорни цени и разплащане"
    summary: "Видове договорни цени, отчитане на изпълнените работи и изменение на цените."
  - title: "Софтуер за ценообразуване"
    summary: "Съставяне на сметки и анализи със специализирани програми."
