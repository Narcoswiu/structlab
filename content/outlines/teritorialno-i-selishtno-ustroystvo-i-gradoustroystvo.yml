title: "Териториално и селищно устройство и градоустройство"
slug: "teritorialno-i-selishtno-ustroystvo-i-gradoustroystvo"
summary: "Как се устройват територията и населените места: видове територии, устройствени планове, застрояване, улична мрежа и инфраструктура."
why: "Всеки строеж се разполага според устройствен план – инженерът трябва да чете регулацията, показателите на застрояване и връзките с инфраструктурата."
related: ["Урбанизъм"]
source:
  status: "unverified"
  url: ""
  note: "Официална учебна програма или анотация на ВСУ за тази дисциплина не е намерена: в архивираната страница с анотации за специалност ССС (план 2014) дисциплината липсва, а за специалностите „Строително инженерство“ и „Строителен мениджмънт“ не открихме публикувани анотации. Главите следват обичайното съдържание на дисциплината за строителни инженери – да се сверят с програмата на катедрата."
chapters:
  - title: "Устройство на територията – понятия и нормативна уредба"
    summary: "Цели на устройственото планиране, участници и основни нормативни изисквания."
  - title: "Видове територии и предназначение на имотите"
    summary: "Урбанизирани, земеделски, горски и защитени територии; предназначение на поземлените имоти."
  - title: "Устройствени схеми и планове"
    summary: "Общ и подробен устройствен план – обхват, съдържание и връзка между тях."
  - title: "Селищна мрежа и структура на населеното място"
    summary: "Видове населени места, функционално зониране и структурни елементи на града."
  - title: "Жилищни територии"
    summary: "Видове жилищно застрояване, жилищни групи и комплекси, обслужване на жителите."
  - title: "Показатели и правила на застрояване"
    summary: "Плътност и интензивност на застрояване, озеленяване, височина, отстояния и линии на застрояване."
  - title: "Производствени и обслужващи територии"
    summary: "Производствени, складови и обществено-обслужващи зони и изискванията към тях."
  - title: "Зелена система и територии за отдих"
    summary: "Паркове, градини и открити пространства; рекреационни територии."
  - title: "Комуникационно-транспортна система"
    summary: "Класификация на уличната мрежа, напречни профили, паркиране и обществен транспорт."
  - title: "Инженерна инфраструктура и вертикално планиране"
    summary: "Мрежи на техническата инфраструктура и оформяне на терена за отводняване и застрояване."
  - title: "Регулация и урегулиране на имотите"
    summary: "Улична и вътрешна регулация, урегулирани поземлени имоти, прилагане на подробния план."
