title: "Автоматизация на инженерния труд – I част"
slug: "avtomatizatsiya-na-inzhenerniya-trud-1-chast"
summary: "Работа с компютърни системи, електронни таблици и основи на програмирането за автоматизиране на инженерни изчисления."
why: "Количествените сметки, графиците и справките в строителството се правят с таблици и малки програми."
related: ["Автоматизация на инженерния труд – II част", "Автоматизация на инженерния труд", "Програмиране и използване на изчислителните системи", "Информатика"]
source:
  status: "unverified"
  url: ""
  note: "В учебния план на УАСГ за „Управление в строителството“ дисциплината е в I семестър с 30 ч. лекции и 45 ч. упражнения и 5 кредита, но във файла с анотации няма анотация за нея и друга официална програма не е намерена. Главите са предположение по анотациите на сродните дисциплини в ССС („Програмиране и използване на изчислителните системи“ и „Автоматизация на инженерния труд“); разпределението между I и II част не е потвърдено."
chapters:
  - title: "Компютърни системи"
    summary: "Апаратна и програмна част на компютъра, видове софтуер."
  - title: "Операционни системи, файлове и мрежи"
    summary: "Организация на файловете, споделяне на данни и работа в мрежа."
  - title: "Електронни таблици: формули и функции"
    summary: "Адресиране, формули, вградени функции и проверка на резултатите."
  - title: "Обработка и представяне на данни"
    summary: "Сортиране, филтриране, обобщаване и диаграми в електронна таблица."
  - title: "Алгоритми"
    summary: "Видове алгоритми и описанието им с блок-схеми."
  - title: "Типове данни, променливи и изрази"
    summary: "Основни типове, аритметични, логически и релационни операции."
  - title: "Разклонения и цикли"
    summary: "Условно изпълнение и повторение на действия в програмата."
  - title: "Функции и автоматизиране на изчисления"
    summary: "Собствени функции и макроси за повтарящи се инженерни сметки."
  - title: "Работа с файлове"
    summary: "Четене и запис на данни във файл и обмен между програми."
