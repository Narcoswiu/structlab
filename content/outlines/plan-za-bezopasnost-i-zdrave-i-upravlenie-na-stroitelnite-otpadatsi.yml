title: "План за безопасност и здраве и управление на строителните отпадъци"
slug: "plan-za-bezopasnost-i-zdrave-i-upravlenie-na-stroitelnite-otpadatsi"
summary: "Как се съставят планът за безопасност и здраве и планът за управление на строителните отпадъци за един строеж."
why: "Двата плана са част от проекта на всеки строеж и без тях строителството не може да започне – инженерът ги изготвя и ги прилага на обекта."
related: ["Здравословни и безопасни условия на труд", "ЗБУТ в строителството", "Организация на строителството"]
source:
  status: "unverified"
  url: ""
  note: "Официална програма или анотация на ВСУ за тази дисциплина не е намерена: в архивните анотации (учебен план от 2014 г.) дисциплината липсва, а актуални учебни програми ВСУ не публикува. Главите са по стандартното съдържание на темата в строителното инженерство и трябва да се проверят с преподавателя. Номера на нормативни актове нарочно не са посочени."
chapters:
