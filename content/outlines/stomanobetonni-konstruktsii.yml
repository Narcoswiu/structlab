title: "Стоманобетонни конструкции"
slug: "stomanobetonni-konstruktsii"
summary: "Проектиране на носещи стоманобетонни конструкции на сгради: рамки, стени, подови конструкции и фундаменти, вкл. в сеизмични райони."
why: "С тези знания се избира конструктивна система на сграда и се изготвя конструктивният ѝ проект."
related: ["Стоманобетон", "Специални стоманобетонни конструкции", "Проектиране на стоманобетонни конструкции за сеизмични въздействия", "Масивни конструкции"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=179&l=1&f=2&dp=22&id=506"
  note: "Кратка анотация на УАСГ (катедра „Масивни конструкции“, ССС) – същата е в информационния пакет https://old.uacg.bg/filebank/ECTS-NOW/STR/SSS_A.pdf; допълнена с архивната анотация на ВСУ (ССС-33, план 2014). Номериран конспект не е намерен – разбивката на глави е наша по темите от анотациите."
chapters:
  - title: "Видове стоманобетонни конструкции на сгради"
    summary: "Класификация: скелетни и безскелетни, монолитни и сглобяеми, едноетажни и многоетажни; области на приложение."
  - title: "Въздействия и изчислителни модели"
    summary: "Натоварвания върху сградите, предварителен избор на сечения, равнинни и пространствени модели."
  - title: "Сеизмично въздействие и принципи на проектиране"
    summary: "Сеизмично райониране, представяне на въздействието и основни изисквания на БДС EN 1998-1 към сградите."
  - title: "Подови конструкции"
    summary: "Гредови и безгредови плочи – определяне на усилията, оразмеряване и конструиране на армировката."
  - title: "Монолитни рамкови конструкции"
    summary: "Многоетажни рамки – усилия, оразмеряване и конструиране на греди, колони и възли."
  - title: "Стенни конструкции"
    summary: "Стоманобетонни стени и ядра – поведение, изчисляване и армиране; сгради със стени и смесени системи."
  - title: "Едноетажни и сглобяеми конструкции"
    summary: "Едноетажни рамкови сгради от монолитни и сглобяеми елементи, едропанелни сгради, съединения."
  - title: "Предварително напрегнати конструкции за сгради"
    summary: "Приложение на предварителното напрягане при греди, плочи и покривни елементи на сгради."
  - title: "Фундаментни конструкции"
    summary: "Единични, ивични и плочести фундаменти – видове, изчисляване и конструиране на армировката."
