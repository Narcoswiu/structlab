title: "Строителни материали"
slug: "stroitelni-materiali"
summary: "Състав, строеж и свойства на строителните материали, изпитването им и изборът на подходящ материал за строежа."
why: "Инженерът избира, окачествява и контролира материалите, които се влагат в конструкцията – най-вече бетона и стоманата."
related: ["Строителни материали и изолации", "Строителни изолации"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&m=3&id=571"
  note: "Официална страница на дисциплината в УАСГ (катедра „Строителни материали и изолации“, специалност ССС): кратка анотация и списък на темите от упражненията (керамика, добавъчни материали, вар и гипс, цимент, дървесина, бетон, разтвори, полимери, изолационни материали, битуми, метали). Главите следват тези теми; изпитният конспект не е отварян."
chapters:
  - title: "Строеж и основни свойства на материалите"
    summary: "Връзка състав – структура – свойства; физични, механични и топлотехнически свойства; дълготрайност."
  - title: "Естествени скални и керамични материали"
    summary: "Видове скали и приложението им; тухли, керемиди и други керамични изделия и изпитването им."
  - title: "Добавъчни материали"
    summary: "Пясък, речен чакъл и трошен камък: зърнометричен състав, обемна плътност, влажност и изисквания."
  - title: "Въздушни свързващи вещества"
    summary: "Строителна вар и строителен гипс: получаване, втвърдяване, свойства и приложение."
  - title: "Цимент"
    summary: "Портландциментов клинкер, хидратация, видове цименти, физични и механични свойства и изпитването им."
  - title: "Бетонна смес и втвърден бетон"
    summary: "Консистенция и обработваемост, якост на натиск, модул на еластичност, фактори и добавки за бетон."
  - title: "Проектиране на състава и контрол на бетона"
    summary: "Определяне на състава, бетонова проба, безразрушителни методи и управление на съответствието на якостта."
  - title: "Строителни разтвори"
    summary: "Видове разтвори за зидария, мазилки и замазки, свойства и определяне на състава."
  - title: "Метали"
    summary: "Строителни стомани и алуминиеви сплави, работна диаграма при опън, твърдост и технологични свойства."
  - title: "Дървесина и дървесни материали"
    summary: "Строеж на дървесината, влажност, якостни свойства, пороци и защита."
  - title: "Полимерни материали и битуми"
    summary: "Полимери и еластомери в строителството; битуми – свойства, марки и приложение."
  - title: "Топлоизолационни и хидроизолационни материали"
    summary: "Видове изолационни материали, основни показатели и области на приложение."
