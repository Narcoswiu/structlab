title: "Метод на крайните елементи"
slug: "metod-na-kraynite-elementi"
summary: "Как едномерни, двумерни и тримерни задачи на строителната механика се свеждат до матрици на коравина и система уравнения."
why: "Методът стои зад всички съвременни програми за анализ на конструкции и без него резултатите им не могат да се оценят."
related: []
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS/SE/FEMbCBC6SE.pdf"
  note: "Анотация от ECTS пакета на УАСГ (ССС, VI семестър, 30/30 ч.) – кратък текст, без номерирани теми; главите разгръщат изброените в нея етапи. Темите за равнинния триъгълен елемент са сверени с архивната анотация на ВСУ (ССС-26) – https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153."
chapters:
  - title: "Идея и етапи на метода"
    summary: "Дискретизация, неизвестни възлови премествания и главни стъпки на решението."
  - title: "Прътов елемент при опън и натиск"
    summary: "Апроксимация на преместванията, матрица на коравина и приложение за ферми."
  - title: "Греден и рамков елемент"
    summary: "Матрица на коравина при огъване, локални и глобални оси, трансформация."
  - title: "Глобална матрица на коравина"
    summary: "Сглобяване от елементните матрици, вектор на свободните членове и гранични условия."
  - title: "Решаване на системата и определяне на усилията"
    summary: "Линейни алгебрични уравнения, възлови премествания и обратен ход към разрезните усилия."
  - title: "Механо-математическа формулировка"
    summary: "Зависимости от теорията на еластичността и принцип на възможните премествания."
  - title: "Равнинни крайни елементи"
    summary: "Триъгълен елемент с шест степени на свобода и правоъгълен елемент за равнинната задача."
  - title: "Изопараметрични елементи и числено интегриране"
    summary: "Функции на формата в естествени координати и интегриране по Гаус."
  - title: "Крайни елементи за огъване на плочи"
    summary: "Степени на свобода, матрица на коравина и определяне на моментите в плочата."
  - title: "Тримерни крайни елементи"
    summary: "Тетраедърни и призматични елементи за масивни тела."
  - title: "Сходимост и точност"
    summary: "Условия за сходимост, сгъстяване на мрежата и оценка на получените напрежения."
  - title: "Алгоритми за компютърна реализация"
    summary: "Номерация, съхранение на матрицата и последователност на изчисленията в програмата."
