title: "Компютърни системи в организация на строителството"
slug: "kompyutarni-sistemi-v-organizatsiya-na-stroitelstvoto"
summary: "Работа със специализирани програми за количествени сметки, ценообразуване и календарни графици на строежа."
why: "Офертите, сметките и графиците в строителните фирми се изготвят с такива програми – това е ежедневната работа на инженера по организация."
related: ["Организация на строителството"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивна анотация на ВСУ за избираемата дисциплина със същото име (код ССС-44.3, учебен план от 2014 г., VIII семестър, 30 ч. упражнения, текуща оценка). Анотацията изброява конкретни програмни продукти и работата с тях; тук темите са описани по предназначение, без имена на продукти. Кои програми се ползват днес не е известно – актуална програма на ВСУ не е публикувана."
chapters:
  - title: "Програми за количествено-стойностни сметки – основни понятия"
    summary: "Работни модели, създаване на нов файл, основен екран и таблици."
  - title: "Въвеждане на видове и обеми на строителните работи"
    summary: "Създаване и редактиране на таблици, въвеждане на видовете работи и техните количества."
  - title: "Подробна количествена сметка"
    summary: "Съставяне на количествена сметка за обект в програмна среда."
  - title: "Ценообразуване и работа с различни валути"
    summary: "Образуване на единични цени и стойностна сметка, преизчисляване във валута."
  - title: "Анализи на цени и бази данни"
    summary: "Създаване на анализи на единични цени и на собствена база данни с разходни норми."
  - title: "Филтри и справки"
    summary: "Подбор на данни с работни филтри и извеждане на справки и отчети."
  - title: "Програми за календарно планиране"
    summary: "Основни понятия и определения при съставяне на график на строежа с програма за управление на проекти."
