title: "Физика"
slug: "fizika"
summary: "Основните физични явления и закони – механика, трептения и вълни, топлина, електричество – с приложения в строителството."
why: "Физиката обяснява товарите, трептенията, шума, топлинните загуби и влагата, с които строителният инженер работи във всеки проект."
related: ["Строителна физика"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/SSS_A.pdf"
  note: "УАСГ, анотации към учебния план на ССС (ECTS пакет): разделите са изброени в анотацията на „Физика“. Тя дава само раздели – разбивката на глави вътре в тях е наша. За ВСУ програма по физика не е намерена (в архивните анотации на ССС, план 2014, дисциплината липсва)."
chapters:
  - title: "Физични величини, единици и измервания"
    summary: "Система SI, преки и косвени измервания, оценка на грешката при лабораторна работа."
  - title: "Динамика на материална точка"
    summary: "Закони на Нютон, видове сили, импулс и движение под действие на сили."
  - title: "Работа, енергия и закони за запазване"
    summary: "Работа и мощност, кинетична и потенциална енергия, запазване на енергията и импулса."
  - title: "Динамика на идеално твърдо тяло"
    summary: "Въртеливо движение, момент на сила, инерционен момент и момент на импулса."
  - title: "Механика на флуиди"
    summary: "Налягане, закони на Паскал и Архимед, уравнение на Бернули, вискозитет."
  - title: "Трептения"
    summary: "Хармонични, затихващи и принудени трептения, резонанс."
  - title: "Вълни и акустика"
    summary: "Механични вълни, интерференция, звук, интензитет и ниво на звука."
  - title: "Молекулна физика"
    summary: "Идеален газ, молекулно-кинетична теория, температура и разпределение на молекулите."
  - title: "Термодинамика"
    summary: "Първи и втори принцип, топлинни процеси, цикли и ентропия."
  - title: "Топлопроводност и явления на пренос"
    summary: "Топлопроводност, дифузия и вътрешно триене – общи закономерности на преноса."
  - title: "Електричество и магнетизъм"
    summary: "Електрично поле, постоянен ток, магнитно поле и електромагнитна индукция."
  - title: "Фотометрия, радиоактивност и дозиметрия"
    summary: "Светлинни величини, радиоактивно разпадане, дози и защита от йонизиращи лъчения."
