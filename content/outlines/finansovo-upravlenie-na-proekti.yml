title: "Финансово управление на проекти"
slug: "finansovo-upravlenie-na-proekti"
summary: "Бюджет, парични потоци, финансиране, контрол на разходите и финансова оценка на строителен проект."
why: "Ръководителят на проект отговаря обектът да се изпълни в рамките на бюджета и да има пари за всяко плащане в срок."
related: ["Корпоративни финанси", "Ценообразуване в строителството", "Счетоводство в строителството", "Бизнес планиране"]
source:
  status: "unverified"
  url: ""
  note: "Страницата на дисциплината за „Управление в строителството“ в УАСГ (https://old.uacg.bg/?p=210&l=1&id=2261&m=40, катедра „Организация и икономика на строителството“) е без анотация и без приложени файлове; дисциплината липсва в информационния пакет с анотации на специалността. Планът е по стандартното съдържание на дисциплината."
chapters:
  - title: "Проектът като финансов обект"
    summary: "Жизнен цикъл на проекта, участници и финансови цели."
  - title: "Стойност на парите във времето"
    summary: "Олихвяване и дисконтиране на паричните потоци на проекта."
  - title: "Оценка на разходите на проекта"
    summary: "Методи за оценка на разходите в различните фази и точност на оценката."
  - title: "Бюджет на проекта"
    summary: "Съставяне на бюджет по дейности и във времето, резерви за непредвидени разходи."
  - title: "Парични потоци и план за плащанията"
    summary: "Прогноза на постъпленията и плащанията по графика на изпълнение."
  - title: "Източници и схеми за финансиране"
    summary: "Собствени средства, заеми, авансови плащания и публично финансиране."
  - title: "Показатели за финансова ефективност"
    summary: "Нетна настояща стойност, вътрешна норма на възвръщаемост и срок на откупуване."
  - title: "Финансов риск"
    summary: "Анализ на чувствителността, сценарии и мерки срещу финансовия риск."
  - title: "Контрол на разходите"
    summary: "Сравняване на план и изпълнение, метод на спечелената стойност, прогноза до завършване."
  - title: "Финансови условия на договорите"
    summary: "Схеми на плащане, гаранции, удръжки и управление на промените в цената."
  - title: "Финансово отчитане и приключване на проекта"
    summary: "Отчети пред възложителя и финансиращите страни, окончателно разплащане."
