title: "Инженерна геология и хидрогеология"
slug: "inzhenerna-geologiya-i-hidrogeologiya"
summary: "Скали и строителни почви, геоложки процеси, подземни води и проучванията, с които се опознава земната основа."
why: "Всяка сграда стъпва върху земна основа – от нея зависят фундирането, изкопите и устойчивостта на склоновете."
related: ["Инженерна геология", "Земна механика и фундиране"]
source:
  status: "unverified"
  url: ""
  note: "Не е намерена публикувана програма; главите покриват изпитните теми на курса."
chapters:
  - title: "Строеж на Земята и скалообразуващи минерали"
    summary: "От какво е направена Земята на дълбочина и от какви минерали са скалите, върху които строим."
  - title: "Магмени, седиментни и метаморфни скали"
    summary: "Трите начина, по които се ражда една скала, и как по вида ѝ се познава произходът."
  - title: "Геоложко време и тектонски структури"
    summary: "Как се подреждат пластовете по възраст и как се огъват и късат – гънки и разломи."
  - title: "Земетресения"
    summary: "Какво се случва в огнището, какво измерват магнитудът и интензивността и защо почвата под сградата променя труса."
  - title: "Изветряне, срутища и сипеи"
    summary: "Как здравата скала се превръща в късове и защо те падат или се трупат в подножието."
  - title: "Свлачища"
    summary: "Кога един склон тръгва, от какво се състои свлачището и как се проверява устойчивостта му."
  - title: "Физико-механични свойства на скалите и строителните почви"
    summary: "Числата, с които се описва земната основа: плътност, водно съдържание, порьозност, якост."
  - title: "Строителни почви и тяхната класификация"
    summary: "Свързани и несвързани почви, особени почви и как една почва получава името си."
  - title: "Водата: ерозия, карст и подземни води"
    summary: "Какво върши водата по повърхността и в дълбочина, кога разяжда бетона и колко бързо тече през почвата."
  - title: "Инженерно-геоложки проучвания"
    summary: "Как се разбира какво има под терена: сондажи и шурфове, опити на място и документите, които остават."
