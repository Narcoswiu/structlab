title: "Химия в строителството"
slug: "himiya-v-stroitelstvoto"
summary: "Химията на свързващите вещества, дисперсните системи и природните води и защо строителните материали и металите корозират."
why: "Нужна е за разбирането на цимента и бетона, избора на вода и добавки и защитата на конструкциите от корозия."
related: []
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/SSS_A.pdf"
  note: "УАСГ, анотации към учебните планове на ССС и на „Управление в строителството“ (един и същ текст в двата ECTS пакета): неорганични свързващи вещества, дисперсни системи, водно-дисперсни системи, въздействие на природни води, корозия и защита на метали. Първите две глави (основни понятия, разтвори) са добавени от нас като увод и не са в анотацията."
chapters:
  - title: "Строеж на веществото и химична връзка"
    summary: "Атоми, молекули, видове химични връзки и свойства на веществата, важни за материалите."
  - title: "Разтвори и химично равновесие"
    summary: "Концентрация, разтворимост, киселинност (pH), скорост и равновесие на реакциите."
  - title: "Колоидно-дисперсни и грубодисперсни системи"
    summary: "Видове дисперсни системи, повърхностни явления, устойчивост и коагулация."
  - title: "Третиране на водно-дисперсни системи"
    summary: "Свойства на суспензиите и основни методи за избистряне и обработка на води."
  - title: "Природни води"
    summary: "Състав, твърдост и показатели на водата; вода за строителни разтвори и бетон."
  - title: "Въздушни свързващи вещества"
    summary: "Вар и гипс – получаване, втвърдяване и химични свойства."
  - title: "Хидравлични свързващи вещества"
    summary: "Портландцимент – минерален състав, хидратация и втвърдяване."
  - title: "Въздействие на природните води върху материалите"
    summary: "Агресивни води и корозия на бетона, камъка и съоръженията."
  - title: "Корозия на металите"
    summary: "Химична и електрохимична корозия на стоманата и другите строителни метали."
  - title: "Защита от корозия"
    summary: "Покрития, инхибитори, електрохимична защита и защита на армировката."
