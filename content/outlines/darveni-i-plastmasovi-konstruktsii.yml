title: "Дървени и пластмасови конструкции"
slug: "darveni-i-plastmasovi-konstruktsii"
summary: "Дървесината като конструктивен материал, оразмеряване на елементи и съединения, дървени покриви и ферми, основи на пластмасовите конструкции."
why: "Нужна е при проектиране на дървени покриви, халета, къщи със скелет от дървесина, кофражи и скелета."
related: ["Конструкции от дървесина и конструкционни композити", "Стоманени и дървени конструкции"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивно копие на официалния сайт на ВСУ (анотации на специалност ССС, учебен план от 2014 г.); може да не е актуално. Дисциплина ССС-29 „Дървени и пластмасови конструкции“ с изброени теми и курсов проект на едноетажна складова сграда; главите следват тези теми."
chapters:
  - title: "Дървените конструкции в строителството"
    summary: "Основни видове, предимства и недостатъци, области на приложение."
  - title: "Дървесината като материал"
    summary: "Структура, сортамент, материали на дървесна основа, влияние на влажност и продължителност на товара."
  - title: "Защита от биологични повреди и пожар"
    summary: "Причини за повреди, конструктивна и химична защита, поведение при пожар."
  - title: "Оразмеряване по гранични състояния"
    summary: "Якостни и деформационни характеристики, проверки по крайни и експлоатационни гранични състояния."
  - title: "Елементи на опън, натиск и огъване"
    summary: "Проверки на сечения и елементи, устойчивост, комбинирани въздействия."
  - title: "Съединения и съединителни средства"
    summary: "Врязвания, гвоздеи, болтове, дюбели и лепила – работа и оразмеряване."
  - title: "Греди и колони"
    summary: "Греди от единични и съставени сечения, лепени греди, комбинирани стомано-дървени греди, колони."
  - title: "Дървени и стомано-дървени ферми"
    summary: "Видове, особености при проектирането, оразмеряване на пръти и възли."
  - title: "Покривни конструкции и укрепяване"
    summary: "Дървени покриви на сгради, пространствено укрепяване на равнинните конструкции."
  - title: "Пластмасови, пневматични и тентови конструкции"
    summary: "Пластмасите като конструктивен материал, съединения, особености на пневматичните и тентовите конструкции."
