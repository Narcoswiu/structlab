title: "Проектиране на стоманобетонни конструкции за сеизмични въздействия"
slug: "proektirane-na-stomanobetonni-konstruktsii-za-seizmichni-vazdeystviya"
summary: "Поведение на стоманобетонните сгради при земетръс и проектиране на рамки, стени и фундаменти по Еврокод 8."
why: "Цяла България е сеизмичен район – всеки конструктивен проект на стоманобетонна сграда минава през тези проверки."
related: ["Стоманобетон", "Стоманобетонни конструкции", "Проектиране на стоманени конструкции за сеизмични въздействия"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=179&l=1&f=2&dp=22&id=2192"
  note: "Анотация на УАСГ (катедра „Масивни конструкции“, ССС) с изброени теми: инженерна сеизмология, композиционни решения, рамкови и стенни конструкции, фундиране, усилване и възстановяване. Номериран конспект не е намерен – разбивката на глави е наша по тези теми."
chapters:
  - title: "Елементи от инженерната сеизмология"
    summary: "Земетресения, сеизмична опасност и райониране, представяне на сеизмичното въздействие със спектри."
  - title: "Основни изисквания и композиционни решения"
    summary: "Изисквания на БДС EN 1998-1, регулярност в план и по височина, избор на конструктивна система."
  - title: "Дуктилност и капацитивно проектиране"
    summary: "Класове на дуктилност, коефициент на поведение, йерархия на носимоспособностите."
  - title: "Моделиране и сеизмичен анализ"
    summary: "Изчислителни модели, метод на хоризонталните сили и модален спектрален анализ, комбинации."
  - title: "Рамкови конструкции"
    summary: "Особености при изчисляването и конструирането на греди, колони и възли в дуктилни рамки."
  - title: "Стенни конструкции"
    summary: "Плътни стени и стени с отвори, свързващи греди, ядра – изчисляване и конструиране."
  - title: "Подови диафрагми и вторични елементи"
    summary: "Работа на плочите като диафрагми, вторични сеизмични елементи, ограничаване на междуетажните премествания."
  - title: "Фундиране в сеизмични райони"
    summary: "Основни принципи, усилия за оразмеряване на фундаментите, връзки между фундаментите."
  - title: "Усилване и възстановяване"
    summary: "Оценка на съществуващи стоманобетонни конструкции и методи за усилването им."
