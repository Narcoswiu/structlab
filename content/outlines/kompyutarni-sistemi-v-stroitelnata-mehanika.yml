title: "Компютърни системи в строителната механика"
slug: "kompyutarni-sistemi-v-stroitelnata-mehanika"
summary: "Как се съставя, решава и проверява изчислителен модел на греда, рамка, ферма и плоча с програма за анализ на конструкции."
why: "Статическите изчисления в проектантската практика се правят с програми и инженерът трябва да умее да ги проверява."
related: ["Автоматизация на конструктивното проектиране", "Компютърни методи за проектиране на строителни конструкции"]
source:
  status: "unverified"
  url: ""
  note: "Официална програма или анотация на ВСУ за тази дисциплина не е намерена (vsu.bg не публикува актуални анотации; в архива по план 2014 няма дисциплина с това име). Главите следват стандартното съдържание на такъв курс."
chapters:
  - title: "От конструкция към изчислителен модел"
    summary: "Идеализация на оси, възли, опори и товари; какво програмата приема и какво пренебрегва."
  - title: "Матричен метод на преместванията"
    summary: "Алгоритъмът, по който работят програмите за прътови системи, показан на малък пример."
  - title: "Геометрия, материали и сечения"
    summary: "Въвеждане на възли и пръти, характеристики на сеченията, мерни единици и координатни оси."
  - title: "Опори, стави и връзки"
    summary: "Задаване на гранични условия, освобождаване на усилия в краищата и еластични опори."
  - title: "Товари, товарни състояния и комбинации"
    summary: "Съсредоточени и разпределени товари, температура, поддаване на опори; комбиниране."
  - title: "Статичен анализ на греди и рамки"
    summary: "Решение на модела и разчитане на диаграмите на разрезните усилия и преместванията."
  - title: "Ферми и пространствени прътови системи"
    summary: "Особености на ставните модели и на тримерните рамки."
  - title: "Плочи и стени с крайни елементи"
    summary: "Избор на елемент и мрежа, разчитане на моменти и напрежения."
  - title: "Проверка на резултатите"
    summary: "Равновесие на реакциите, деформирана форма и сравнение с ръчно решение."
  - title: "Оформяне на изчислителна записка"
    summary: "Подреждане на входните данни, схемите и резултатите в проверим документ."
