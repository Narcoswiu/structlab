title: "Дескриптивна геометрия"
slug: "deskriptivna-geometriya"
summary: "Изобразяване на пространствени обекти върху равнина – Монжова проекция, аксонометрия и перспектива – и решаване на задачи по чертеж."
why: "Развива пространственото мислене и дава основата за изработване и четене на всеки строителен чертеж."
related: ["Дескриптивна геометрия и инженерно-строителна графика", "Техническо чертане и графичен дизайн"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "ВСУ, архивно копие на официалния сайт (20.01.2018): анотация на „Дескриптивна геометрия“ (ССС-8) по учебния план на ССС от 2014 г. – 30 ч. лекции, 45 ч. упражнения, четири курсови задачи. Анотацията е стара и е за ССС; дали важи за днешните планове, не е потвърдено."
chapters:
  - title: "Проектиране и проекционни методи"
    summary: "Централно и успоредно проектиране, свойства и видове равнинни модели на пространството."
  - title: "Монжова проекция: точка, права и равнина"
    summary: "Изобразяване на основните елементи върху две и три проекционни равнини."
  - title: "Взаимни положения – афинни задачи"
    summary: "Принадлежност, успоредност и пресичане на прави и равнини."
  - title: "Метрични задачи"
    summary: "Истинска големина на отсечка, ъгъл и фигура; перпендикулярност и разстояния."
  - title: "Равнинни фигури и тела"
    summary: "Изобразяване на многостени и ротационни тела в Монжова проекция."
  - title: "Равнинни сечения на тела"
    summary: "Сечение на призма, пирамида, цилиндър и конус с равнина."
  - title: "Взаимно пресичане на тела"
    summary: "Построяване на линията на пресичане на две тела."
  - title: "Аксонометрия"
    summary: "Видове аксонометрии и изобразяване на обект по зададена Монжова проекция."
  - title: "Перспектива"
    summary: "Основни елементи, убежни точки и перспектива на обект по Монжова проекция."
  - title: "Връзки между трите модела"
    summary: "Преминаване между Монжова проекция, аксонометрия и перспектива."
