title: "Междуличностна комуникация"
slug: "mezhdulichnostna-komunikatsiya"
summary: "Как се общува ясно и убедително – устно, писмено и в екип – и как се решават конфликти и се водят преговори."
why: "Строителният инженер всеки ден говори с възложители, проектанти, работници и институции – неразбраното указание струва пари и срокове."
related: ["Развитие на лидерски умения", "Управление на човешките ресурси на проекти"]
source:
  status: "unverified"
  url: ""
  note: "Официалната страница в УАСГ (old.uacg.bg, ?p=210&l=1&id=2212&m=40) съдържа само името на катедрата – без преподавател, анотация или програма. В ECTS пакета на специалността (US_A.pdf) дисциплината липсва. Главите са по стандартното съдържание на дисциплината и не са сверени с учебна програма – да се проверят с катедрата."
chapters:
  - title: "Комуникационен процес"
    summary: "Изпращач, съобщение, канал, получател и обратна връзка; видове общуване."
  - title: "Вербална комуникация"
    summary: "Ясно изразяване, задаване на въпроси, съобразяване със слушателя."
  - title: "Невербална комуникация"
    summary: "Жестове, поза, поглед, тон и дистанция и как се тълкуват."
  - title: "Активно слушане и обратна връзка"
    summary: "Техники за слушане, перифразиране, даване и приемане на обратна връзка."
  - title: "Пречки пред общуването"
    summary: "Възприятие, предубеждения, шум и начини за преодоляването им."
  - title: "Писмена делова комуникация"
    summary: "Служебно писмо, електронна поща, доклад и протокол."
  - title: "Публично говорене и презентации"
    summary: "Подготовка, структура и поднасяне на презентация пред публика."
  - title: "Общуване в екип и водене на съвещания"
    summary: "Групова динамика, роли, подготовка и водене на работна среща."
  - title: "Конфликти"
    summary: "Причини за конфликти, стилове на поведение и пътища за разрешаване."
  - title: "Преговори"
    summary: "Подготовка, позиции и интереси, постигане на споразумение."
  - title: "Междукултурна и професионална етика на общуването"
    summary: "Общуване с хора от различни култури и правила на професионалното поведение."
