title: "Обща икономическа теория"
slug: "obshta-ikonomicheska-teoriya"
summary: "Основи на микро- и макроикономиката: избор при оскъдни ресурси, пазари, равновесие, растеж, нестабилност и политика."
why: "Дава понятията, с които инженерът разбира пазара на строителството, лихвите, инфлацията и цикъла, от които зависят поръчките и цените."
related: ["Въведение в икономиката", "Микроикономика", "Макроикономика", "Икономика на строителството"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&id=1070&m=3"
  note: "Официална страница на дисциплината в УАСГ (катедра „Обществени науки“) с анотация и приложен календарен план на лекциите за специалност ССС (https://old.uacg.bg/filebank/att_29260.pdf, 15 седмици, 30 часа, учебен план от 2023 г.). Главите следват календарния план, като близки седмици са обединени. Пълна учебна програма с литература не е отваряна."
chapters:
  - title: "Въведение в икономическата теория"
    summary: "Предмет и метод на икономическата теория, микро- и макроравнище."
  - title: "Основни концепции и икономически кръгооборот"
    summary: "Кръгооборот на продукти, ресурси, доходи и разходи в икономиката."
  - title: "Избор на потребителя и търсене"
    summary: "Оскъдност на ресурсите, избор на потребителя и формиране на търсенето на домакинството."
  - title: "Избор на производителя и предлагане"
    summary: "Оскъдност на ресурсите, избор на производителя и формиране на неговото предлагане."
  - title: "Рационалност и ефективност на избора"
    summary: "Кога изборът на потребители и фирми е рационален и ефективен."
  - title: "Продуктови и факторни пазари"
    summary: "Рационалност и ефективност на пазарите на продукти и на производствени фактори."
  - title: "Пазарни дефекти и намеса на държавата"
    summary: "Несъвършени пазари и защо се налага намеса в тях."
  - title: "Макроикономически кръгооборот и измерители"
    summary: "Основни показатели, с които се измерва икономиката като цяло."
  - title: "Макроикономическо равновесие"
    summary: "Съвкупно търсене, съвкупно предлагане и равновесие в икономиката."
  - title: "Икономически растеж и цикличност"
    summary: "Фактори на растежа и цикличната форма, в която той протича."
  - title: "Макроикономическа нестабилност"
    summary: "Теория, практика и показатели за нестабилност в икономиката."
  - title: "Макроикономическа и парична политика. Устойчиво развитие"
    summary: "Политики за намаляване на нестабилността, парична политика и устойчиво икономическо развитие."
