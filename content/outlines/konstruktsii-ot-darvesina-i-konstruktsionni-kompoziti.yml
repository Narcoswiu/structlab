title: "Конструкции от дървесина и конструкционни композити"
slug: "konstruktsii-ot-darvesina-i-konstruktsionni-kompoziti"
summary: "Оразмеряване на дървени елементи и съединения по Еврокод 5, лепени и съставени елементи, покриви, ферми, мембрани и усилване с композити."
why: "Нужна е при проектиране на дървени покриви, зали с лепени греди, къщи с дървен скелет и при усилване на стари гредореди."
related: ["Дървени и пластмасови конструкции", "Стоманени и дървени конструкции"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/att_29673.pdf"
  note: "Конспект на УАСГ за ССС, III курс (27 въпроса, февруари 2025 г.), приложен към страницата на дисциплината в катедра „Метални, дървени и пластмасови конструкции“. Главите групират въпросите от конспекта."
chapters:
  - title: "Приложение и материали"
    summary: "Ефективни области на приложение, механични характеристики на дървесината и на материалите от нея."
  - title: "Трайност и защита"
    summary: "Трайност на дървесината, защита от биологични повреди и от пожар."
  - title: "Основи на оразмеряването"
    summary: "Метод на граничните състояния с частни коефициенти по БДС EN 1995-1-1."
  - title: "Елементи на опън, натиск и огъване"
    summary: "Проверки на едноделни елементи, вкл. огъване с опън и огъване с натиск."
  - title: "Дърводелски съединения и дюбели"
    summary: "Челно опиране и врязване, възглавници, дюбели, ноктеви плочи."
  - title: "Гвоздеи, винтове и лепила"
    summary: "Клечковидни съединителни средства, изтръгване на гвоздеи и винтове, лепени съединения."
  - title: "Лепени многопластови елементи"
    summary: "Греди, рамки и дъги от лепена дървесина – конструиране, проверки и изготвяне."
  - title: "Съставени елементи с податливи съединения"
    summary: "Съставени греди и колони, греди с шперплатово стебло, комбинирани елементи от дърво и стомана."
  - title: "Покриви, ферми и сгради с дървен скелет"
    summary: "Дървени покриви, ферми, жилищни сгради с дървена конструкция, пространствено укрепяване."
  - title: "Кофражи, скелета и дървени мостове"
    summary: "Дървени конструктивни части при кофражи и скелета, основни положения при дървените мостове."
  - title: "Текстилни мембранни конструкции"
    summary: "Материали за мембранни покрития и формообразуване."
  - title: "Оценка, усилване с композити и пожарна безопасност"
    summary: "Безразрушителна оценка на якостта, усилване с армирани с нишки композити, оразмеряване за пожар."
