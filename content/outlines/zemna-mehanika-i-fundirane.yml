title: "Земна механика и фундиране"
slug: "zemna-mehanika-i-fundirane"
summary: "Свойства и поведение на строителните почви и проектиране на фундаменти, изкопи и подпорни съоръжения."
why: "Всяка сграда предава товара си на земната основа – инженерът оразмерява фундаментите и укрепва изкопа."
related: []
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&m=3&id=916"
  note: "Официална анотация на УАСГ (катедра „Геотехника“, специалност ССС) с две части: земна механика и проектиране на геотехнически конструкции. Темите съвпадат с архивната анотация на ВСУ (ССС-23, план 2014), която добавя консолидация, свлачища и фундиране в слаби почви. Конспектите не са отваряни."
chapters:
  - title: "Физични свойства и класификация на почвите"
    summary: "Състав и строеж на почвата, плътност, влажност, порьозност, консистенция и видове строителни почви."
  - title: "Лабораторни и полеви изследвания на почвите"
    summary: "Определяне на якостни и деформационни показатели в лаборатория и на терена."
  - title: "Напрежения в почвения масив"
    summary: "Напрежения от собствено тегло и от външен товар, ефективни напрежения и влияние на водата."
  - title: "Деформации, слягане и консолидация"
    summary: "Свиваемост на почвата, изчисляване на слягане и развитието му във времето."
  - title: "Якост на срязване и гранично равновесие"
    summary: "Закон на Кулон, теория на граничното равновесие и носеща способност на земната основа."
  - title: "Устойчивост на склонове и откоси"
    summary: "Методи за проверка на устойчивостта, свлачища и мерки за укрепване."
  - title: "Земен натиск и подпорни стени"
    summary: "Активен и пасивен земен натиск, видове подпорни стени и проверките им."
  - title: "Строителни изкопи и укрепителни конструкции"
    summary: "Откоси на изкопа, шпунтови и други укрепителни стени, отводняване на строителната яма."
  - title: "Плитко заложени фундаменти"
    summary: "Единични и ивични фундаменти, фундаментни скари и плочи: оразмеряване и конструиране."
  - title: "Дълбоко заложени фундаменти"
    summary: "Пилотни и кладенчови фундаменти: видове, носеща способност и ростверк."
  - title: "Фундиране в сложни геотехнически условия"
    summary: "Слаби и особени почви, усилване на основата и на съществуващи фундаменти."
