title: "Анализ на бизнес данни"
slug: "analiz-na-biznes-danni"
summary: "Подготовка, описване и визуализация на данни, регресия, прогнозиране и вземане на управленски решения по данни."
why: "С анализ на данни строителната фирма следи разходи, срокове и производителност, прогнозира цени и обосновава офертите и решенията си."
related: ["Статистика"]
source:
  status: "unverified"
  url: ""
  note: "Страницата на дисциплината в специалност „Управление в строителството“ на УАСГ (https://old.uacg.bg/?p=210&l=1&id=2225&m=40) съществува, но е без анотация и без приложена програма – дава само катедрата („Организация и икономика на строителството“). Очертанието следва стандартното съдържание на такъв курс в управленска бакалавърска специалност и стъпва на „Статистика“. Да се свери с катедрата."
chapters:
  - title: "Данните в управлението на строителната фирма"
    summary: "Видове данни и източници, етапи на анализа и въпросите, на които той отговаря."
  - title: "Събиране, почистване и подготовка на данни"
    summary: "Структуриране на таблици, липсващи и грешни стойности, обединяване на източници."
  - title: "Описателен анализ"
    summary: "Обобщаващи показатели, групиране и обобщени таблици за разходи, срокове и обеми."
  - title: "Визуализация и табла с показатели"
    summary: "Избор на подходяща диаграма, ключови показатели и табло за проследяване на проект."
  - title: "Зависимости между показатели"
    summary: "Корелация и проста линейна регресия при анализ на разходи и производителност."
  - title: "Множествена регресия"
    summary: "Модели с няколко фактора, тълкуване на коефициентите и проверка на качеството на модела."
  - title: "Динамични редове и прогнозиране"
    summary: "Тренд, сезонност, пълзящи средни и изглаждане при прогнози за цени и обеми."
  - title: "Анализ на отклоненията и сценарии"
    summary: "Сравнение план–факт, анализ на чувствителността и сценарии „какво ако“."
  - title: "Решения при неопределеност"
    summary: "Очаквана стойност, дървета на решенията и оценка на риска по данни."
