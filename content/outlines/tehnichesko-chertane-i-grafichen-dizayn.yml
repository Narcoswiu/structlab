title: "Техническо чертане и графичен дизайн"
slug: "tehnichesko-chertane-i-grafichen-dizayn"
summary: "Правилата на строителния чертеж – линии, мащаби, шрифт, означения – и изчертаване на планове на малка сграда."
why: "Чертежът е езикът на строителството: по него се строи, проверява и приема всеки обект."
related: ["Дескриптивна геометрия", "Дескриптивна геометрия и инженерно-строителна графика"]
source:
  status: "unverified"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Програма с това точно име не е намерена. Главите 1–8 следват анотацията на „Техническо чертане“ (ССС-6) от архивното копие на сайта на ВСУ (20.01.2018), учебен план на ССС от 2014 г. – само 15 ч. упражнения. Частта „графичен дизайн“ (глава 9) е наше предположение и не е потвърдена."
chapters:
  - title: "Предмет и стандарти на техническото чертане"
    summary: "Стандарти за строителни чертежи, видове чертежи, формати и мащаби."
  - title: "Чертожни материали и инструменти"
    summary: "Материали, инструменти и помагала и работа с тях."
  - title: "Видове линии и пространствено виждане"
    summary: "Типове и дебелини на линиите; задачи за пространствено виждане."
  - title: "Шрифтове и надписване"
    summary: "Видове шрифтове, особености и начини за надписване на чертежите."
  - title: "Елементи и композиция на чертежа"
    summary: "Подреждане на изображенията, антетка, оразмеряване и оформяне на листа."
  - title: "Условни графични означения"
    summary: "Означения на строителните материали в планове и разрези."
  - title: "План на малка сграда"
    summary: "Изчертаване на архитектурно разпределение на малка сграда в мащаб."
  - title: "Кофражен и армировъчен план"
    summary: "Кофражен и армировъчен план на малка сграда и характерни детайли."
  - title: "Графично оформяне и представяне на проект"
    summary: "Композиция, цвят и шрифт при оформяне на табла и проектна документация."
