title: "Предприемачество"
slug: "predpriemachestvo"
summary: "Как една идея става работещ бизнес: възможности, бизнес модел, фирма, финансиране, риск и растеж в строителния сектор."
why: "Много строителни инженери създават собствена фирма или ръководят инвестиционни проекти, където сами оценяват идеята и риска."
related: ["Бизнес планиране", "Маркетинг", "Корпоративни финанси"]
source:
  status: "unverified"
  url: ""
  note: "Страницата на дисциплината за „Управление в строителството“ в УАСГ (https://old.uacg.bg/?p=210&l=1&id=2238&m=40, катедра „Организация и икономика на строителството“) е без анотация и без приложени файлове; дисциплината липсва в информационния пакет с анотации на специалността. В УАСГ има и отделна дисциплина „Строително предприемачество“ за специалност ССС – не е отваряна. Планът е по стандартното съдържание на курс по предприемачество."
chapters:
  - title: "Същност на предприемачеството"
    summary: "Предприемач и предприемаческа дейност, роля в икономиката, видове предприемачество."
  - title: "Предприемаческа идея и оценка на възможностите"
    summary: "Източници на идеи и преценка дали една възможност си струва."
  - title: "Предприемаческа среда"
    summary: "Икономически, правни и пазарни условия за започване на бизнес."
  - title: "Бизнес модел"
    summary: "Клиенти, предлагана стойност, ресурси, приходи и разходи на новия бизнес."
  - title: "Създаване на фирма"
    summary: "Избор на правна форма, съдружници и стъпки за започване на дейност."
  - title: "Малък и среден бизнес в строителството"
    summary: "Особености на малката строителна фирма, подизпълнение и специализация."
  - title: "Предприемачество в инвестиционния процес"
    summary: "Предприемачът като инвеститор: от терена и идеята до реализацията на обекта."
  - title: "Бизнес план на начинаещата фирма"
    summary: "Съдържание на бизнес плана и използването му за привличане на средства."
  - title: "Финансиране на начинаещия бизнес"
    summary: "Собствени средства, заеми, инвеститори и публични програми."
  - title: "Риск и вземане на решения"
    summary: "Видове предприемачески риск и начини за ограничаването му."
  - title: "Растеж, иновации и етика"
    summary: "Развитие на фирмата, въвеждане на иновации и социална отговорност."
