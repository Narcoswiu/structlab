title: "Корпоративни финанси"
slug: "korporativni-finansi"
summary: "Как фирмата управлява финансите си: капиталово бюджетиране, капиталова структура, оборотен капитал и финанси на проекта."
why: "Строителната фирма решава в кои обекти и машини да инвестира, с какви средства да ги финансира и как да не остане без оборотни пари."
related: ["Финансово управление на проекти", "Счетоводство в строителството", "Икономика на строителството", "Бизнес планиране"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS-NOW/STR/US_A.pdf"
  note: "Информационен пакет с анотации на специалност „Управление в строителството“ в УАСГ (VI семестър, 5 кредита, катедра „Организация и икономика на строителството“). Анотацията назовава три основни функции – капиталово бюджетиране, капиталова структура и управление на оборотния капитал – и финансите на инвестиционния строителен проект. Анотацията за специалност ССС (https://old.uacg.bg/?p=210&l=1&id=1677&m=3) добавя инвестиции във финансови и реални активи, риск, източници на финансиране и оценка на финансовото състояние. Пълна програма по теми не е намерена – подредбата на главите е наша, по тези анотации."
chapters:
  - title: "Същност и цел на корпоративните финанси"
    summary: "Финансови решения на фирмата и максимизиране на стойността за собствениците."
  - title: "Правно-организационна и икономическа среда на бизнеса"
    summary: "Форми на търговските дружества и средата, в която те вземат финансови решения."
  - title: "Стойност на парите във времето"
    summary: "Олихвяване, дисконтиране, настояща и бъдеща стойност на парични потоци."
  - title: "Капиталово бюджетиране"
    summary: "Оценка на инвестиции в дълготрайни активи: парични потоци и критерии за избор."
  - title: "Инвестиции във финансови и реални активи"
    summary: "Особености и оценка на инвестициите в реални и във финансови активи."
  - title: "Анализ и оценка на риска при инвестиции"
    summary: "Източници на риск и методи за отчитането му при инвестиционни решения."
  - title: "Източници на финансиране"
    summary: "Собствен и привлечен капитал и начини за набирането им."
  - title: "Цена на капитала и капиталова структура"
    summary: "Цена на собствения и привлечения капитал и избор на съотношение между тях."
  - title: "Управление на оборотния капитал"
    summary: "Управление на материални запаси, вземания, парични средства и краткосрочни задължения."
  - title: "Оценка на финансовото състояние на дружеството"
    summary: "Финансови отчети и показатели за ликвидност, рентабилност и задлъжнялост."
  - title: "Финанси на инвестиционния строителен проект"
    summary: "Финансиране и парични потоци на инвестиционен проект в строителството."
