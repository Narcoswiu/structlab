title: "Математика"
slug: "matematika"
summary: "Основи на висшата математика: матрици и системи уравнения, аналитична геометрия, производни, интеграли и диференциални уравнения."
why: "Дава изчислителната основа за строителната механика, икономическите и финансовите пресмятания и статистиката в управлението на строителството."
related: []
source:
  status: "unverified"
  url: ""
  note: "Официална програма за „Математика“ в специалност „Управление в строителството“ на УАСГ не е намерена – дисциплината липсва в списъка с дисциплини на специалността в old.uacg.bg, а учебният план дава само часовете. Очертанието следва стандартен едносеместриален курс по висша математика; сходен е обхватът на курса „Математика“ на същата катедра за специалност УУЗИ (https://old.uacg.bg/?p=179&l=1&id=957&f=4&dp=45), но това е друга специалност. Да се свери с катедра „Математика“."
chapters:
  - title: "Матрици и детерминанти"
    summary: "Действия с матрици, детерминанти и обратна матрица."
  - title: "Системи линейни уравнения"
    summary: "Метод на Гаус, формули на Крамер и изследване на системи."
  - title: "Вектори и аналитична геометрия"
    summary: "Действия с вектори, уравнения на права и равнина, криви от втора степен."
  - title: "Редици, граница и непрекъснатост"
    summary: "Числови редици, граница на функция и непрекъснати функции."
  - title: "Производна и приложения"
    summary: "Правила за диференциране, екстремуми, изследване на функции и оптимизационни задачи."
  - title: "Неопределен интеграл"
    summary: "Примитивна функция и основни методи за интегриране."
  - title: "Определен интеграл и приложения"
    summary: "Пресмятане на определен интеграл, лица, обеми и други приложения."
  - title: "Функции на няколко променливи"
    summary: "Частни производни и екстремуми на функция на две променливи."
  - title: "Диференциални уравнения"
    summary: "Уравнения от първи ред и линейни уравнения с постоянни коефициенти."
