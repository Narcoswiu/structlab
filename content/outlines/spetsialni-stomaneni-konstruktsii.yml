title: "Специални стоманени конструкции"
slug: "spetsialni-stomaneni-konstruktsii"
summary: "Листови конструкции, сгради с големи отвори, многоетажни и високи сгради, предварително напрегнати стоманени конструкции."
why: "Нужна е при проектиране на резервоари, силози, зали, покрития с големи отвори и високи сгради."
related: ["Метални конструкции", "Стоманени конструкции", "Стоманени и комбинирани мостове", "Проектиране на стоманени конструкции за сеизмични въздействия"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=179&l=1&f=2&dp=21&id=525"
  note: "Анотации на УАСГ (катедра „Метални, дървени и пластмасови конструкции“): изброени са основните теми – листови конструкции, сгради с големи отвори, многоетажни и високи сгради, предварително напрегнати и комбинирани конструкции. Номериран конспект не е намерен – разбивката на глави е наша. За ВСУ програма не е намерена."
chapters:
  - title: "Листови конструкции: основи"
    summary: "Особености на тънкостенните черупки от стомана, напрегнато състояние, устойчивост, краеви ефекти."
  - title: "Вертикални цилиндрични резервоари"
    summary: "Дъно, корпус и покрив; натоварвания, оразмеряване и конструиране."
  - title: "Силози, бункери и газхолдери"
    summary: "Натоварване от насипни материали, конструктивни решения и особености при оразмеряването."
  - title: "Тръбопроводи и други листови конструкции"
    summary: "Тръбопроводи с голям диаметър и съдове под налягане – опори и проверки."
  - title: "Сгради с големи отвори: равнинни системи"
    summary: "Гредови, рамкови и дъгови покривни конструкции – композиция, изследване и детайли."
  - title: "Пространствени и висящи покривни конструкции"
    summary: "Структурни конструкции, куполи, въжени и висящи покрития – особености в поведението."
  - title: "Многоетажни и високи сгради"
    summary: "Конструктивни системи за хоризонтални товари, подови конструкции, колони и възли."
  - title: "Предварително напрегнати стоманени конструкции"
    summary: "Идея, начини на напрягане и ефект върху греди, ферми и въжени елементи."
  - title: "Комбинирани стомано-стоманобетонни елементи"
    summary: "Комбинирани греди, плочи и колони в сгради – съвместна работа и основни проверки."
