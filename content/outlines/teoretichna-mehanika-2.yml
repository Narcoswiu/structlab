title: "Теоретична механика – II част"
slug: "teoretichna-mehanika-2"
summary: "Кинематика и динамика: движение на точка и тяло, общи теореми на динамиката, уравнения на Лагранж и малки трептения."
why: "Това е основата на строителната динамика и сеизмичния анализ – как конструкцията се движи под променливи товари."
related: ["Теоретична механика – I част", "Строителна механика"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&m=3&id=778"
  note: "Официална анотация на УАСГ (катедра „Техническа механика“, специалност ССС) – само динамика; главите от 4 до 12 следват нейните теми и конспекта на УАСГ по „Теоретична механика II – Динамика“ (23 теми). Във ВСУ (архивна анотация, план 2014) втората част включва и кинематика, с курсови задачи по кинематика на точка, равнинно движение и релативно движение – затова има глави 1, 2 и 3; темите им са от раздел „Кинематика“ в конспекта на УАСГ за I част. Анотациите, конспектите и курсовите задачи са отворени и прочетени на 2026-10-09."
chapters:
  - title: "Кинематика на точка"
    summary: "Закон за движение, траектория, скорост и ускорение в декартови и в естествени координати."
  - title: "Кинематика на твърдо тяло"
    summary: "Транслация, ротация около неподвижна ос и равнинно движение: скорости, моментен център на скоростите, ускорения."
  - title: "Релативно движение на точка"
    summary: "Абсолютно, релативно и преносно движение; събиране на скорости; теорема на Кориолис."
  - title: "Динамика на абсолютното движение на частица"
    summary: "Закони на Нютон, диференциални уравнения на движението, права и обратна задача."
  - title: "Динамика на относителното движение на частица"
    summary: "Движение в неинерциална система, преносна и Кориолисова инерционна сила."
  - title: "Работа, мощност и потенциална енергия"
    summary: "Работа и мощност на сили, потенциално силово поле и потенциална енергия."
  - title: "Инерционни моменти на масите"
    summary: "Масов център, осови инерционни моменти на тела, теорема за успоредните оси."
  - title: "Теореми за количеството на движение и кинетичния момент"
    summary: "Движение на масовия център, импулс на сила, изменение и запазване на кинетичния момент."
  - title: "Теорема за кинетичната енергия"
    summary: "Кинетична енергия на тяло и на материална система, връзка с работата на силите."
  - title: "Динамика на твърдо тяло. Метод на кинетостатиката"
    summary: "Уравнения на движение при транслация, ротация и равнинно движение; инерционни сили и принцип на Д'Аламбер."
  - title: "Аналитична механика: принципи и уравнения на Лагранж"
    summary: "Връзки и обобщени координати, принцип на възможните премествания, общо уравнение на динамиката."
  - title: "Устойчивост на равновесието и малки трептения"
    summary: "Устойчивост на консервативни системи; свободни и принудени трептения с една степен на свобода."
