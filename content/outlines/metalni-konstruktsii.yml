title: "Метални конструкции"
slug: "metalni-konstruktsii"
summary: "Стомана, елементи, местна и обща устойчивост, заварени и болтови съединения, греди, ферми, колони и едноетажни сгради."
why: "Нужна е за проектиране на халета, промишлени сгради, покривни конструкции и на техните възли."
related: ["Стоманени конструкции", "Специални стоманени конструкции", "Стоманени и комбинирани мостове", "Проектиране на стоманени конструкции за сеизмични въздействия", "Стоманени и дървени конструкции"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/att_29282.pdf"
  note: "Конспект и изисквания на УАСГ за ССС, VII и VIII семестър (42 въпроса, приет от катедра „Метални, дървени и пластмасови конструкции“ през февруари 2025 г.). Главите групират въпросите от конспекта."
chapters:
  - title: "Стоманата като конструктивен материал"
    summary: "Работна диаграма, механични характеристики, класове стомани, крехко разрушаване и умора."
  - title: "Елементи на опън и центричен натиск"
    summary: "Отслабено сечение, изкълчвателна дължина и стройност, несъвършенства, европейски криви на изкълчване."
  - title: "Греди: огъване, срязване и измятане"
    summary: "Класификация на сеченията, еластична и пластична носимоспособност, обща устойчивост на греди."
  - title: "Нецентричен натиск и опън"
    summary: "Носимоспособност на сечения и устойчивост на елементи при натиск с огъване."
  - title: "Местна устойчивост на стените"
    summary: "Устойчивост при нормални и срязващи напрежения, следкритична работа, сечения клас 4 – БДС EN 1993-1-5."
  - title: "Заварени съединения"
    summary: "Методи на заваряване, челни и ъглови шевове, изчисляване, дефекти, заваръчни напрежения и деформации."
  - title: "Болтови съединения"
    summary: "Срязване, смачкване и опън, високоякостни болтове на триене, категории, фланцеви съединения – БДС EN 1993-1-8."
  - title: "Съставени пълностенни греди и гредореди"
    summary: "Композиране на сечението, проверки, местен напречен товар, ребра, монтажни снаждания, гредови скари."
  - title: "Ферми"
    summary: "Формообразуване, оразмеряване на пръти, възли с възлови плочи и възли от затворени профили."
  - title: "Колони и бази"
    summary: "Пълностенни и двуделни колони, изкълчвателни дължини в рамки, глави, възли греда–колона, бази."
  - title: "Подкранови конструкции"
    summary: "Натоварвания от кранове, конструктивни форми, локални ефекти, умора, характерни детайли."
  - title: "Едноетажни промишлени сгради"
    summary: "Рамкови конструкции и възли, несъвършенства, пространствено укрепяване, покрития и ограждания."
