title: "Устойчивост на строителните конструкции"
slug: "ustoychivost-na-stroitelnite-konstruktsii"
summary: "Определяне на критичния товар на пръти, рамки, дъги и плочи по бифуркационна теория и по деформирана схема."
why: "Стройните стоманени и стоманобетонни елементи често се разрушават от загуба на устойчивост, преди да се изчерпи якостта."
related: ["Устойчивост и динамика на строителните конструкции"]
source:
  status: "official"
  url: "https://old.uacg.bg/filebank/ECTS/SE/STBbCBC7SE.pdf"
  note: "Анотация от ECTS пакета на УАСГ (ССС, VII семестър, 30/30 ч.) – кратък текст, без номерирани теми; главите разгръщат изброените в нея теми."
chapters:
  - title: "Явлението загуба на устойчивост"
    summary: "Стройност, видове равновесие и критерии за устойчивост; критичен параметър на товара."
  - title: "Елементарни модели с крайни степени на свобода"
    summary: "Корави пръти с пружини: статичен и енергетичен подход за критичния товар."
  - title: "Бифуркационна теория за центрично натиснат прът"
    summary: "Диференциално уравнение, задача на Ойлер, критична сила и форма на изкълчване."
  - title: "Опорни условия и изкълчвателни дължини"
    summary: "Критична сила при различно подпиране, еластични опори и стъпаловидни пръти."
  - title: "Изчисляване по деформирана схема"
    summary: "Теория от II ред за натиснато-огънат прът; начални несъвършенства и нарастване на огъването."
  - title: "Устойчивост на равнинни рамки"
    summary: "Метод на преместванията с функции на осовата сила; уравнение на устойчивостта."
  - title: "Рамки по деформирана схема"
    summary: "Разрезни усилия и премествания по теория от II ред при осов и напречен товар."
  - title: "Устойчивост на дъги"
    summary: "Форми на загуба на устойчивост и критичен товар при кръгови и параболични дъги."
  - title: "Огъвно-усуквателна загуба на устойчивост"
    summary: "Тънкостенни пръти: усуквателно изкълчване и измятане на огънати греди."
  - title: "Устойчивост на плочи"
    summary: "Класическа постановка: критични напрежения на правоъгълна плоча при натиск."
