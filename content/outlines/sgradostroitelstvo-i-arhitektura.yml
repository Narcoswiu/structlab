title: "Сградостроителство и архитектура"
slug: "sgradostroitelstvo-i-arhitektura"
summary: "Елементите на сградата и тяхното изпълнение, както и основите на архитектурното проектиране на жилищни, обществени и промишлени сгради."
why: "Инженерът чете архитектурни чертежи, избира конструктивна система и решава детайлите на стени, подове и покриви във всеки проект на сграда."
related: ["Сградостроителство", "Архитектура"]
source:
  status: "official"
  url: "https://web.archive.org/web/20180120063134/http://www.vsu.bg/index.php?pid=153"
  note: "Архивирана официална страница с анотации на ВСУ за специалност ССС, учебен план от 2014 г. (дисциплина ССС-17, катедра „Сградостроителство и архитектурни конструкции“, III и IV семестър). Анотацията изброява темите на двете части – „Сградостроителство“ и „Архитектура“; главите ги следват, обединени по смисъл. По-нова учебна програма не е намерена."
chapters:
  - title: "Елементи на сградата и конструктивни системи"
    summary: "Елементи на сградата, конструктивни структури, системи и схеми, модулна система в строителството."
  - title: "Основи и защита от земна влага"
    summary: "Земни работи, плитко и дълбоко фундиране, надосновни стени, изолация от земна влага и вода."
  - title: "Монолитни и зидани стени"
    summary: "Строително-физическа характеристика на стените, лети стени и кофраж, зидани стени, комини, отвори."
  - title: "Сглобяеми стени и фасадни панели"
    summary: "Стени от блокове и панели, носещи и неносещи панели, уплътняване на фугите, окачени фасадни стени."
  - title: "Мазилки, облицовки и покрития на стените"
    summary: "Мазилки, облицовки и обшивки, бояджийски работи и тапети."
  - title: "Скелет, подови конструкции и стълби"
    summary: "Скелет на сградата, подови конструкции, балкони и лоджии, настилки, окачени тавани, стълби, асансьори."
  - title: "Покриви, врати и прозорци"
    summary: "Покривни форми и наклони, дървени покривни конструкции, скатни и плоски покриви, дограма, деформационни фуги."
  - title: "Основи на архитектурното проектиране"
    summary: "Видове сгради, достъпна среда, фази на инвестиционното проектиране, съдържание и мащаби на проектите."
  - title: "Жилищни сгради"
    summary: "Видове жилищни сгради, помещения и оразмеряването им, блокови сгради, сгради за временно обитаване."
  - title: "Обществени сгради"
    summary: "Учебни, културни, здравни, спортни, административни, търговски и транспортни сгради – типология и устройство."
  - title: "Промишлени сгради"
    summary: "Едноетажни и многоетажни промишлени сгради, конструктивни и строителни решения."
  - title: "Съвременни тенденции в проектирането на сгради"
    summary: "Връзка между функция, конструкция, технология и екология; системи за слънчево отопление."
