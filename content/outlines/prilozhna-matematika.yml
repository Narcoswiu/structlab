title: "Приложна математика"
slug: "prilozhna-matematika"
summary: "Числови, степенни и Фурие редове, приближено смятане и функции на комплексна променлива."
why: "Редовете на Фурие и приближените методи стоят зад решаването на задачи за плочи, трептения и топлопренасяне и зад числените програми за конструкции."
related: []
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&id=975&m=3&l=1"
  note: "Официална страница на дисциплината за специалност ССС в УАСГ (катедра „Математика“) с кратка анотация и приложен календарен план по седмици (https://old.uacg.bg/filebank/att_28200.pdf, 15 седмици). Пълна учебна програма с часове не е намерена. Главите следват календарния план. Анотацията споменава още апроксимация и итерационни схеми и сведения от теория на вероятностите, които не фигурират в календарния план – да се провери с катедрата."
chapters:
  - title: "Числови редове и критерии за сходимост"
    summary: "Основни понятия, сравняване на редове, критерии на Даламбер и Коши, интегрален критерий."
  - title: "Алтернативни редове"
    summary: "Критерий на Лайбниц, абсолютна и условна сходимост."
  - title: "Функционални и степенни редове"
    summary: "Област на сходимост, радиус на сходимост, диференциране и интегриране на степенен ред."
  - title: "Ред на Тейлор"
    summary: "Развитие на елементарните функции в ред на Тейлор, биномен ред."
  - title: "Степенни редове в приближеното смятане"
    summary: "Приближено пресмятане на стойности на функции и на интеграли с оценка на грешката."
  - title: "Редове на Фурие"
    summary: "Тригонометричен ред на Фурие, коефициенти, развитие в произволен интервал."
  - title: "Частни диференциални уравнения и редове на Фурие"
    summary: "Решаване на гранични задачи за частни диференциални уравнения с редове на Фурие."
  - title: "Редици и редове от комплексни числа"
    summary: "Сходимост в комплексната равнина и степенни редове в комплексна област."
  - title: "Аналитични функции"
    summary: "Непрекъснатост и производна на функция на комплексна променлива, условия за аналитичност."
  - title: "Интеграл от функция на комплексна променлива"
    summary: "Интеграл по крива в комплексната равнина, теорема и интегрални формули на Коши."
