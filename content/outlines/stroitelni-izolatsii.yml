title: "Строителни изолации"
slug: "stroitelni-izolatsii"
summary: "Проектиране и изпълнение на хидро-, топло- и звукоизолации, антикорозионна и противопожарна защита на строежи."
why: "От изолациите зависят сухите помещения, енергийната ефективност и дълготрайността на конструкцията."
related: ["Строителни материали и изолации", "Строителни материали"]
source:
  status: "official"
  url: "https://old.uacg.bg/?p=210&l=1&m=3&id=564"
  note: "Официална анотация на УАСГ (катедра „Строителни материали и изолации“, специалност ССС): хидро-, топло-, звуко-, антикорозионни и противопожарни изолации; курсов проект по антикорозионна защита. Анотацията е кратка; подтемите са сверени с архивната анотация на ВСУ за същата дисциплина (план 2014), която не е отделен източник тук."
chapters:
  - title: "Въздействия върху сградата и видове изолации"
    summary: "Вода, влага, топлина, шум, огън и агресивни среди; предназначение и класификация на изолациите."
  - title: "Хидроизолационни материали и системи"
    summary: "Битумни, полимерни и минерални хидроизолации, начини на полагане и изисквания."
  - title: "Хидроизолация на покриви"
    summary: "Плоски и скатни покриви: пластове, наклони, детайли, обшивки и отводняване."
  - title: "Хидроизолация на подземни части и фасади"
    summary: "Защита от почвена влага, безнапорна и напорна вода; фуги, пробиви и фасадни детайли."
  - title: "Топлофизични основи и топлоизолационни материали"
    summary: "Топлопроводност, съпротивление на топлопреминаване, видове топлоизолационни продукти."
  - title: "Топлотехническо оразмеряване и влажностен режим"
    summary: "Необходима топлоизолация на ограждащите елементи, дифузия на водна пара и кондензация."
  - title: "Звуко- и виброизолация"
    summary: "Въздушен и ударен шум, звукоизолиращи и звукопоглъщащи материали, конструктивни решения."
  - title: "Корозия и антикорозионна защита"
    summary: "Агресивни среди, корозия на стомана и стоманобетон, методи и покрития за защита."
  - title: "Огнезащита на строителни конструкции"
    summary: "Поведение на материалите при огън, огнезащита на стоманени, дървени и стоманобетонни конструкции."
