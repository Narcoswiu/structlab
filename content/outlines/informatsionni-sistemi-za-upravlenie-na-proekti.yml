title: "Информационни системи за управление на проекти"
slug: "informatsionni-sistemi-za-upravlenie-na-proekti"
summary: "Работа със софтуер за планиране и контрол на проекти – графици, ресурси, разходи, проследяване на изпълнението и отчети."
why: "Графикът и бюджетът на един строеж се поддържат в специализирана програма – без нея ръководителят не вижда закъсненията навреме."
related: ["Организация и управление на инвестиционни процеси – II част", "Строително информационно моделиране (BIM)", "Компютърни системи в организация на строителството"]
source:
  status: "unverified"
  url: ""
  note: "Официалната страница на дисциплината в УАСГ (old.uacg.bg, специалност „Управление в строителството“, катедра „Организация и икономика на строителството“) съществува, но съдържа само катедра и преподавател – без анотация и без програма. В ECTS пакета с анотации на специалността (US_A.pdf) дисциплината липсва. Главите са по стандартното съдържание на дисциплината и не са сверени с учебна програма – да се проверят с катедрата."
chapters:
  - title: "Информацията в управлението на проекти"
    summary: "Информационни потоци, видове информационни системи и изисквания към тях."
  - title: "Структура на работите и кодиране"
    summary: "Разбивка на проекта на работни пакети и дейности; кодове и нива."
  - title: "Календарен график в софтуерна среда"
    summary: "Дейности, продължителности, връзки, календари и ограничения."
  - title: "Критичен път и резерви"
    summary: "Изчисляване на графика, критични дейности и анализ на резервите."
  - title: "Ресурси – назначаване и изравняване"
    summary: "Ресурсен списък, натоварване, претоварване и изравняване на ресурсите."
  - title: "Разходи и бюджет на проекта"
    summary: "Свързване на разходите с дейностите, парични потоци във времето."
  - title: "Базов план и проследяване на изпълнението"
    summary: "Запазване на базов план, въвеждане на реален напредък, актуализиране."
  - title: "Метод на спечелената стойност"
    summary: "Показатели за отклонение по срок и по разходи и прогноза до завършване."
  - title: "Отчети и табла за управление"
    summary: "Стандартни и потребителски отчети за възложителя и за ръководството."
  - title: "Обща среда за данни и документооборот"
    summary: "Споделяне на документи, версии, одобряване и следа на промените."
  - title: "Връзка между графика и информационния модел"
    summary: "Обвързване на модела на строежа с времето и с разходите."
