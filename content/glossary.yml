- preferred: отвор
  symbol: "l"
  en: span
  note: "хоризонталното разстояние между двете опори на греда, дъга или въже; същата дума се ползва и за дупка в сечение (отрицателна площ) и за отвора на болт"
- preferred: стрелка
  symbol: "f"
  en: sag
  also_ok: [стрелка на провисването]
  note: "при въжета: най-голямото вертикално разстояние от хордата до въжето – размер от формата, даден в условието; да не се бърка с провисването f на греда (Глава 7), което е преместване от деформацията"
- preferred: верижна линия
  en: catenary
  note: "формата на въже под товар, равномерен по неговата дължина (собствено тегло); при товар, равномерен по хоризонталата, формата е парабола"
- preferred: закон за движение
  en: law of motion
  note: "зависимостта на положението от времето: векторно r(t), координатно x(t), y(t) или естествено s(t)"
- preferred: траектория
  en: path (trajectory)
  note: "линията, която точката описва"
- preferred: дъгова координата
  symbol: "s"
  en: arc coordinate
  note: "разстоянието по траекторията от избрано начало, със знак (m)"
- preferred: изминат път
  en: distance travelled
  note: "винаги ≥ 0; равен е на |Δs| само ако посоката на движение не се сменя"
- preferred: скорост
  symbol: "v"
  en: velocity
  note: "v = dr/dt, по допирателната към траекторията (m/s)"
- preferred: ускорение
  symbol: "a"
  en: acceleration
  note: "a = dv/dt, сочи към вдлъбнатата страна на траекторията (m/s²)"
- preferred: тангенциално ускорение
  symbol: "a_τ"
  en: tangential acceleration
  also_ok: [въртеливо ускорение, въртелива съставка]
  note: "a_τ = dv/dt, мени големината на скоростта; за точка от въртящо се тяло a_τ = ε·r; да не се бърка с тангенциалното напрежение τ"
- preferred: нормално ускорение
  symbol: "a_n"
  en: normal acceleration
  also_ok: [центростремително ускорение, центростремителна съставка]
  note: "a_n = v²/ρ, към центъра на кривината; за точка от въртящо се тяло a_n = ω²·r"
- preferred: радиус на кривината
  symbol: "ρ"
  en: radius of curvature
  note: "ρ = v²/a_n; за окръжност е радиусът ѝ"
- preferred: естествени оси
  symbol: "τ, n"
  en: natural (path) axes
  note: "τ по допирателната в посока на растящото s, n към центъра на кривината"
- preferred: права задача
  en: direct problem
  also_ok: [първа задача]
  note: "в кинематиката: по закона за движение се търсят скоростта и ускорението; в динамиката: по движението се търси силата"
- preferred: обратна задача
  en: inverse problem
  also_ok: [втора задача]
  note: "в кинематиката: по ускорението и началните условия се търси движението; в динамиката: по силите и началните условия се търси движението"
- preferred: равномерно движение
  en: uniform motion
  note: "големината на скоростта е постоянна, a_τ = 0"
- preferred: равнопроменливо движение
  en: uniformly accelerated motion
  note: "a_τ = const: v = v₀ + a·t, s = s₀ + v₀·t + a·t²/2"
- preferred: транслация
  en: translation
  also_ok: [транслационно движение]
  note: "всяка отсечка от тялото остава успоредна на себе си; всички точки имат еднакви скорости и ускорения"
- preferred: ротация
  en: rotation about a fixed axis
  also_ok: [ротационно движение, въртене около неподвижна ос]
  note: "точките от оста са неподвижни; законът е φ(t)"
- preferred: ъглова скорост
  symbol: "ω"
  en: angular velocity
  note: "ω = dφ/dt, rad/s; плюс обратно на часовниковата стрелка; ω = π·n/30 при n обороти в минута; в релативното движение ω_e е ъгловата скорост на подвижното тяло (в Глава 5 – и на Земята)"
- preferred: ъглово ускорение
  symbol: "ε"
  en: angular acceleration
  note: "ε = dω/dt, rad/s²; в помагалото на УАСГ е α; да не се бърка с относителното удължение ε"
- preferred: равнинно движение
  en: plane motion
  note: "всяка точка остава в равнина, успоредна на една неподвижна равнина: транслация с полюса и ротация около него"
- preferred: полюс
  en: pole (base point)
  note: "точката от тялото, спрямо която се записва равнинното движение; ω и ε не зависят от избора му"
- preferred: моментен център на скоростите
  symbol: "P"
  en: instantaneous centre of velocity
  also_ok: [МЦС]
  note: "точката със скорост нула в дадения момент; важи само за скоростите – ускорението ѝ по правило не е нула"
- preferred: теорема за проектираните скорости
  en: theorem of projected velocities
  note: "проекциите на скоростите на две точки от тялото върху правата през тях са равни"
- preferred: предавателно отношение
  symbol: "i_12"
  en: transmission ratio
  note: "i_12 = ω₁/ω₂ = r₂/r₁, по големина"
- preferred: релативно движение
  en: relative motion
  also_ok: [относително движение]
  note: "движението на точката спрямо подвижната система; индекс r"
- preferred: преносно движение
  en: transport motion
  note: "движението на подвижната система (тялото) спрямо неподвижната; индекс e"
- preferred: абсолютно движение
  en: absolute motion
  note: "движението на точката спрямо неподвижната система; индекс a"
- preferred: сложно движение
  en: compound motion
  note: "релативното, преносното и абсолютното движение на точка, разглеждани заедно"
- preferred: Кориолисово ускорение
  symbol: "a_c"
  en: Coriolis acceleration
  note: "a_c = 2·ω_e × v_r; в равнината 2·ω_e·v_r, с посоката на v_r, завъртяна на 90° по посока на въртенето; нула при преносна транслация"
- preferred: теорема на Кориолис
  en: Coriolis theorem
  note: "a_a = a_r + a_e + a_c"
- preferred: материална точка
  en: particle
  also_ok: [частица]
  note: "тяло, чиито размери не влияят на движението му в задачата; в кинематиката се пише само „точка“"
- preferred: маса
  symbol: "m"
  en: mass
  note: "в kg; в m·a = ΣF силата е в N (1 kN = 1000 N)"
- preferred: тегло
  symbol: "G"
  en: weight
  note: "G = m·g, g = 9,81 m/s²; измереното g вече включва преносната инерционна сила от въртенето на Земята"
- preferred: инерциална отправна система
  en: inertial frame of reference
  note: "система, в която точка без сили е в покой или се движи равномерно и праволинейно; Земята се приема за такава"
- preferred: диференциално уравнение на движението
  en: differential equation of motion
  note: "m·ẍ = ΣF_x, m·ÿ = ΣF_y; в естествени оси m·dv/dt = ΣF_τ, m·v²/ρ = ΣF_n"
- preferred: свободна точка
  en: free particle
  note: "точка без връзки"
- preferred: несвободна точка
  en: constrained particle
  note: "точка, чието движение е ограничено от връзка; връзката се заменя с реакция"
- preferred: връзка
  en: constraint
  note: "повърхност, нишка или прът, които ограничават движението"
- preferred: нормална реакция
  symbol: "N"
  en: normal reaction
  note: "реакцията на гладка връзка, по нормалата; да не се бърка с нормалната сила N (осова) от „Съпротивление на материалите“"
- preferred: сила на триене
  symbol: "F_тр"
  en: friction force
  note: "при плъзгане F_тр = μ·N, срещу плъзгането по повърхността; при покой F_тр ≤ μ·N"
- preferred: коефициент на триене
  symbol: "μ"
  en: coefficient of friction
  note: "даден в задачата; в главите се приема един и същ при покой и при плъзгане"
- preferred: сила на съпротивление
  symbol: "R"
  en: drag (resistance) force
  note: "R = b·v, срещу скоростта; b в N·s/m; модел за малки скорости"
- preferred: гранична скорост
  symbol: "v_∞"
  en: terminal velocity
  note: "v_∞ = m·g/b – скоростта, при която съпротивлението е равно на теглото"
- preferred: математично махало
  en: simple pendulum
  note: "материална точка на неразтеглива безтегловна нишка с дължина l"
- preferred: период
  symbol: "T_0"
  en: period
  note: "времето за едно пълно трептене; T_0 = 2π/k, за махало при малки амплитуди T_0 = 2π·√(l/g); точният период на махалото е τ; „T“ без индекс не се ползва за период"
- preferred: инерционна сила
  symbol: "Φ"
  en: inertia force
  note: "Φ = −m·a; не е действие на друго тяло"
- preferred: принцип на Даламбер
  en: d'Alembert's principle
  also_ok: ["принцип на Д'Аламбер"]
  note: "ΣF + N + Φ = 0 – основният закон, записан като равновесие"
- preferred: преносна инерционна сила
  symbol: "Φ_e"
  en: transport inertia force
  also_ok: [центробежна сила]
  note: "Φ_e = −m·a_e; „центробежна сила“ е само съставката m·ω_e²·r при въртящо се тяло"
- preferred: Кориолисова инерционна сила
  symbol: "Φ_c"
  en: Coriolis inertia force
  note: "Φ_c = −2m·ω_e × v_r; посоката е v_r, завъртяна на 90° срещу посоката на въртене – обратно на a_c"
- preferred: релативен покой
  en: relative rest
  note: "точката не се движи спрямо подвижното тяло: ΣF + Φ_e = 0"
- preferred: покой
  en: rest
  note: "точката не се движи; „равновесие“ остава за силите"
