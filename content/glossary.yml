# Речник на термините – единствен източник за терминологията в учебниците.
# preferred: термин, който използваме; also_ok: допустими синоними; avoid: да не се използват.
# Да се допълва при всяка нова глава. Спорни термини – да се сверят с лекциите на курса.

- preferred: напрежение
  symbol: "σ, τ"
  en: stress
  avoid: [стрес]
- preferred: нормално напрежение
  symbol: "σ"
