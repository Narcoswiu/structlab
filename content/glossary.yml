# Речник на термините – единствен източник за терминологията в учебниците.
# preferred: термин, който използваме; also_ok: допустими синоними; avoid: да не се използват.
# Да се допълва при всяка нова глава. Спорни термини – да се сверят с лекциите на курса.

- preferred: напрежение
  symbol: "σ, τ"
  en: stress
  avoid: [стрес]
- preferred: нормално напрежение
  symbol: "σ"
  en: normal stress
- preferred: тангенциално напрежение
  symbol: "τ"
  en: shear stress
  also_ok: [срязващо напрежение]
- preferred: относително удължение
  symbol: "ε"
  en: strain
  also_ok: [относителна деформация]
- preferred: разрезни усилия
  en: internal forces
  also_ok: [вътрешни усилия]
- preferred: нормална сила
  symbol: "N"
  en: axial force
- preferred: напречна сила
  symbol: "Q"
  en: shear force
- preferred: огъващ момент
  symbol: "M"
  en: bending moment
- preferred: опорна реакция
  en: support reaction
- preferred: неподвижна шарнирна опора
  en: pinned support
- preferred: подвижна шарнирна опора
  en: roller support
- preferred: запъване
  en: fixed support
  also_ok: [вграждане]
- preferred: конзола
  en: cantilever
- preferred: възел
  en: joint
- preferred: пунктирано влакно
  en: reference (dashed) fibre
- preferred: център на тежестта
  en: centroid
  also_ok: [тежище]
- preferred: статичен момент
  symbol: "S"
  en: first moment of area
- preferred: инерционен момент
  symbol: "I"
  en: second moment of area
  note: "геометрична характеристика (cm⁴); да не се бърка с масовия инерционен момент от физиката"
- preferred: центробежен инерционен момент
  symbol: "I_xy"
  en: product of inertia
  also_ok: [девиационен инерционен момент]
- preferred: полярен инерционен момент
  symbol: "I_p"
  en: polar moment of inertia
- preferred: съпротивителен момент
  symbol: "W"
  en: section modulus
  avoid: [секционен модул]
- preferred: радиус на инерция
  symbol: "i"
  en: radius of gyration
- preferred: главни оси
  en: principal axes
- preferred: неутрална ос
  en: neutral axis
- preferred: модул на еластичност
  symbol: "E"
  en: Young's modulus
  also_ok: [модул на Юнг]
- preferred: модул на срязване
  symbol: "G"
  en: shear modulus
- preferred: граница на провлачане
  symbol: "f_y"
  en: yield strength
  avoid: [граница на текучест]
- preferred: коравина
  en: stiffness
  avoid: [твърдост]
  note: "твърдост = hardness (друго свойство)"
- preferred: якост
  en: strength
- preferred: провисване
  symbol: "f"
  en: deflection
- preferred: еластична линия
  en: elastic curve
- preferred: усукване
  en: torsion
- preferred: усукващ момент
  symbol: "T"
  en: torque
- preferred: изкълчване
  en: buckling
  avoid: [бъклинг]
- preferred: свободна дължина
  symbol: "μ·L"
  en: effective (buckling) length
  also_ok: [изчислителна дължина, приведена дължина, изкълчвателна дължина]
- preferred: гъвкавост
  symbol: "λ"
  en: slenderness
  also_ok: [стройност]
- preferred: критична сила
  symbol: "F_cr"
  en: critical (Euler) load
- preferred: армировка
  en: reinforcement
- preferred: специално огъване
  en: uniaxial (plane) bending
  also_ok: [просто огъване, право огъване]
  note: "товарната равнина съдържа една от главните централни оси на сечението"
- preferred: чисто огъване
  en: pure bending
  note: "единственото разрезно усилие е огъващият момент (Q = 0)"
- preferred: неутрален слой
  en: neutral surface
- preferred: коравина на огъване
  symbol: "E·I"
  en: flexural rigidity
- preferred: допустимо напрежение
  symbol: "σ_доп"
  en: allowable stress
- preferred: пояс
  en: flange
  note: "хоризонталната част на профил „I“ или „Т“"
- preferred: стебло
  en: web
  note: "вертикалната част на профил „I“ или „Т“"
- preferred: общо огъване
  en: biaxial (unsymmetrical) bending
  also_ok: [двойно огъване, косо огъване]
  note: "товарната равнина не съдържа главна централна ос на сечението"
- preferred: столица
  en: purlin
  note: "греда от покривна конструкция, успоредна на билото"
- preferred: ъгъл на завъртане
  symbol: "φ"
  en: slope (angle of rotation)
  note: "ъгълът, на който се завърта напречното сечение при огъване; φ = w′"
- preferred: гранични условия
  en: boundary conditions
  note: "известните стойности на w и φ в опорите"
- preferred: допустимо провисване
  symbol: "f_доп"
  en: allowable deflection
- preferred: кривина
  symbol: "1/ρ"
  en: curvature
- preferred: принцип на суперпозицията
  en: principle of superposition
- preferred: полярен съпротивителен момент
  symbol: "W_p"
  en: polar section modulus
- preferred: ъгъл на усукване
  symbol: "φ"
  en: angle of twist
- preferred: относителен ъгъл на усукване
  symbol: "θ"
  en: angle of twist per unit length
  note: "θ = dφ/dx – завъртането на единица дължина"
- preferred: коравина на усукване
  symbol: "G·I_p"
  en: torsional rigidity
- preferred: нулева линия
  en: zero-stress line
  note: "геометричното място на точките с σ = 0; при N = 0 съвпада с неутралната ос"
- preferred: ядро на сечението
  en: core (kern) of the section
- preferred: ексцентрицитет
  symbol: "e"
  en: eccentricity
- preferred: нецентричен натиск
  en: eccentric compression
  note: "при опънна сила – нецентричен опън"
- preferred: коефициент на дължината
  symbol: "μ"
  en: effective length factor
  also_ok: [коефициент на привеждане на дължината]
- preferred: критично напрежение
  symbol: "σ_cr"
  en: critical stress
- preferred: гранична гъвкавост
  symbol: "λ_гр"
  en: limiting slenderness
  note: "формулата на Ойлер важи при λ ≥ λ_гр"
- preferred: граница на пропорционалност
  symbol: "σ_p"
  en: proportional limit
