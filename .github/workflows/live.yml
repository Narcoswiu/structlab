# Проверка на живия сайт отвън на всеки 6 часа – без ключове, само чете.
# Ако страница падне или вътрешна страница се отвори без вход, GitHub праща имейл.
name: Жив сайт

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Проверка на живия сайт
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/smoke-live.mts
